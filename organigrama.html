<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>Key Match · Encuentra al mejor candidato</title>
<style>
:root{
  --key:#a78bfa; --windsor:#22d3ee; --heliot:#fbbf24; --cosecha:#34d399;
  --bg:#0a0612; --card:#171226; --card-2:#1f1932;
  --border:#2a2340; --text:#f4f1fa; --muted:#9b93b8;
  --pass:#ff4d6d; --match:#ff66a3;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;overflow:hidden;font-family:'Inter',-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;background:var(--bg);color:var(--text);user-select:none}

/* Fondo con gradientes tipo app de citas */
body::before{
  content:'';position:fixed;inset:0;pointer-events:none;z-index:0;
  background:
    radial-gradient(circle at 20% 20%, rgba(255,102,163,.15) 0%, transparent 50%),
    radial-gradient(circle at 80% 80%, rgba(167,139,250,.15) 0%, transparent 50%),
    radial-gradient(circle at 50% 50%, rgba(34,211,238,.08) 0%, transparent 60%);
}

/* ============ TOPBAR ============ */
.topbar{
  position:fixed;top:0;left:0;right:0;z-index:50;height:60px;
  padding:0 18px;display:flex;align-items:center;gap:12px;
  background:rgba(10,6,18,.85);backdrop-filter:blur(20px);
  border-bottom:1px solid var(--border);
}
.brand{display:flex;align-items:center;gap:11px}
.brand-mark{
  width:38px;height:38px;border-radius:50%;
  background:linear-gradient(135deg,#ff66a3,#a78bfa);
  display:grid;place-items:center;font-size:20px;
  box-shadow:0 0 24px rgba(255,102,163,.5);
}
.brand-text h1{font-size:14px;font-weight:800;letter-spacing:-.2px}
.brand-text p{font-size:10.5px;color:var(--muted);margin-top:1px}

.progress-wrap{margin-left:auto;display:flex;align-items:center;gap:12px}
.progress-text{font-size:11.5px;color:var(--muted);font-weight:600}
.progress-bar{
  width:140px;height:5px;border-radius:5px;
  background:rgba(255,255,255,.08);overflow:hidden;
}
.progress-fill{
  height:100%;width:0%;
  background:linear-gradient(90deg,#ff66a3,#a78bfa);
  transition:width .35s cubic-bezier(.4,0,.2,1);
}

/* ============ STAGE ============ */
.stage{
  position:fixed;inset:60px 0 0 0;z-index:1;
  display:flex;align-items:center;justify-content:center;
  padding:16px;
}

.deck{
  position:relative;width:100%;max-width:400px;height:100%;max-height:720px;
}

/* ============ CARD ============ */
.card{
  position:absolute;inset:0;
  background:linear-gradient(165deg,#1f1932 0%,#171226 100%);
  border:1px solid var(--border);border-radius:26px;
  overflow:hidden;
  box-shadow:0 24px 60px rgba(0,0,0,.7);
  display:flex;flex-direction:column;
  cursor:grab;
  transition:transform .5s cubic-bezier(.4,0,.2,1), opacity .4s;
  will-change:transform;
}
.card.dragging{cursor:grabbing;transition:none}
.card.exit-left{transform:translateX(-150%) rotate(-30deg) !important;opacity:0}
.card.exit-right{transform:translateX(150%) rotate(30deg) !important;opacity:0}

/* Card cover — gradient per area */
.card-cover{
  position:relative;height:38%;min-height:200px;
  background:linear-gradient(135deg, var(--accent, #a78bfa) 0%, color-mix(in srgb, var(--accent) 40%, #000) 100%);
  display:grid;place-items:center;
  overflow:hidden;
}
.card-cover::before{
  content:'';position:absolute;inset:0;
  background:
    radial-gradient(circle at 30% 20%, rgba(255,255,255,.3) 0%, transparent 50%),
    radial-gradient(circle at 70% 80%, rgba(0,0,0,.3) 0%, transparent 50%);
}
.card-avatar{
  position:relative;z-index:1;
  width:130px;height:130px;border-radius:50%;
  background:rgba(10,6,18,.85);backdrop-filter:blur(10px);
  display:grid;place-items:center;
  font-size:44px;font-weight:800;color:var(--accent,#a78bfa);
  border:4px solid rgba(255,255,255,.4);
  box-shadow:0 12px 40px rgba(0,0,0,.6);
  letter-spacing:-1px;
}
.card-cover .card-badge{
  position:absolute;top:16px;left:16px;z-index:2;
  padding:6px 12px;border-radius:20px;
  background:rgba(10,6,18,.85);backdrop-filter:blur(10px);
  font-size:10.5px;font-weight:800;text-transform:uppercase;
  letter-spacing:.8px;color:var(--accent,#a78bfa);
}
.card-cover .card-match{
  position:absolute;top:16px;right:16px;z-index:2;
  padding:8px 14px;border-radius:20px;
  background:rgba(10,6,18,.9);backdrop-filter:blur(10px);
  border:1.5px solid var(--accent,#a78bfa);
  font-size:11px;font-weight:800;
  display:flex;align-items:center;gap:6px;
}
.match-dot{
  width:7px;height:7px;border-radius:50%;
  background:var(--accent,#a78bfa);
  box-shadow:0 0 8px var(--accent,#a78bfa);
  animation:pulse 1.8s ease-in-out infinite;
}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.4}}

.card-body{
  padding:22px;flex:1;display:flex;flex-direction:column;overflow:hidden;
}
.card-name{
  font-size:22px;font-weight:800;letter-spacing:-.5px;line-height:1.15;
}
.card-role{
  font-size:13px;color:var(--muted);margin-top:5px;font-weight:500;
}
.card-bio{
  font-size:12.5px;color:#c8c5d6;line-height:1.55;margin-top:14px;
  display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;
  overflow:hidden;
}

.match-section{margin-top:18px}
.match-label{
  font-size:10.5px;font-weight:800;text-transform:uppercase;
  letter-spacing:.9px;color:var(--muted);margin-bottom:9px;
}
.match-bar{
  height:9px;border-radius:6px;background:rgba(255,255,255,.06);
  overflow:hidden;margin-bottom:7px;
}
.match-fill{
  height:100%;border-radius:6px;
  background:linear-gradient(90deg,var(--accent,#a78bfa),#ff66a3);
  transition:width .6s cubic-bezier(.4,0,.2,1);
  box-shadow:0 0 12px var(--accent,#a78bfa);
}
.match-pct{
  font-size:11.5px;color:var(--muted);
  display:flex;justify-content:space-between;
}
.match-pct strong{color:var(--accent,#a78bfa);font-weight:800;font-size:13px}

.chips{
  display:flex;flex-wrap:wrap;gap:6px;margin-top:14px;
}
.chip{
  font-size:10.5px;padding:5px 10px;border-radius:20px;
  background:rgba(255,255,255,.06);
  border:1px solid rgba(255,255,255,.08);
  color:#d6d1e8;font-weight:600;
}
.chip.accent{
  background:color-mix(in srgb,var(--accent,#a78bfa) 15%,transparent);
  border-color:color-mix(in srgb,var(--accent,#a78bfa) 35%,transparent);
  color:var(--accent,#a78bfa);
}

.other-matches{
  margin-top:14px;padding-top:12px;border-top:1px solid var(--border);
}
.other-label{
  font-size:10px;font-weight:700;text-transform:uppercase;
  letter-spacing:.8px;color:var(--muted);margin-bottom:8px;
}
.other-row{display:flex;flex-direction:column;gap:5px}
.other-item{
  display:flex;justify-content:space-between;font-size:11px;
  color:var(--muted);
}
.other-item strong{color:#d6d1e8;font-weight:600}
.other-item .other-pct{color:#8b85a3;font-weight:700}

/* Card labels al arrastrar */
.drag-label{
  position:absolute;top:36px;z-index:10;
  padding:8px 16px;border-radius:12px;
  font-size:22px;font-weight:900;letter-spacing:2px;
  opacity:0;transition:opacity .15s;pointer-events:none;
  border:3px solid;
  transform:rotate(-12deg);
}
.drag-label.like{
  left:24px;color:var(--match);border-color:var(--match);
  background:rgba(255,102,163,.15);text-shadow:0 0 10px var(--match);
}
.drag-label.nope{
  right:24px;color:var(--pass);border-color:var(--pass);
  background:rgba(255,77,109,.15);text-shadow:0 0 10px var(--pass);
  transform:rotate(12deg);
}

/* ============ CONTROLS ============ */
.controls{
  position:fixed;bottom:20px;left:0;right:0;z-index:30;
  display:flex;justify-content:center;gap:20px;pointer-events:none;
}
.ctrl{
  width:64px;height:64px;border-radius:50%;
  display:grid;place-items:center;
  cursor:pointer;pointer-events:auto;
  border:2px solid;background:rgba(10,6,18,.85);
  backdrop-filter:blur(20px);
  transition:.25s cubic-bezier(.4,0,.2,1);
  font-size:26px;
}
.ctrl:hover{transform:scale(1.1)}
.ctrl:active{transform:scale(.95)}
.ctrl.pass{color:var(--pass);border-color:var(--pass);box-shadow:0 0 24px rgba(255,77,109,.3)}
.ctrl.pass:hover{background:rgba(255,77,109,.15);box-shadow:0 0 32px rgba(255,77,109,.5)}
.ctrl.match{color:var(--match);border-color:var(--match);box-shadow:0 0 24px rgba(255,102,163,.3)}
.ctrl.match:hover{background:rgba(255,102,163,.15);box-shadow:0 0 32px rgba(255,102,163,.5)}
.ctrl.undo{width:48px;height:48px;font-size:20px;color:var(--muted);border-color:var(--border);align-self:center}
.ctrl.undo:hover{color:#fff;border-color:var(--muted)}

/* ============ MATCH MODAL ============ */
.match-modal{
  position:fixed;inset:0;z-index:100;
  display:flex;align-items:center;justify-content:center;
  background:rgba(10,6,18,.9);backdrop-filter:blur(20px);
  opacity:0;pointer-events:none;transition:opacity .35s;
}
.match-modal.show{opacity:1;pointer-events:auto}
.match-card{
  text-align:center;padding:40px 30px;max-width:420px;
  transform:scale(.7);transition:transform .5s cubic-bezier(.34,1.56,.64,1);
}
.match-modal.show .match-card{transform:scale(1)}
.match-icon{
  font-size:80px;margin-bottom:20px;
  animation:heartbeat 1.2s ease-in-out infinite;
  filter:drop-shadow(0 0 30px rgba(255,102,163,.8));
}
@keyframes heartbeat{
  0%,100%{transform:scale(1)}
  25%{transform:scale(1.15)}
  50%{transform:scale(1)}
  75%{transform:scale(1.1)}
}
.match-title{
  font-size:32px;font-weight:900;letter-spacing:-1px;
  background:linear-gradient(135deg,#ff66a3,#a78bfa);
  -webkit-background-clip:text;-webkit-text-fill-color:transparent;
  background-clip:text;
}
.match-sub{
  font-size:13.5px;color:#c8c5d6;margin-top:10px;line-height:1.6;
}
.match-sub strong{color:var(--accent);font-weight:800}
.match-continue{
  margin-top:26px;padding:14px 32px;border-radius:14px;
  background:linear-gradient(135deg,#ff66a3,#a78bfa);
  border:none;color:#fff;font-size:14px;font-weight:800;
  cursor:pointer;font-family:inherit;
  box-shadow:0 8px 30px rgba(255,102,163,.4);
  transition:.2s;
}
.match-continue:hover{transform:translateY(-2px);box-shadow:0 12px 40px rgba(255,102,163,.5)}

.confetti{
  position:fixed;width:10px;height:10px;z-index:99;pointer-events:none;
  animation:fall linear forwards;
}
@keyframes fall{
  0%{transform:translateY(0) rotate(0);opacity:1}
  100%{transform:translateY(110vh) rotate(720deg);opacity:0}
}

/* ============ SUMMARY ============ */
.summary{
  position:fixed;inset:60px 0 0 0;z-index:60;
  background:var(--bg);overflow-y:auto;
  padding:30px 20px 120px;
  transform:translateY(100%);transition:transform .5s cubic-bezier(.4,0,.2,1);
}
.summary.show{transform:translateY(0)}
.summary-header{text-align:center;margin-bottom:30px}
.summary-header h2{
  font-size:28px;font-weight:900;letter-spacing:-.8px;
  background:linear-gradient(135deg,#ff66a3,#a78bfa,#22d3ee);
  -webkit-background-clip:text;-webkit-text-fill-color:transparent;
  background-clip:text;
}
.summary-header p{color:var(--muted);margin-top:8px;font-size:13px}
.summary-stats{
  display:grid;grid-template-columns:repeat(3,1fr);gap:10px;
  max-width:520px;margin:20px auto 30px;
}
.stat{
  background:var(--card);border:1px solid var(--border);
  border-radius:14px;padding:14px 10px;text-align:center;
}
.stat-num{font-size:26px;font-weight:900;letter-spacing:-1px}
.stat-lbl{font-size:10px;color:var(--muted);text-transform:uppercase;letter-spacing:.8px;font-weight:700;margin-top:4px}
.program-section{max-width:560px;margin:0 auto 22px}
.program-title{
  display:flex;align-items:center;gap:10px;
  font-size:13px;font-weight:800;text-transform:uppercase;
  letter-spacing:.9px;margin-bottom:10px;
}
.program-dot{width:12px;height:12px;border-radius:50%}
.program-list{display:flex;flex-direction:column;gap:6px}
.match-row{
  display:flex;align-items:center;gap:11px;padding:10px 14px;
  background:var(--card);border:1px solid var(--border);border-radius:12px;
  cursor:pointer;transition:.2s;
}
.match-row:hover{background:var(--card-2);transform:translateX(3px)}
.match-row .mr-avatar{
  width:34px;height:34px;border-radius:50%;
  display:grid;place-items:center;font-weight:800;font-size:12px;color:#fff;
}
.match-row .mr-info{flex:1;min-width:0}
.match-row .mr-name{font-size:13px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.match-row .mr-role{font-size:11px;color:var(--muted);margin-top:1px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.match-row .mr-pct{font-size:12px;font-weight:800}

.restart-btn{
  display:block;margin:30px auto 0;
  padding:12px 26px;background:var(--card);border:1px solid var(--border);
  border-radius:12px;color:var(--text);font-size:13px;font-weight:700;
  cursor:pointer;font-family:inherit;transition:.2s;
}
.restart-btn:hover{background:var(--card-2);border-color:var(--muted)}

@media (max-width:600px){
  .deck{max-width:100%}
  .card-cover{height:34%;min-height:180px}
  .card-avatar{width:100px;height:100px;font-size:34px}
  .card-name{font-size:19px}
  .ctrl{width:58px;height:58px;font-size:24px}
  .progress-bar{width:80px}
  .brand-text h1{font-size:12.5px}
}
::-webkit-scrollbar{width:8px}
::-webkit-scrollbar-thumb{background:var(--border);border-radius:4px}
</style>
</head>

   scores:{key:87, windsor:55, heliot:42, cosecha:58},
   chips:['Psicólogo','RRHH','Selección','Clima']},
  {id:'alexander', name:'Alexander Hernández', role:'Asistente · Heliot',
   bio:'Fundador de Heliot Media. Interés en Psicología y RRHH. Becario FGK.',
   scores:{key:78, windsor:55, heliot:85, cosecha:52},
   chips:['Emprendedor','Marketing','RRHH','Joven Key']}
];

/* =========================================================
   ESTADO
   ========================================================= */
let queue = [...candidates].sort(()=>Math.random()-0.5);
let currentIndex = 0;
let matches = [];
let passed = [];
let history = [];

const deck = document.getElementById('deck');
const controls = document.getElementById('controls');
const modal = document.getElementById('matchModal');
const modalSub = document.getElementById('matchSub');
const summary = document.getElementById('summary');

/* =========================================================
   RENDER CARD
   ========================================================= */
function bestProgram(c){
  return Object.entries(c.scores).sort((a,b)=>b[1]-a[1])[0][0];
}
function topPrograms(c){
  return Object.entries(c.scores).sort((a,b)=>b[1]-a[1]).slice(1);
}

function buildCard(c){
  const best = bestProgram(c);
  const bestColor = PROGRAMS[best].color;
  const bestPct = c.scores[best];
  const others = topPrograms(c);

  const card = document.createElement('div');
  card.className = 'card';
  card.dataset.id = c.id;
  card.style.setProperty('--accent', bestColor);

  card.innerHTML = `
    <div class="card-cover">
      <div class="card-badge">${PROGRAMS[best].short}</div>
      <div class="card-match" style="color:${bestColor}">
        <span class="match-dot" style="background:${bestColor};box-shadow:0 0 8px ${bestColor}"></span>
        ${bestPct}%
      </div>
      <div class="card-avatar">${initials(c.name)}</div>
    </div>
    <div class="card-body">
      <div class="card-name">${c.name}</div>
      <div class="card-role">${c.role}</div>
      <div class="card-bio">${c.bio}</div>

      <div class="match-section">
        <div class="match-label">Compatibilidad con ${PROGRAMS[best].name}</div>
        <div class="match-bar">
          <div class="match-fill" style="width:${bestPct}%;background:linear-gradient(90deg,${bestColor},#ff66a3)"></div>
        </div>
        <div class="match-pct">
          <span>Match perfecto</span>
          <strong style="color:${bestColor}">${bestPct}%</strong>
        </div>
      </div>

      <div class="chips">
        ${c.chips.map(ch => `<span class="chip accent" style="--accent:${bestColor}">${ch}</span>`).join('')}
      </div>

      <div class="other-matches">
        <div class="other-label">También encaja en</div>
        <div class="other-row">
          ${others.map(([pid, pct])=>{
            const p = PROGRAMS[pid];
            return `<div class="other-item">
              <span><strong style="color:${p.color}">${p.short}</strong> · ${pct}%</span>
              <span class="other-pct">${pct >= 70 ? '🎯' : pct >= 50 ? '👌' : '👋'}</span>
            </div>`;
          }).join('')}
        </div>
      </div>
    </div>

    <div class="drag-label like">MATCH</div>
    <div class="drag-label nope">NOPE</div>
  `;
  return card;
}

function initials(name){
  return name.split(' ').filter(w=>w.length>1).slice(0,2).map(w=>w[0]).join('').toUpperCase();
}

function renderNext(){
  deck.innerHTML = '';
  if(currentIndex >= queue.length){ showSummary(); return; }

  // Render top 2 cards (next behind current)
  const remaining = queue.slice(currentIndex, currentIndex + 2);
  remaining.reverse().forEach((c, i)=>{
    const card = buildCard(c);
    if(i === 0){
      // card behind — slightly offset
      card.style.transform = 'scale(0.94) translateY(-12px)';
      card.style.opacity = '0.5';
      card.style.pointerEvents = 'none';
    } else {
      // top card — interactive
      attachDragEvents(card, c);
    }
    deck.appendChild(card);
  });

  updateProgress();
}

/* =========================================================
   DRAG / SWIPE
   ========================================================= */
function attachDragEvents(card, c){
  let startX = 0, startY = 0, currentX = 0, currentY = 0;
  let dragging = false;

  const likeLabel = card.querySelector('.drag-label.like');
  const nopeLabel = card.querySelector('.drag-label.nope');

  function onStart(e){
    dragging = true;
    card.classList.add('dragging');
    const p = e.touches ? e.touches[0] : e;
    startX = p.clientX;
    startY = p.clientY;
  }
  function onMove(e){
    if(!dragging) return;
    const p = e.touches ? e.touches[0] : e;
    currentX = p.clientX - startX;
    currentY = p.clientY - startY;
    const rot = currentX / 20;
    card.style.transform = `translate(${currentX}px, ${currentY}px) rotate(${rot}deg)`;

    const likeOp = Math.max(0, Math.min(1, currentX / 100));
    const nopeOp = Math.max(0, Math.min(1, -currentX / 100));
    likeLabel.style.opacity = likeOp;
    nopeLabel.style.opacity = nopeOp;
  }
  function onEnd(){
    if(!dragging) return;
    dragging = false;
    card.classList.remove('dragging');
    const threshold = 90;
    if(currentX > threshold) completeSwipe('right', card, c);
    else if(currentX < -threshold) completeSwipe('left', card, c);
    else {
      card.style.transform = '';
      likeLabel.style.opacity = 0;
      nopeLabel.style.opacity = 0;
    }
    currentX = 0; currentY = 0;
  }

  card.addEventListener('mousedown', onStart);
  document.addEventListener('mousemove', onMove);
  document.addEventListener('mouseup', onEnd);
  card.addEventListener('touchstart', onStart, {passive:true});
  card.addEventListener('touchmove', onMove, {passive:true});
  card.addEventListener('touchend', onEnd);
}

/* =========================================================
   SWIPE ACTIONS
   ========================================================= */
function completeSwipe(direction, card, c){
  card.classList.add(direction === 'right' ? 'exit-right' : 'exit-left');
  if(direction === 'right'){
    matches.push(c);
    history.push({type:'match', candidate:c});
    // Delay to let animation finish
    setTimeout(()=>{
      currentIndex++;
      renderNext();
      if(currentIndex < queue.length) showMatchModal(c);
      else setTimeout(showSummary, 300);
    }, 280);
  } else {
    passed.push(c);
    history.push({type:'pass', candidate:c});
    setTimeout(()=>{
      currentIndex++;
      renderNext();
      if(currentIndex >= queue.length) setTimeout(showSummary, 300);
    }, 280);
  }
}

function currentCard(){
  return deck.querySelector('.card:not([style*="scale(0.94)"])');
}

document.getElementById('matchBtn').addEventListener('click', ()=>{
  const c = queue[currentIndex];
  const card = deck.querySelector('.card:not([style*="scale(0.94)"])');
  if(card && c) completeSwipe('right', card, c);
});
document.getElementById('passBtn').addEventListener('click', ()=>{
  const c = queue[currentIndex];
  const card = deck.querySelector('.card:not([style*="scale(0.94)"])');
  if(card && c) completeSwipe('left', card, c);
});
document.getElementById('undoBtn').addEventListener('click', ()=>{
  if(currentIndex === 0) return;
  const last = history.pop();
  if(!last) return;
  if(last.type === 'match') matches.pop();
  else passed.pop();
  currentIndex--;
  renderNext();
});

document.addEventListener('keydown', e=>{
  if(modal.classList.contains('show')){
    if(e.key === 'Enter' || e.key === ' ') document.getElementById('matchContinue').click();
    return;
  }
  if(e.key === 'ArrowRight') document.getElementById('matchBtn').click();
  if(e.key === 'ArrowLeft') document.getElementById('passBtn').click();
});

/* =========================================================
   PROGRESS
   ========================================================= */
function updateProgress(){
  const total = queue.length;
  const done = currentIndex;
  document.getElementById('progressText').textContent = `${done} / ${total}`;
  document.getElementById('progressFill').style.width = `${(done/total)*100}%`;
}

/* =========================================================
   MATCH MODAL + CONFETTI
   ========================================================= */
function showMatchModal(c){
  const best = bestProgram(c);
  const p = PROGRAMS[best];
  modalSub.innerHTML = `<strong style="color:${p.color}">${c.name}</strong> encaja perfecto como <strong style="color:${p.color}">${c.role}</strong> en <strong style="color:${p.color}">${p.name}</strong> con <strong style="color:${p.color}">${c.scores[best]}%</strong> de compatibilidad.`;
  modal.classList.add('show');
  modal.style.setProperty('--accent', p.color);
  launchConfetti();
}

document.getElementById('matchContinue').addEventListener('click', ()=>{
  modal.classList.remove('show');
});

function launchConfetti(){
  const colors = ['#ff66a3','#a78bfa','#22d3ee','#fbbf24','#34d399'];
  for(let i = 0; i < 40; i++){
    setTimeout(()=>{
      const c = document.createElement('div');
      c.className = 'confetti';
      c.style.left = Math.random() * 100 + 'vw';
      c.style.top = '-20px';
      c.style.background = colors[Math.floor(Math.random()*colors.length)];
      c.style.animationDuration = (2 + Math.random()*2) + 's';
      c.style.transform = `rotate(${Math.random()*360}deg)`;
      c.style.borderRadius = Math.random() > 0.5 ? '50%' : '2px';
      document.body.appendChild(c);
      setTimeout(()=> c.remove(), 4000);
    }, i * 30);
  }
}

/* =========================================================
   SUMMARY
   ========================================================= */
function showSummary(){
  controls.style.display = 'none';

  // Agrupar matches por programa ganador
  const grouped = {key:[], windsor:[], heliot:[], cosecha:[]};
  matches.forEach(c=>{
    const best = bestProgram(c);
    grouped[best].push(c);
  });

  summary.innerHTML = `
    <div class="summary-header">
      <h2>💖 Tus matches</h2>
      <p>Así queda tu equipo según los matches que hiciste</p>
    </div>
    <div class="summary-stats">
      <div class="stat">
        <div class="stat-num" style="color:#ff66a3">${matches.length}</div>
        <div class="stat-lbl">Matches</div>
      </div>
      <div class="stat">
        <div class="stat-num" style="color:#9b93b8">${passed.length}</div>
        <div class="stat-lbl">Pasados</div>
      </div>
      <div class="stat">
        <div class="stat-num" style="color:#a78bfa">${matches.length ? Math.round(matches.reduce((a,c)=>a + c.scores[bestProgram(c)], 0) / matches.length) : 0}%</div>
        <div class="stat-lbl">Match promedio</div>
      </div>
    </div>

    ${Object.entries(grouped).map(([pid, list])=>{
      if(list.length === 0) return '';
      const p = PROGRAMS[pid];
      return `
        <div class="program-section">
          <div class="program-title" style="color:${p.color}">
            <span class="program-dot" style="background:${p.color};box-shadow:0 0 10px ${p.color}"></span>
            ${p.name} · ${list.length} ${list.length === 1 ? 'persona' : 'personas'}
          </div>
          <div class="program-list">
            ${list.map(c => `
              <div class="match-row">
                <div class="mr-avatar" style="background:linear-gradient(135deg,${p.color},${p.color}99)">${initials(c.name)}</div>
                <div class="mr-info">
                  <div class="mr-name">${c.name}</div>
                  <div class="mr-role">${c.role}</div>
                </div>
                <div class="mr-pct" style="color:${p.color}">${c.scores[pid]}%</div>
              </div>
            `).join('')}
          </div>
        </div>
      `;
    }).join('')}

    ${matches.length === 0 ? `
      <div style="text-align:center;padding:40px 20px;color:var(--muted);font-size:13px">
        No hiciste ningún match 😢<br>Intenta de nuevo.
      </div>
    ` : ''}

    <button class="restart-btn" onclick="restart()">↺ Volver a empezar</button>
  `;
  summary.classList.add('show');
}

function restart(){
  queue = [...candidates].sort(()=>Math.random()-0.5);
  currentIndex = 0;
  matches = [];
  passed = [];
  history = [];
  summary.classList.remove('show');
  controls.style.display = '';
  renderNext();
}

/* =========================================================
   INIT
   ========================================================= */
renderNext();
</script>
</body>
</html>
