<style>
:root{
  --key:#a78bfa; --windsor:#22d3ee; --heliot:#fbbf24; --cosecha:#34d399;
  --bg:#04050b; --card:#141721; --card-2:#1a1f2e;
  --border:#242838; --text:#f1f5f9; --muted:#8892a8;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;overflow:hidden;font-family:'Inter',-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;background:var(--bg);color:var(--text)}

/* Starfield */
body::before{
  content:'';position:fixed;inset:0;pointer-events:none;z-index:0;opacity:.55;
  background-image:
    radial-gradient(1px 1px at 8% 15%, #fff, transparent),
    radial-gradient(1px 1px at 22% 55%, #fff, transparent),
    radial-gradient(1px 1px at 42% 28%, #fff, transparent),
    radial-gradient(1px 1px at 68% 72%, #fff, transparent),
    radial-gradient(1px 1px at 82% 18%, #fff, transparent),
    radial-gradient(1px 1px at 92% 48%, #fff, transparent),
    radial-gradient(1px 1px at 15% 82%, #fff, transparent),
    radial-gradient(1px 1px at 55% 92%, #fff, transparent),
    radial-gradient(1px 1px at 72% 8%, #fff, transparent),
    radial-gradient(1px 1px at 33% 68%, #fff, transparent);
  animation:twinkle 6s ease-in-out infinite alternate;
}
@keyframes twinkle{0%{opacity:.35}100%{opacity:.65}}

/* ============ TOPBAR ============ */
.topbar{
  position:fixed;top:0;left:0;right:0;z-index:50;height:60px;
  padding:0 18px;display:flex;align-items:center;gap:12px;
  background:rgba(4,5,11,.78);backdrop-filter:blur(18px);
  border-bottom:1px solid var(--border);
}
.back-btn{
  display:flex;align-items:center;gap:6px;
  padding:8px 12px;background:var(--card);border:1px solid var(--border);
  border-radius:9px;color:var(--text);font-size:12px;font-weight:600;
  cursor:pointer;transition:.2s;white-space:nowrap;
}
.back-btn:hover:not(:disabled){border-color:var(--muted);background:var(--card-2)}
.back-btn:disabled{opacity:.35;cursor:not-allowed}

.crumbs{
  display:flex;align-items:center;gap:5px;flex-wrap:nowrap;overflow-x:auto;
  flex:1;font-size:12px;
}
.crumbs::-webkit-scrollbar{display:none}
.crumb{
  padding:5px 10px;border-radius:7px;color:var(--muted);cursor:pointer;
  transition:.2s;white-space:nowrap;font-weight:500;
}
.crumb:hover{color:var(--text);background:var(--card)}
.crumb.current{color:var(--text);font-weight:700;background:var(--card);cursor:default}
.crumb-sep{opacity:.35;font-size:11px}

.search-wrap{position:relative;width:220px;flex-shrink:0}
.search-wrap svg{position:absolute;left:10px;top:50%;transform:translateY(-50%);color:var(--muted)}
.search-wrap input{
  width:100%;padding:8px 12px 8px 32px;
  background:var(--card);border:1px solid var(--border);border-radius:9px;
  color:var(--text);font-size:12px;outline:none;transition:.2s;
}
.search-wrap input:focus{border-color:var(--key);box-shadow:0 0 0 3px rgba(167,139,250,.2)}

/* ============ SYSTEM ============ */
.system-wrap{
  position:fixed;inset:60px 0 0 0;z-index:1;
  transition:right .35s cubic-bezier(.4,0,.2,1);
}
.system-wrap.with-panel{right:380px}
svg.system{width:100%;height:100%;display:block;user-select:none}

/* SVG classes */
.orbit-ring{
  fill:none;stroke-width:1;stroke-dasharray:2 6;
  opacity:.18;transition:.3s;
}
.orbit-ring.highlight{opacity:.55;stroke-dasharray:none;stroke-width:1.5}

.body{cursor:pointer;transition:opacity .3s}
.body .body-halo{opacity:.18;transition:opacity .3s,r .3s}
.body:hover .body-halo{opacity:.45}
.body.dimmed{opacity:.15}
.body.selected .body-halo{opacity:.65}
.body.descendant .body-halo{opacity:.35}
.body .body-circle{transition:filter .3s}
.body:hover .body-circle{filter:drop-shadow(0 0 14px currentColor) drop-shadow(0 0 6px currentColor)}
.body.selected .body-circle{filter:drop-shadow(0 0 22px currentColor) drop-shadow(0 0 12px currentColor)}
.body-initials{
  font-family:'Inter',sans-serif;font-weight:700;
  text-anchor:middle;dominant-baseline:central;pointer-events:none;
}
.ring-marker{
  fill:none;stroke-width:1.5;opacity:.7;
}
.sun-glow{animation:sunGlow 4s ease-in-out infinite;transform-origin:center}
@keyframes sunGlow{0%,100%{opacity:.35;transform:scale(1)}50%{opacity:.6;transform:scale(1.08)}}
.sun-core{animation:sunCore 6s ease-in-out infinite;transform-origin:center}
@keyframes sunCore{0%,100%{transform:scale(1)}50%{transform:scale(1.03)}}
.sun-label{
  font-family:'Inter',sans-serif;font-weight:800;text-anchor:middle;
  dominant-baseline:central;pointer-events:none;letter-spacing:.5px;
}
.sun-pulse{transform-origin:center;animation:sunPulse 3.5s ease-out infinite}
@keyframes sunPulse{0%{opacity:.7;transform:scale(1)}100%{opacity:0;transform:scale(1.6)}}

/* Tooltip */
.tooltip{
  position:fixed;z-index:100;pointer-events:none;
  background:rgba(10,12,20,.98);backdrop-filter:blur(14px);
  border:1px solid var(--border);border-radius:10px;
  padding:10px 14px;max-width:260px;
  transform:translate(-50%,-100%);
  opacity:0;transition:opacity .15s;
  box-shadow:0 12px 32px rgba(0,0,0,.7);
}
.tooltip.show{opacity:1}
.tooltip-name{font-size:12.5px;font-weight:700}
.tooltip-role{font-size:11px;color:var(--muted);margin-top:3px}
.tooltip-hint{
  font-size:10px;color:var(--muted);margin-top:7px;padding-top:7px;
  border-top:1px solid var(--border);opacity:.9;
}

/* ============ PANEL ============ */
.panel{
  position:fixed;top:60px;right:0;bottom:0;width:380px;z-index:40;
  background:rgba(8,10,16,.97);backdrop-filter:blur(24px);
  border-left:1px solid var(--border);padding:22px;overflow-y:auto;
  transform:translateX(100%);
  transition:transform .35s cubic-bezier(.4,0,.2,1);
}
.panel.open{transform:translateX(0)}
.panel-close{
  position:absolute;top:14px;right:14px;width:28px;height:28px;
  border-radius:8px;background:var(--card);border:1px solid var(--border);
  color:var(--muted);cursor:pointer;display:grid;place-items:center;
  font-size:12px;transition:.2s;
}
.panel-close:hover{color:var(--text);border-color:var(--muted)}

.panel-header{
  display:flex;align-items:center;gap:14px;
  padding-bottom:16px;border-bottom:1px solid var(--border);margin-bottom:18px;
  padding-right:28px;
}
.panel-avatar{
  width:54px;height:54px;border-radius:50%;flex-shrink:0;
  display:grid;place-items:center;font-weight:800;font-size:19px;color:#fff;
}
.panel-name{font-size:15.5px;font-weight:700;letter-spacing:-.3px;line-height:1.2}
.panel-role{font-size:11.5px;color:var(--muted);margin-top:4px;line-height:1.4}
.panel-area{
  display:inline-block;padding:3px 9px;border-radius:6px;
  font-size:9.5px;font-weight:800;text-transform:uppercase;
  letter-spacing:.6px;margin-top:8px;
}

.drill-btn{
  width:100%;padding:12px;margin-bottom:16px;
  background:linear-gradient(135deg,var(--accent),color-mix(in srgb,var(--accent) 70%,#000));
  border:none;border-radius:10px;color:#fff;font-weight:700;font-size:12.5px;
  cursor:pointer;display:flex;align-items:center;justify-content:center;gap:8px;
  transition:.2s;box-shadow:0 4px 20px color-mix(in srgb,var(--accent) 40%,transparent);
  font-family:inherit;
}
.drill-btn:hover{transform:translateY(-2px);box-shadow:0 6px 26px color-mix(in srgb,var(--accent) 55%,transparent)}

.section{margin-bottom:18px}
.section h3{
  font-size:10px;text-transform:uppercase;letter-spacing:.9px;
  color:var(--muted);margin-bottom:10px;font-weight:700;
}
.bio{
  font-size:12.5px;line-height:1.65;color:#c8cfe0;
  background:var(--card);padding:13px 15px;border-radius:10px;
  border-left:3px solid var(--key);
}
.total-box{
  background:var(--card);border-radius:12px;padding:16px;
  border:1px solid var(--border);text-align:center;
}
.total-number{font-size:36px;font-weight:800;letter-spacing:-1.5px;line-height:1}
.total-label{font-size:11.5px;color:var(--muted);margin-top:6px}

.report-list{display:flex;flex-direction:column;gap:6px}
.report-item{
  display:flex;align-items:center;gap:11px;padding:10px 12px;
  background:var(--card);border:1px solid var(--border);border-radius:10px;
  cursor:pointer;transition:.2s;
}
.report-item:hover{border-color:var(--muted);transform:translateX(3px);background:var(--card-2)}
.report-avatar{
  width:32px;height:32px;border-radius:50%;flex-shrink:0;
  display:grid;place-items:center;font-weight:700;font-size:11px;color:#fff;
}
.report-info{min-width:0;flex:1}
.report-name{font-size:12.5px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.report-role{font-size:10.5px;color:var(--muted);margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

.empty-state{
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  height:100%;text-align:center;gap:14px;padding:30px;
}
.empty-state svg{opacity:.2}
.empty-state h3{font-size:14px;font-weight:600;color:var(--muted)}
.empty-state p{font-size:12px;color:var(--muted);opacity:.7;line-height:1.6;max-width:260px}

@media (max-width:900px){
  .system-wrap.with-panel{right:0}
  .panel{width:100%;top:auto;bottom:0;max-height:70vh;border-left:none;border-top:1px solid var(--border);border-radius:20px 20px 0 0;transform:translateY(100%)}
  .panel.open{transform:translateY(0)}
  .search-wrap{display:none}
  .back-btn span{display:none}
}
::-webkit-scrollbar{width:8px}
::-webkit-scrollbar-track{background:transparent}
::-webkit-scrollbar-thumb{background:var(--border);border-radius:4px}

/* ================= HELPERS ================= */
const NS = 'http://www.w3.org/2000/svg';
const areaHex = {key:'#a78bfa', windsor:'#22d3ee', heliot:'#fbbf24', cosecha:'#34d399'};
const areaNames = {key:'Key', windsor:'Windsor', heliot:'Heliot Media', cosecha:'Cosecha'};

function initials(name){
  return name.split(' ').filter(w=>w.length>1).slice(0,2).map(w=>w[0]).join('').toUpperCase();
}
function descendants(node){
  const ids=[];
  (function walk(n){ (n.children||[]).forEach(c=>{ids.push(c.id);walk(c)}); })(node);
  return ids;
}
function findNode(root,id){
  if(root.id===id) return root;
  if(root.children){ for(const c of root.children){const f=findNode(c,id); if(f) return f;} }
  return null;
}
function findPath(root,id,path=[]){
  const p = [...path, root];
  if(root.id===id) return p;
  if(root.children){
    for(const c of root.children){
      const r = findPath(c,id,p);
      if(r) return r;
    }
  }
  return null;
}
function el(tag, attrs={}, parent){
  const e = document.createElementNS(NS, tag);
  for(const k in attrs) e.setAttribute(k, attrs[k]);
  if(parent) parent.appendChild(e);
  return e;
}

/* ================= STATE ================= */
const CX = 700, CY = 700;
const SUN_R = 68;
const MIN_ORBIT = 170;
const MAX_ORBIT = 620;
let currentPath = ['key'];
let selectedId = null;
const tooltip = document.getElementById('tooltip');

/* ================= ANIMATION STATE ================= */
const orbitStates = new Map(); // orbitId -> {angle, speed, paused}
let lastTime = performance.now();
let rafId = null;

function startAnimation(){
  if(rafId) cancelAnimationFrame(rafId);
  lastTime = performance.now();
  function loop(t){
    const dt = Math.min(t - lastTime, 50);
    lastTime = t;
    orbitStates.forEach((state, id)=>{
      if(!state.paused){
        state.angle = (state.angle + state.speed * dt / 1000) % 360;
      }
      const orbit = document.querySelector(`[data-orbit="${id}"]`);
      if(orbit){
        orbit.setAttribute('transform', `rotate(${state.angle} ${CX} ${CY})`);
        const inner = orbit.querySelectorAll('[data-counter]');
        inner.forEach(c=>{
          const x = parseFloat(c.dataset.x);
          const y = parseFloat(c.dataset.y);
          c.setAttribute('transform', `translate(${x} ${y}) rotate(${-state.angle})`);
        });
      }
    });
    rafId = requestAnimationFrame(loop);
  }
  rafId = requestAnimationFrame(loop);
}
function stopAnimation(){
  if(rafId){ cancelAnimationFrame(rafId); rafId = null; }
}

/* ================= BUILD SYSTEM ================= */
function buildSystem(){
  stopAnimation();
  const svg = document.getElementById('system');
  svg.innerHTML = '';
  orbitStates.clear();

  const centerNode = findNode(org, currentPath[currentPath.length-1]);
  if(!centerNode) return;

  const children = centerNode.children || [];
  const N = children.length;
  const centerArea = centerNode.area || 'key';
  const centerColor = areaHex[centerArea];

  // Defs
  const defs = el('defs', {}, svg);
  const grad = el('radialGradient', {id:`sunGrad-${centerNode.id}`, cx:'50%', cy:'50%', r:'50%'}, defs);
  el('stop', {offset:'0%', 'stop-color':'#ffffff', 'stop-opacity':'.95'}, grad);
  el('stop', {offset:'35%', 'stop-color':centerColor, 'stop-opacity':'.95'}, grad);
  el('stop', {offset:'100%', 'stop-color':centerColor, 'stop-opacity':'.4'}, grad);
  const glowGrad = el('radialGradient', {id:`glowGrad-${centerNode.id}`, cx:'50%', cy:'50%', r:'50%'}, defs);
  el('stop', {offset:'0%', 'stop-color':centerColor, 'stop-opacity':'.55'}, glowGrad);
  el('stop', {offset:'60%', 'stop-color':centerColor, 'stop-opacity':'.15'}, glowGrad);
  el('stop', {offset:'100%', 'stop-color':centerColor, 'stop-opacity':'0'}, glowGrad);

  // Draw orbit rings FIRST (so they're under the sun)
  if(N > 0){
    const step = N > 1 ? (MAX_ORBIT - MIN_ORBIT) / (N - 1) : 0;
    children.forEach((child, i)=>{
      const radius = N === 1 ? (MIN_ORBIT + MAX_ORBIT)/2 : MIN_ORBIT + step * i;
      const area = child.area || centerArea;
      const ring = el('circle', {
        class:'orbit-ring',
        cx:CX, cy:CY, r:radius,
        'data-orbit-ring': child.id,
        style:`stroke:${areaHex[area]}`
      }, svg);
    });
  }

  // Draw sun
  const sunGroup = el('g', {}, svg);
  // outer glow
  el('circle', {
    class:'sun-glow', cx:CX, cy:CY, r:SUN_R * 2.6,
    fill:`url(#glowGrad-${centerNode.id})`
  }, sunGroup);
  // pulse ring
  el('circle', {
    class:'sun-pulse', cx:CX, cy:CY, r:SUN_R,
    fill:'none', stroke:centerColor, 'stroke-width':2
  }, sunGroup);
  // core
  el('circle', {
    class:'sun-core', cx:CX, cy:CY, r:SUN_R,
    fill:`url(#sunGrad-${centerNode.id})`,
    stroke:'rgba(255,255,255,.5)', 'stroke-width':2,
    style:`filter:drop-shadow(0 0 30px ${centerColor}) drop-shadow(0 0 60px ${centerColor})`
  }, sunGroup);
  // label
  el('text', {
    class:'sun-label', x:CX, y:CY,
    fill:'#fff', 'font-size': centerNode.name.length > 12 ? 14 : 18
  }, sunGroup).textContent = centerNode.name.toUpperCase();

  sunGroup.style.cursor = 'pointer';
  sunGroup.addEventListener('click', ()=>{
    selectedId = centerNode.id;
    applySelectionStyles();
    showPanel(centerNode);
    if(centerNode.id !== 'key') expandPanelForMobile();
  });
  sunGroup.addEventListener('mouseenter', ()=>{
    showTooltip(centerNode, CX, CY - SUN_R - 10);
    orbitStates.forEach(s => s.paused = true);
  });
  sunGroup.addEventListener('mouseleave', ()=>{
    hideTooltip();
    orbitStates.forEach(s => s.paused = false);
  });

  // Draw planets
  if(N === 0) {
    startAnimation();
    updateBreadcrumb();
    return;
  }

  const step = N > 1 ? (MAX_ORBIT - MIN_ORBIT) / (N - 1) : 0;

  children.forEach((child, i)=>{
    const radius = N === 1 ? (MIN_ORBIT + MAX_ORBIT)/2 : MIN_ORBIT + step * i;
    const area = child.area || centerArea;
    const color = areaHex[area];

    const hasChildren = child.children && child.children.length > 0;
    const childCount = hasChildren ? descendants(child).length : 0;

    // Planet size based on subtree size
    let bodyR;
    if(!hasChildren) bodyR = 15;
    else if(childCount <= 3) bodyR = 20;
    else if(childCount <= 8) bodyR = 26;
    else if(childCount <= 15) bodyR = 32;
    else bodyR = 38;

    // Planet speed varies by radius (Kepler-inspired: outer = slower)
    const speed = 5 - (radius - MIN_ORBIT) / (MAX_ORBIT - MIN_ORBIT) * 3.5;

    // Starting angle: evenly distributed, plus a golden-angle offset per child index
    const startAngle = (i / N) * 360 + (i * 37) % 40;

    const orbitGroup = el('g', {
      'data-orbit': child.id,
      transform:`rotate(${startAngle} ${CX} ${CY})`
    }, svg);
    orbitStates.set(child.id, {angle:startAngle, speed, paused:false});

    // Position on orbit (radius from center)
    const x = CX + radius;
    const y = CY;

    const bodyGroup = el('g', {
      class:'body',
      'data-id': child.id,
      'data-counter':'1',
      'data-x':x, 'data-y':y,
      transform:`translate(${x} ${y}) rotate(${-startAngle})`,
      style:`color:${color}`
    }, orbitGroup);

    // Halo
    el('circle', {
      class:'body-halo', cx:0, cy:0, r:bodyR * 2,
      fill:color
    }, bodyGroup);

    // If has children: add ring around body (Saturn-style)
    if(hasChildren){
      el('ellipse', {
        cx:0, cy:0, rx:bodyR * 1.7, ry:bodyR * 0.55,
        fill:'none', stroke:color, 'stroke-width':1.5,
        opacity:.7, transform:'rotate(-25)',
        style:'filter:drop-shadow(0 0 6px ' + color + ')'
      }, bodyGroup);
    }

    // Main body
    el('circle', {
      class:'body-circle', cx:0, cy:0, r:bodyR,
      fill:'rgba(15,17,23,.92)', stroke:color, 'stroke-width':2,
      style:`filter:drop-shadow(0 0 8px ${color})`
    }, bodyGroup);

    // Initials
    el('text', {
      class:'body-initials', x:0, y:1,
      fill:color,
      'font-size': bodyR < 20 ? 9 : bodyR < 30 ? 11 : 13
    }, bodyGroup).textContent = initials(child.name);

    // Team count badge
    if(hasChildren){
      const bx = bodyR + 8;
      const by = -bodyR - 4;
      el('circle', {cx:bx, cy:by, r:9, fill:color, stroke:'#0a0c12', 'stroke-width':1.5}, bodyGroup);
      el('text', {
        x:bx, y:by, fill:'#0a0c12', 'font-size':9.5, 'font-weight':800,
        'text-anchor':'middle', 'dominant-baseline':'central',
        'font-family':'Inter,sans-serif'
      }, bodyGroup).textContent = childCount;
    }

    // Events
    bodyGroup.addEventListener('click', (e)=>{
      e.stopPropagation();
      selectedId = child.id;
      applySelectionStyles();
      showPanel(child);
      if(window.innerWidth <= 900) expandPanelForMobile();
    });
    bodyGroup.addEventListener('mouseenter', (e)=>{
      showTooltip(child, x, y - bodyR - 14);
      orbitStates.forEach(s => s.paused = true);
    });
    bodyGroup.addEventListener('mouseleave', ()=>{
      hideTooltip();
      orbitStates.forEach(s => s.paused = false);
    });
  });

  startAnimation();
  updateBreadcrumb();
  applySelectionStyles();
}

/* ================= TOOLTIP ================= */
function showTooltip(node, svgX, svgY){
  const svgEl = document.getElementById('system');
  const rect = svgEl.getBoundingClientRect();
  const vb = svgEl.viewBox.baseVal;
  const scale = Math.min(rect.width / vb.width, rect.height / vb.height);
  const offsetX = (rect.width - vb.width * scale) / 2;
  const offsetY = (rect.height - vb.height * scale) / 2;
  const screenX = svgX * scale + offsetX + rect.left;
  const screenY = svgY * scale + offsetY + rect.top;

  const area = node.area || 'key';
  const color = areaHex[area];
  const hasChildren = node.children && node.children.length > 0;

  tooltip.innerHTML = `
    <div class="tooltip-name">${node.name}</div>
    <div class="tooltip-role">${node.role}</div>
    ${hasChildren ? `<div class="tooltip-hint">↳ Click para entrar al subsistema</div>` : ''}
  `;
  tooltip.style.left = screenX + 'px';
  tooltip.style.top = (screenY - 10) + 'px';
  tooltip.classList.add('show');
}
function hideTooltip(){
  tooltip.classList.remove('show');
}

/* ================= BREADCRUMB ================= */
function updateBreadcrumb(){
  const crumbs = document.getElementById('crumbs');
  crumbs.innerHTML = '';
  currentPath.forEach((id, i)=>{
    const node = findNode(org, id);
    if(!node) return;
    const isLast = i === currentPath.length - 1;
    const span = document.createElement('span');
    span.className = 'crumb' + (isLast ? ' current' : '');
    span.textContent = node.name;
    if(!isLast){
      span.addEventListener('click', ()=> navigateTo(currentPath.slice(0, i+1)));
    }
    crumbs.appendChild(span);
    if(!isLast){
      const sep = document.createElement('span');
      sep.className = 'crumb-sep';
      sep.textContent = '›';
      crumbs.appendChild(sep);
    }
  });
  document.getElementById('backBtn').disabled = currentPath.length <= 1;
}

/* ================= NAVIGATION ================= */
function navigateTo(newPath){
  currentPath = newPath;
  selectedId = null;
  closePanel();
  buildSystem();
}

document.getElementById('backBtn').addEventListener('click', ()=>{
  if(currentPath.length > 1){
    navigateTo(currentPath.slice(0, -1));
  }
});

/* ================= SELECTION ================= */
function applySelectionStyles(){
  const bodies = document.querySelectorAll('.body');
  if(!selectedId){
    bodies.forEach(b => b.classList.remove('selected','descendant','dimmed'));
    return;
  }
  const selNode = findNode(org, selectedId);
  if(!selNode) return;
  const descIds = descendants(selNode);

  bodies.forEach(b=>{
    const id = b.dataset.id;
    b.classList.remove('selected','descendant','dimmed');
    if(id === selectedId) b.classList.add('selected');
    else if(descIds.includes(id)) b.classList.add('descendant');
    else b.classList.add('dimmed');
  });
}

/* ================= PANEL ================= */
function showPanel(node){
  const panel = document.getElementById('panel');
  const content = document.getElementById('panelContent');
  const area = node.area || 'key';
  const color = areaHex[area];
  const direct = node.children || [];
  const hasChildren = direct.length > 0;
  const descIds = descendants(node);

  const drillHTML = hasChildren ? `
    <button class="drill-btn" id="drillBtn" style="--accent:${color}">
      Explorar subsistema (${direct.length})
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><path d="m9 18 6-6-6-6"/></svg>
    </button>
  ` : '';

  const totalHTML = hasChildren ? `
    <div class="section">
      <h3>Alcance total</h3>
      <div class="total-box">
        <div class="total-number" style="color:${color}">${descIds.length}</div>
        <div class="total-label">${descIds.length===1?'persona':'personas'} en el equipo</div>
      </div>
    </div>` : '';

  const reportsHTML = hasChildren ? `
    <div class="section">
      <h3>Supervisa a ${direct.length}</h3>
      <div class="report-list">
        ${direct.map(r=>{
          const rHex = areaHex[r.area || area];
          return `<div class="report-item" data-id="${r.id}">
            <div class="report-avatar" style="background:linear-gradient(135deg,${rHex},${rHex}99);box-shadow:0 0 10px ${rHex}55">${initials(r.name)}</div>
            <div class="report-info">
              <div class="report-name">${r.name}</div>
              <div class="report-role">${r.role}</div>
            </div>
          </div>`;
        }).join('')}
      </div>
    </div>` : `
    <div class="section">
      <h3>Equipo</h3>
      <div style="text-align:center;padding:16px;color:var(--muted);font-size:11.5px;font-style:italic;background:var(--card);border-radius:10px">No tiene personas a su cargo.</div>
    </div>`;

  content.innerHTML = `
    <div class="panel-header">
      <div class="panel-avatar" style="background:linear-gradient(135deg,${color},${color}88);box-shadow:0 0 22px ${color}66">${initials(node.name)}</div>
      <div style="min-width:0;flex:1">
        <div class="panel-name">${node.name}</div>
        <div class="panel-role">${node.role}</div>
        <span class="panel-area" style="background:${color}22;color:${color}">${areaNames[area]}</span>
      </div>
    </div>
    ${drillHTML}
    ${node.bio ? `<div class="section"><h3>Sobre su rol</h3><div class="bio" style="border-left-color:${color}">${node.bio}</div></div>` : ''}
    ${totalHTML}
    ${reportsHTML}
  `;

  // Drill button
  const drillBtn = document.getElementById('drillBtn');
  if(drillBtn){
    drillBtn.addEventListener('click', ()=>{
      navigateTo([...currentPath, node.id]);
    });
  }

  // Report items → navigate within panel
  content.querySelectorAll('.report-item').forEach(el=>{
    el.addEventListener('click', ()=>{
      const childNode = findNode(org, el.dataset.id);
      if(childNode){
        selectedId = childNode.id;
        applySelectionStyles();
        showPanel(childNode);
      }
    });
  });

  panel.classList.add('open');
  document.getElementById('systemWrap').classList.add('with-panel');
}

function closePanel(){
  document.getElementById('panel').classList.remove('open');
  document.getElementById('systemWrap').classList.remove('with-panel');
  selectedId = null;
  applySelectionStyles();
}

function expandPanelForMobile(){
  document.getElementById('panel').classList.add('open');
}

document.getElementById('panelClose').addEventListener('click', closePanel);

document.addEventListener('keydown', e=>{
  if(e.key === 'Escape') closePanel();
});

/* ================= SEARCH ================= */
document.getElementById('search').addEventListener('input', e=>{
  const q = e.target.value.toLowerCase().trim();
  if(!q){
    applySelectionStyles();
    return;
  }
  let found = null;
  (function walk(n){
    if(found) return;
    if(n.name.toLowerCase().includes(q) || n.role.toLowerCase().includes(q)) found = n;
    (n.children||[]).forEach(walk);
  })(org);

  if(!found) return;

  // Navigate to its parent so we can see it
  const path = findPath(org, found.id);
  if(path){
    const parentPath = path.slice(0, -1).map(n => n.id);
    if(JSON.stringify(parentPath) !== JSON.stringify(currentPath)){
      navigateTo(parentPath);
      setTimeout(()=>{
        selectedId = found.id;
        applySelectionStyles();
        showPanel(found);
      }, 200);
    } else {
      selectedId = found.id;
      applySelectionStyles();
      showPanel(found);
    }
  }
});

/* ================= INIT ================= */
buildSystem();

window.addEventListener('resize', ()=>{
  // Redraw to recalc sizes on very large layout shifts
  // (small shifts are handled by SVG viewBox)
});
