<style>
:root{
  --key:#a78bfa; --windsor:#22d3ee; --heliot:#fbbf24; --cosecha:#34d399;
  --bg:#05060d; --card:#141721; --card-2:#1a1f2e;
  --border:#242838; --text:#f1f5f9; --muted:#8892a8;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;overflow:hidden;font-family:'Inter',-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;background:var(--bg);color:var(--text)}

body::before{
  content:'';position:fixed;inset:0;pointer-events:none;z-index:0;opacity:.5;
  background-image:
    radial-gradient(1px 1px at 8% 15%, #fff, transparent),
    radial-gradient(1px 1px at 22% 55%, #fff, transparent),
    radial-gradient(1px 1px at 42% 28%, #fff, transparent),
    radial-gradient(1px 1px at 68% 72%, #fff, transparent),
    radial-gradient(1px 1px at 82% 18%, #fff, transparent),
    radial-gradient(1px 1px at 92% 48%, #fff, transparent),
    radial-gradient(1px 1px at 15% 82%, #fff, transparent),
    radial-gradient(1px 1px at 55% 92%, #fff, transparent),
    radial-gradient(1px 1px at 72% 8%, #fff, transparent),
    radial-gradient(1px 1px at 33% 68%, #fff, transparent);
  animation:twinkle 6s ease-in-out infinite alternate;
}
@keyframes twinkle{0%{opacity:.3}100%{opacity:.6}}

.topbar{
  position:fixed;top:0;left:0;right:0;z-index:50;height:60px;
  padding:0 18px;display:flex;align-items:center;gap:12px;
  background:rgba(5,6,13,.8);backdrop-filter:blur(18px);
  border-bottom:1px solid var(--border);
}
.brand{display:flex;align-items:center;gap:11px}
.brand-mark{
  width:34px;height:34px;border-radius:10px;
  background:linear-gradient(135deg,var(--key),#7c3aed);
  display:grid;place-items:center;font-weight:800;font-size:15px;color:#fff;
  box-shadow:0 0 18px rgba(167,139,250,.4);
}
.brand-text h1{font-size:13px;font-weight:700;letter-spacing:-.2px}
.brand-text p{font-size:10.5px;color:var(--muted);margin-top:1px}

.legend{display:flex;gap:6px;margin-left:auto}
.legend-item{
  display:flex;align-items:center;gap:5px;padding:5px 9px;
  background:var(--card);border:1px solid var(--border);border-radius:7px;
  font-size:10.5px;font-weight:600;
}
.legend-dot{width:7px;height:7px;border-radius:50%}

.controls{
  position:fixed;bottom:16px;right:16px;z-index:30;
  display:flex;flex-direction:column;gap:6px;
}
.ctrl-btn{
  width:40px;height:40px;border-radius:10px;
  background:var(--card);border:1px solid var(--border);
  color:var(--text);font-size:18px;font-weight:700;
  cursor:pointer;display:grid;place-items:center;transition:.2s;
  backdrop-filter:blur(12px);
}
.ctrl-btn:hover{background:var(--card-2);border-color:var(--muted);transform:translateY(-1px)}

.stage{
  position:fixed;inset:60px 0 0 0;z-index:1;
  overflow:hidden;cursor:grab;
}
.stage.grabbing{cursor:grabbing}
.stage.with-panel{right:380px}
svg.map{display:block;user-select:none;transform-origin:0 0}

.link{fill:none;transition:.3s}
.link.dimmed{opacity:.15}
.link.highlight{stroke-width:2.5}

.node-body{cursor:pointer;transition:.25s}
.node-body .halo{opacity:.15;transition:opacity .3s}
.node-body:hover .halo{opacity:.5}
.node-body.dimmed{opacity:.12}
.node-body.selected .halo{opacity:.7}
.node-body.descendant .halo{opacity:.35}
.node-body text{pointer-events:none;font-family:'Inter',sans-serif;text-anchor:middle;dominant-baseline:central;font-weight:700}

.sun-glow{animation:sunPulse 3.5s ease-out infinite;transform-origin:center}
@keyframes sunPulse{0%{opacity:.7;transform:scale(1)}100%{opacity:0;transform:scale(1.8)}}
.sun-core{transform-origin:center}

.tooltip{
  position:fixed;z-index:100;pointer-events:none;
  background:rgba(10,12,20,.98);backdrop-filter:blur(14px);
  border:1px solid var(--border);border-radius:10px;
  padding:10px 14px;max-width:260px;
  transform:translate(-50%,-100%);
  opacity:0;transition:opacity .15s;
  box-shadow:0 12px 32px rgba(0,0,0,.7);
}
.tooltip.show{opacity:1}
.tooltip-name{font-size:12.5px;font-weight:700}
.tooltip-role{font-size:11px;color:var(--muted);margin-top:3px}

.panel{
  position:fixed;top:60px;right:0;bottom:0;width:380px;z-index:40;
  background:rgba(8,10,16,.97);backdrop-filter:blur(24px);
  border-left:1px solid var(--border);padding:22px;overflow-y:auto;
  transform:translateX(100%);
  transition:transform .35s cubic-bezier(.4,0,.2,1);
}
.panel.open{transform:translateX(0)}
.panel-close{
  position:absolute;top:14px;right:14px;width:28px;height:28px;
  border-radius:8px;background:var(--card);border:1px solid var(--border);
  color:var(--muted);cursor:pointer;display:grid;place-items:center;
  font-size:12px;transition:.2s;
}
.panel-close:hover{color:var(--text);border-color:var(--muted)}
.panel-header{
  display:flex;align-items:center;gap:14px;
  padding-bottom:16px;border-bottom:1px solid var(--border);margin-bottom:18px;
  padding-right:28px;
}
.panel-avatar{
  width:54px;height:54px;border-radius:50%;flex-shrink:0;
  display:grid;place-items:center;font-weight:800;font-size:19px;color:#fff;
}
.panel-name{font-size:15.5px;font-weight:700;letter-spacing:-.3px;line-height:1.2}
.panel-role{font-size:11.5px;color:var(--muted);margin-top:4px;line-height:1.4}
.panel-area{
  display:inline-block;padding:3px 9px;border-radius:6px;
  font-size:9.5px;font-weight:800;text-transform:uppercase;
  letter-spacing:.6px;margin-top:8px;
}
.section{margin-bottom:18px}
.section h3{
  font-size:10px;text-transform:uppercase;letter-spacing:.9px;
  color:var(--muted);margin-bottom:10px;font-weight:700;
}
.bio{
  font-size:12.5px;line-height:1.65;color:#c8cfe0;
  background:var(--card);padding:13px 15px;border-radius:10px;
  border-left:3px solid var(--key);
}
.total-box{
  background:var(--card);border-radius:12px;padding:16px;
  border:1px solid var(--border);text-align:center;
}
.total-number{font-size:36px;font-weight:800;letter-spacing:-1.5px;line-height:1}
.total-label{font-size:11.5px;color:var(--muted);margin-top:6px}
.report-list{display:flex;flex-direction:column;gap:6px;max-height:280px;overflow-y:auto;padding-right:4px}
.report-item{
  display:flex;align-items:center;gap:10px;padding:8px 10px;
  background:var(--card);border:1px solid var(--border);border-radius:9px;
  cursor:pointer;transition:.2s;
}
.report-item:hover{border-color:var(--muted);background:var(--card-2);transform:translateX(3px)}
.report-avatar{
  width:28px;height:28px;border-radius:50%;flex-shrink:0;
  display:grid;place-items:center;font-weight:700;font-size:10px;color:#fff;
}
.report-info{min-width:0;flex:1}
.report-name{font-size:12px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.report-role{font-size:10px;color:var(--muted);margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.empty-state{
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  height:100%;text-align:center;gap:14px;padding:30px;
}
.empty-state svg{opacity:.2}
.empty-state h3{font-size:14px;font-weight:600;color:var(--muted)}
.empty-state p{font-size:12px;color:var(--muted);opacity:.7;line-height:1.6;max-width:260px}

@media (max-width:900px){
  .stage.with-panel{right:0}
  .panel{width:100%;top:auto;bottom:0;max-height:70vh;border-left:none;border-top:1px solid var(--border);border-radius:20px 20px 0 0;transform:translateY(100%)}
  .panel.open{transform:translateY(0)}
  .legend{display:none}
}
::-webkit-scrollbar{width:8px}
::-webkit-scrollbar-track{background:transparent}
::-webkit-scrollbar-thumb{background:var(--border);border-radius:4px}

/* =========================================================
   LAYOUT CONSTANTS
   ========================================================= */
const NS = 'http://www.w3.org/2000/svg';
const areaHex = {key:'#a78bfa', windsor:'#22d3ee', heliot:'#fbbf24', cosecha:'#34d399'};
const areaNames = {key:'Key', windsor:'Windsor', heliot:'Heliot Media', cosecha:'Cosecha'};

const CX = 1100, CY = 1100;       // centro del lienzo
const R_SUN = 62;                  // Key
const R_SUB = 260;                 // sub-centros
const R_RING_SUB = 34;             // radio visual sub-centro
const R_AREAS = 480;               // sub-áreas
const R_RING_AREA = 24;
const R_PEOPLE_BASE = 640;         // primer anillo de personas
const R_PEOPLE_STEP = 70;          // separación entre anillos
const R_PERSON = 11;

/* =========================================================
   HELPERS
   ========================================================= */
function initials(name){
  return name.split(' ').filter(w=>w.length>1).slice(0,2).map(w=>w[0]).join('').toUpperCase();
}
function el(tag, attrs={}, parent){
  const e = document.createElementNS(NS, tag);
  for(const k in attrs) e.setAttribute(k, attrs[k]);
  if(parent) parent.appendChild(e);
  return e;
}
function polar(cx, cy, r, deg){
  const rad = (deg - 90) * Math.PI / 180;
  return [cx + r * Math.cos(rad), cy + r * Math.sin(rad)];
}

/* =========================================================
   BUILD SVG
   ========================================================= */
const map = document.getElementById('map');
map.setAttribute('viewBox', `0 0 ${CX*2} ${CY*2}`);

const defs = el('defs', {}, map);
// Radial gradient for Key nucleus
const grad = el('radialGradient', {id:'sunGrad', cx:'50%', cy:'50%', r:'50%'}, defs);
el('stop', {offset:'0%', 'stop-color':'#ffffff', 'stop-opacity':'.98'}, grad);
el('stop', {offset:'40%', 'stop-color':'#a78bfa', 'stop-opacity':'.95'}, grad);
el('stop', {offset:'100%', 'stop-color':'#7c3aed', 'stop-opacity':'.55'}, grad);
const glowGrad = el('radialGradient', {id:'sunGlow', cx:'50%', cy:'50%', r:'50%'}, defs);
el('stop', {offset:'0%', 'stop-color':'#a78bfa', 'stop-opacity':'.55'}, glowGrad);
el('stop', {offset:'60%', 'stop-color':'#a78bfa', 'stop-opacity':'.12'}, glowGrad);
el('stop', {offset:'100%', 'stop-color':'#a78bfa', 'stop-opacity':'0'}, glowGrad);

const linksG = el('g', {class:'links'}, map);
const ringsG = el('g', {class:'rings'}, map);
const nodesG = el('g', {class:'nodes'}, map);

/* =========================================================
   DIBUJAR KEY (núcleo central)
   ========================================================= */
function drawKey(){
  const g = el('g', {class:'node-body', 'data-id':'key'}, nodesG);
  // glow
  el('circle', {cx:CX, cy:CY, r:R_SUN*3, fill:'url(#sunGlow)'}, g);
  // pulse
  const pulse = el('circle', {
    class:'sun-glow', cx:CX, cy:CY, r:R_SUN,
    fill:'none', stroke:'#a78bfa', 'stroke-width':2
  }, g);
  el('animate', {attributeName:'r', from:R_SUN, to:R_SUN*2.4, dur:'3.5s', repeatCount:'indefinite'}, pulse);
  el('animate', {attributeName:'opacity', from:.7, to:0, dur:'3.5s', repeatCount:'indefinite'}, pulse);
  // core
  el('circle', {
    class:'sun-core', cx:CX, cy:CY, r:R_SUN,
    fill:'url(#sunGrad)', stroke:'rgba(255,255,255,.6)', 'stroke-width':2,
    style:'filter:drop-shadow(0 0 26px #a78bfa) drop-shadow(0 0 50px #a78bfa)'
  }, g);
  // label
  el('text', {x:CX, y:CY, fill:'#fff', 'font-size':22, 'font-weight':800, 'letter-spacing':1}, g).textContent = 'KEY';

  // hover y click
  g.addEventListener('mouseenter', ()=> showTooltip(data, CX, CY - R_SUN - 10));
  g.addEventListener('mouseleave', hideTooltip);
  g.addEventListener('click', ()=> selectNode(data));
}

/* =========================================================
   DIBUJAR SUB-CENTROS + SUB-ÁREAS + PERSONAS
   ========================================================= */
function drawSubCenter(sub){
  const area = sub.area;
  const color = areaHex[area];
  const angle = sub.angle;

  // --- Posición del sub-centro ---
  const [sx, sy] = polar(CX, CY, R_SUB, angle);

  // Link desde Key
  el('line', {
    class:'link',
    'data-from':'key', 'data-to':sub.id,
    x1:CX, y1:CY, x2:sx, y2:sy,
    stroke: color, 'stroke-width':2, opacity:.5
  }, linksG);

  // --- Sub-centro nodo ---
  const sg = el('g', {class:'node-body', 'data-id':sub.id}, nodesG);
  el('circle', {class:'halo', cx:sx, cy:sy, r:R_RING_SUB*1.7, fill:color}, sg);
  el('circle', {
    cx:sx, cy:sy, r:R_RING_SUB,
    fill:'rgba(10,12,20,.95)', stroke:color, 'stroke-width':2.5,
    style:`filter:drop-shadow(0 0 12px ${color})`
  }, sg);
  el('text', {
    x:sx, y:sy - R_RING_SUB - 14,
    fill:color, 'font-size':14, 'font-weight':800
  }, sg).textContent = sub.name;
  el('text', {
    x:sx, y:sy + 1, fill:color, 'font-size':11, 'font-weight':700
  }, sg).textContent = initials(sub.name);

  sg.addEventListener('mouseenter', ()=> showTooltip(sub, sx, sy - R_RING_SUB - 22));
  sg.addEventListener('mouseleave', hideTooltip);
  sg.addEventListener('click', ()=> selectNode(sub));

  // --- Sub-áreas ---
  const areas = sub.children || [];
  const n = areas.length;

  // Ángulo en el que se abre el abanico (centrado en el ángulo del subcentro)
  // Abanico total ~70°
  const fan = 70;
  const half = fan / 2;
  const startA = angle - half;
  const stepA = n > 1 ? fan / (n - 1) : 0;

  areas.forEach((a, i)=>{
    const aAngle = n === 1 ? angle : startA + stepA * i;
    const [ax, ay] = polar(CX, CY, R_AREAS, aAngle);

    // Link desde sub-centro a sub-área
    el('line', {
      class:'link',
      'data-from':sub.id, 'data-to':a.id,
      x1:sx, y1:sy, x2:ax, y2:ay,
      stroke: color, 'stroke-width':1.5, opacity:.35
    }, linksG);

    // --- Nodo sub-área ---
    const ag = el('g', {class:'node-body', 'data-id':a.id}, nodesG);
    el('circle', {class:'halo', cx:ax, cy:ay, r:R_RING_AREA*1.8, fill:color}, ag);
    el('circle', {
      cx:ax, cy:ay, r:R_RING_AREA,
      fill:'rgba(10,12,20,.9)', stroke:color, 'stroke-width':2,
      style:`filter:drop-shadow(0 0 8px ${color})`
    }, ag);
    el('text', {
      x:ax, y:ay - R_RING_AREA - 12,
      fill:color, 'font-size':11, 'font-weight':700
    }, ag).textContent = a.name;
    el('text', {
      x:ax, y:ay + 1, fill:color, 'font-size':9, 'font-weight':700
    }, ag).textContent = initials(a.name);

    ag.addEventListener('mouseenter', ()=> showTooltip(a, ax, ay - R_RING_AREA - 20));
    ag.addEventListener('mouseleave', hideTooltip);
    ag.addEventListener('click', ()=> selectNode(a));

    // --- Personas ---
    const people = a.people || [];
    const pn = people.length;

    // Distribuir en anillos según cantidad
    const perRing = pn <= 10 ? pn : Math.ceil(pn / Math.ceil(pn / 10));
    const rings = Math.ceil(pn / perRing);

    // Ángulo del abanico alrededor de la sub-área (más cerrado)
    const pFan = Math.min(45, 12 + pn * 2);
    const pHalf = pFan / 2;

    people.forEach((p, j)=>{
      const ringIdx = Math.floor(j / perRing);
      const idxInRing = j % perRing;
      const totalInRing = Math.min(perRing, pn - ringIdx * perRing);

      const ringR = R_PEOPLE_BASE + ringIdx * R_PEOPLE_STEP;

      // Distribuir dentro del anillo, centrado en aAngle
      const pStart = totalInRing === 1 ? aAngle : aAngle - pHalf;
      const pStep = totalInRing > 1 ? (pHalf * 2) / (totalInRing - 1) : 0;
      const pAngle = totalInRing === 1 ? aAngle : pStart + pStep * idxInRing;

      const [px, py] = polar(CX, CY, ringR, pAngle);

      // Link desde la sub-área
      el('line', {
        class:'link',
        'data-from':a.id, 'data-to':p.id,
        x1:ax, y1:ay, x2:px, y2:py,
        stroke: color, 'stroke-width':1, opacity:.22
      }, linksG);

      // --- Nodo persona ---
      const pg = el('g', {class:'node-body', 'data-id':p.id}, nodesG);
      el('circle', {class:'halo', cx:px, cy:py, r:R_PERSON*2.2, fill:color}, pg);
      el('circle', {
        cx:px, cy:py, r:R_PERSON,
        fill:'rgba(10,12,20,.95)', stroke:color, 'stroke-width':1.5
      }, pg);
      el('text', {
        x:px, y:py + 1, fill:color, 'font-size':8, 'font-weight':700
      }, pg).textContent = initials(p.name);

      pg.addEventListener('mouseenter', ()=> showTooltip(p, px, py - R_PERSON - 12));
      pg.addEventListener('mouseleave', hideTooltip);
      pg.addEventListener('click', ()=> selectNode(p));
    });
  });
}

/* =========================================================
   RENDER
   ========================================================= */
function render(){
  linksG.innerHTML = '';
  ringsG.innerHTML = '';
  nodesG.innerHTML = '';

  drawKey();

  data.children.forEach(sub=> drawSubCenter(sub));
}

render();

/* =========================================================
   TOOLTIP
   ========================================================= */
const tooltip = document.getElementById('tooltip');
function showTooltip(node, svgX, svgY){
  const svg = document.getElementById('map');
  const rect = svg.getBoundingClientRect();
  const vb = svg.viewBox.baseVal;
  const scaleX = rect.width / vb.width;
  const scaleY = rect.height / vb.height;
  const scale = Math.min(scaleX, scaleY);
  const offsetX = (rect.width - vb.width * scale) / 2;
  const offsetY = (rect.height - vb.height * scale) / 2;

  // Considera el transform del stage (zoom + pan)
  const t = currentTransform;
  const screenX = (svgX * scale * t.scale) + offsetX + rect.left + t.x;
  const screenY = (svgY * scale * t.scale) + offsetY + rect.top + t.y;

  const area = node.area || 'key';
  const color = areaHex[area] || '#a78bfa';

  tooltip.innerHTML = `
    <div class="tooltip-name">${node.name}</div>
    <div class="tooltip-role">${node.role || ''}</div>
  `;
  tooltip.style.left = screenX + 'px';
  tooltip.style.top = (screenY - 10) + 'px';
  tooltip.classList.add('show');
}
function hideTooltip(){ tooltip.classList.remove('show'); }

/* =========================================================
   PANEL
   ========================================================= */
const panel = document.getElementById('panel');
const panelContent = document.getElementById('panelContent');
const stage = document.getElementById('stage');

function findNode(root, id){
  if(root.id === id) return root;
  if(root.children){
    for(const c of root.children){
      const f = findNode(c, id);
      if(f) return f;
    }
  }
  return null;
}

function selectNode(node){
  const area = node.area || 'key';
  const color = areaHex[area];
  const directChildren = node.children || [];
  const people = node.people || [];

  // Combine: children (sub-áreas) + people
  const reports = directChildren.length ? directChildren : people;

  const reportsHTML = reports.length ? `
    <div class="section">
      <h3>${directChildren.length ? 'Sub-áreas / equipo directo' : 'Personas en este nodo'} · ${reports.length}</h3>
      <div class="report-list">
        ${reports.map(r=>{
          const rColor = areaHex[r.area || area] || color;
          return `<div class="report-item" data-id="${r.id}">
            <div class="report-avatar" style="background:linear-gradient(135deg,${rColor},${rColor}99);box-shadow:0 0 10px ${rColor}55">${initials(r.name)}</div>
            <div class="report-info">
              <div class="report-name">${r.name}</div>
              <div class="report-role">${r.role || ''}</div>
            </div>
          </div>`;
        }).join('')}
      </div>
    </div>` : '';

  panelContent.innerHTML = `
    <div class="panel-header">
      <div class="panel-avatar" style="background:linear-gradient(135deg,${color},${color}88);box-shadow:0 0 22px ${color}66">${initials(node.name)}</div>
      <div style="min-width:0;flex:1">
        <div class="panel-name">${node.name}</div>
        <div class="panel-role">${node.role || ''}</div>
        <span class="panel-area" style="background:${color}22;color:${color}">${areaNames[area]}</span>
      </div>
    </div>
    ${node.bio ? `<div class="section"><h3>Sobre su rol</h3><div class="bio" style="border-left-color:${color}">${node.bio}</div></div>` : ''}
    ${reportsHTML}
  `;

  // Click en sub-item → seleccionar ese
  panelContent.querySelectorAll('.report-item').forEach(el=>{
    el.addEventListener('click', ()=>{
      const child = findNode(data, el.dataset.id);
      if(child) selectNode(child);
    });
  });

  panel.classList.add('open');
  stage.classList.add('with-panel');

  // Resaltar en el mapa
  applySelection(node);
}

function applySelection(node){
  const allBodies = document.querySelectorAll('.node-body');
  allBodies.forEach(b => b.classList.remove('selected','descendant','dimmed'));
  // Resalta el nodo y atenúa todo lo demás (simplificado)
  allBodies.forEach(b=>{
    if(b.dataset.id === node.id) b.classList.add('selected');
    else b.classList.add('dimmed');
  });
}

function closePanel(){
  panel.classList.remove('open');
  stage.classList.remove('with-panel');
  document.querySelectorAll('.node-body').forEach(b => b.classList.remove('selected','dimmed','descendant'));
}

document.getElementById('panelClose').addEventListener('click', closePanel);
document.addEventListener('keydown', e => { if(e.key === 'Escape') closePanel(); });

/* =========================================================
   ZOOM & PAN
   ========================================================= */
const svg = document.getElementById('map');
let currentTransform = {x:0, y:0, scale:1};
function applyTransform(){
  svg.style.transform = `translate(${currentTransform.x}px, ${currentTransform.y}px) scale(${currentTransform.scale})`;
}

document.getElementById('zoomIn').addEventListener('click', ()=>{
  currentTransform.scale = Math.min(currentTransform.scale * 1.25, 4);
  applyTransform();
});
document.getElementById('zoomOut').addEventListener('click', ()=>{
  currentTransform.scale = Math.max(currentTransform.scale / 1.25, 0.4);
  applyTransform();
});
document.getElementById('zoomReset').addEventListener('click', ()=>{
  currentTransform = {x:0, y:0, scale:1};
  applyTransform();
});

// Zoom con rueda
stage.addEventListener('wheel', (e)=>{
  e.preventDefault();
  const delta = e.deltaY > 0 ? 0.9 : 1.1;
  currentTransform.scale = Math.max(0.4, Math.min(4, currentTransform.scale * delta));
  applyTransform();
}, {passive:false});

// Pan con drag
let isDragging = false;
let dragStart = {x:0, y:0};
let transformStart = {x:0, y:0};

stage.addEventListener('mousedown', (e)=>{
  if(e.target.closest('.node-body')) return;
  isDragging = true;
  stage.classList.add('grabbing');
  dragStart = {x:e.clientX, y:e.clientY};
  transformStart = {x:currentTransform.x, y:currentTransform.y};
});
document.addEventListener('mousemove', (e)=>{
  if(!isDragging) return;
  currentTransform.x = transformStart.x + (e.clientX - dragStart.x);
  currentTransform.y = transformStart.y + (e.clientY - dragStart.y);
  applyTransform();
});
document.addEventListener('mouseup', ()=>{
  isDragging = false;
  stage.classList.remove('grabbing');
});

// Touch pan (móvil)
let touchStart = null;
stage.addEventListener('touchstart', (e)=>{
  if(e.target.closest('.node-body')) return;
  if(e.touches.length === 1){
    touchStart = {x:e.touches[0].clientX, y:e.touches[0].clientY, tx:currentTransform.x, ty:currentTransform.y};
  }
}, {passive:true});
stage.addEventListener('touchmove', (e)=>{
  if(!touchStart || e.touches.length !== 1) return;
  currentTransform.x = touchStart.tx + (e.touches[0].clientX - touchStart.x);
  currentTransform.y = touchStart.ty + (e.touches[0].clientY - touchStart.y);
  applyTransform();
}, {passive:true});
stage.addEventListener('touchend', ()=>{ touchStart = null; });

// Cerrar panel al click en fondo
stage.addEventListener('click', (e)=>{
  if(!e.target.closest('.node-body')) closePanel();
});
</script>
