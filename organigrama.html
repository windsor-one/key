<head>

<title>Átomo Organizacional · Key</title>
<style>
:root{
  --key:#a78bfa; --key-glow:rgba(167,139,250,.4);
  --windsor:#22d3ee; --windsor-glow:rgba(34,211,238,.4);
  --heliot:#fbbf24; --heliot-glow:rgba(251,191,36,.4);
  --cosecha:#34d399; --cosecha-glow:rgba(52,211,153,.4);
  --bg:#05060d; --card:#151823; --card-2:#1a1f2e;
  --border:#232838; --text:#f1f5f9; --muted:#8892a8;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;overflow:hidden;font-family:'Inter',-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;background:var(--bg);color:var(--text)}

/* ============ STARS BG ============ */
body::before{
  content:'';position:fixed;inset:0;pointer-events:none;z-index:0;
  background:
    radial-gradient(circle at 20% 30%, rgba(167,139,250,.08) 0%, transparent 40%),
    radial-gradient(circle at 80% 70%, rgba(34,211,238,.06) 0%, transparent 40%),
    radial-gradient(circle at 50% 50%, rgba(251,191,36,.03) 0%, transparent 50%);
}
body::after{
  content:'';position:fixed;inset:0;pointer-events:none;z-index:0;opacity:.35;
  background-image:
    radial-gradient(1px 1px at 10% 20%, #fff, transparent),
    radial-gradient(1px 1px at 30% 60%, #fff, transparent),
    radial-gradient(1px 1px at 70% 30%, #fff, transparent),
    radial-gradient(1px 1px at 85% 80%, #fff, transparent),
    radial-gradient(1px 1px at 45% 90%, #fff, transparent),
    radial-gradient(1px 1px at 15% 75%, #fff, transparent),
    radial-gradient(1px 1px at 60% 15%, #fff, transparent),
    radial-gradient(1px 1px at 90% 45%, #fff, transparent);
  animation:twinkle 5s ease-in-out infinite alternate;
}
@keyframes twinkle{0%{opacity:.2}100%{opacity:.5}}

/* ============ TOPBAR ============ */
.topbar{
  position:fixed;top:0;left:0;right:0;z-index:50;height:60px;
  padding:0 18px;display:flex;align-items:center;gap:14px;
  background:rgba(5,6,13,.7);backdrop-filter:blur(18px);
  border-bottom:1px solid var(--border);
}
.brand{display:flex;align-items:center;gap:11px}
.brand-mark{
  width:34px;height:34px;border-radius:10px;
  background:linear-gradient(135deg,var(--key),#7c3aed);
  display:grid;place-items:center;font-weight:800;font-size:15px;color:#fff;
  box-shadow:0 0 18px var(--key-glow);
}
.brand-text h1{font-size:13px;font-weight:700;letter-spacing:-.2px}
.brand-text p{font-size:10.5px;color:var(--muted);margin-top:1px}

.search-wrap{position:relative;flex:1;max-width:280px;margin-left:auto}
.search-wrap svg{position:absolute;left:11px;top:50%;transform:translateY(-50%);color:var(--muted)}
.search-wrap input{
  width:100%;padding:8px 12px 8px 34px;
  background:var(--card);border:1px solid var(--border);border-radius:9px;
  color:var(--text);font-size:12.5px;outline:none;transition:.2s;
}
.search-wrap input:focus{border-color:var(--key);box-shadow:0 0 0 3px var(--key-glow)}

/* ============ ATOM ============ */
.atom-container{
  position:fixed;inset:60px 0 0 0;z-index:1;
  display:flex;align-items:center;justify-content:center;
  transition:padding-right .35s cubic-bezier(.4,0,.2,1);
}
.atom-container.with-panel{padding-right:360px}
svg.atom{
  width:100%;height:100%;
  max-width:100%;max-height:100%;
  user-select:none;
}

/* ============ SVG STYLES ============ */
.orbit-ring{
  fill:none;stroke-width:1.2;stroke-dasharray:3 5;
  opacity:.28;transition:.3s;
}
.orbit-ring[data-area="key"]{stroke:var(--key)}
.orbit-ring[data-area="windsor"]{stroke:var(--windsor)}
.orbit-ring[data-area="heliot"]{stroke:var(--heliot)}
.orbit-ring[data-area="cosecha"]{stroke:var(--cosecha)}
.orbit-ring.dimmed{opacity:.08}
.orbit-ring.highlight{opacity:.7;stroke-width:2;stroke-dasharray:none}

.electron{cursor:pointer;transition:transform .2s,opacity .25s}
.electron .ec-circle{
  transition:r .2s ease, filter .25s, opacity .25s;
  stroke-width:2;
}
.electron .ec-initials{
  font-family:'Inter',sans-serif;font-weight:700;text-anchor:middle;
  dominant-baseline:central;pointer-events:none;
  transition:font-size .2s;
}
.electron:hover .ec-circle{
  filter:drop-shadow(0 0 14px currentColor) drop-shadow(0 0 6px currentColor);
}
.electron.dimmed{opacity:.15}
.electron.selected .ec-circle{
  filter:drop-shadow(0 0 22px currentColor) drop-shadow(0 0 12px currentColor);
  stroke-width:3;
}
.electron.descendant .ec-circle{
  filter:drop-shadow(0 0 10px currentColor);
}

/* Nucleus */
.nucleus-core{
  animation:nucleusPulse 3s ease-in-out infinite;
  transform-origin:center;
}
@keyframes nucleusPulse{
  0%,100%{transform:scale(1);opacity:.9}
  50%{transform:scale(1.06);opacity:1}
}
.nucleus-glow{
  animation:nucleusGlow 4s ease-in-out infinite;
  transform-origin:center;
}
@keyframes nucleusGlow{
  0%,100%{opacity:.35;transform:scale(1)}
  50%{opacity:.55;transform:scale(1.15)}
}
.nucleus-label{
  font-family:'Inter',sans-serif;font-weight:800;text-anchor:middle;
  dominant-baseline:central;pointer-events:none;
  letter-spacing:1px;
}

/* Orbit rotation wrappers */
.orbit-group{
  transform-origin:center;
  transition:opacity .3s;
}
.orbit-group.spin-slow{animation:spin 120s linear infinite}
.orbit-group.spin-med{animation:spin 90s linear infinite reverse}
.orbit-group.spin-fast{animation:spin 75s linear infinite}
.orbit-group.paused{animation-play-state:paused}
@keyframes spin{to{transform:rotate(360deg)}}

/* Counter-rotate labels so they stay upright */
.electron-group{
  transform-origin:center;
}
.orbit-group.spin-slow .electron-group{animation:spinRev 120s linear infinite}
.orbit-group.spin-med .electron-group{animation:spinRev 90s linear infinite}
.orbit-group.spin-fast .electron-group{animation:spinRev 75s linear infinite}
.orbit-group.paused .electron-group{animation-play-state:paused}
@keyframes spinRev{to{transform:rotate(-360deg)}}

/* Tooltip */
.tooltip{
  position:fixed;z-index:100;pointer-events:none;
  background:rgba(15,17,23,.98);backdrop-filter:blur(12px);
  border:1px solid var(--border);border-radius:10px;
  padding:10px 14px;max-width:260px;
  transform:translate(-50%,-100%);
  opacity:0;transition:opacity .15s;
  box-shadow:0 10px 30px rgba(0,0,0,.6);
}
.tooltip.show{opacity:1}
.tooltip-name{font-size:12.5px;font-weight:700}
.tooltip-role{font-size:11px;color:var(--muted);margin-top:2px}
.tooltip-area{
  display:inline-block;padding:2px 7px;border-radius:5px;
  font-size:9.5px;font-weight:800;text-transform:uppercase;
  letter-spacing:.5px;margin-top:7px;
}

/* ============ PANEL ============ */
.panel{
  position:fixed;top:60px;right:0;bottom:0;width:360px;z-index:40;
  background:rgba(10,12,20,.96);backdrop-filter:blur(24px);
  border-left:1px solid var(--border);
  padding:22px;overflow-y:auto;
  transform:translateX(100%);
  transition:transform .35s cubic-bezier(.4,0,.2,1);
}
.panel.open{transform:translateX(0)}
.panel-close{
  position:absolute;top:14px;right:14px;width:28px;height:28px;
  border-radius:8px;background:var(--card);border:1px solid var(--border);
  color:var(--muted);cursor:pointer;display:grid;place-items:center;
  font-size:12px;transition:.2s;
}
.panel-close:hover{color:var(--text);border-color:var(--muted)}

.panel-header{
  display:flex;align-items:center;gap:14px;
  padding-bottom:16px;border-bottom:1px solid var(--border);margin-bottom:18px;
  padding-right:28px;
}
.panel-avatar{
  width:54px;height:54px;border-radius:50%;flex-shrink:0;
  display:grid;place-items:center;font-weight:800;font-size:19px;color:#fff;
}
.panel-name{font-size:15.5px;font-weight:700;letter-spacing:-.3px;line-height:1.2}
.panel-role{font-size:11.5px;color:var(--muted);margin-top:4px;line-height:1.4}
.panel-area{
  display:inline-block;padding:3px 9px;border-radius:6px;
  font-size:9.5px;font-weight:800;text-transform:uppercase;
  letter-spacing:.6px;margin-top:8px;
}

.section{margin-bottom:18px}
.section h3{
  font-size:10px;text-transform:uppercase;letter-spacing:.9px;
  color:var(--muted);margin-bottom:10px;font-weight:700;
}
.bio{
  font-size:12.5px;line-height:1.65;color:#c8cfe0;
  background:var(--card);padding:13px 15px;border-radius:10px;
  border-left:3px solid var(--key);
}
.total-box{
  background:var(--card);border-radius:12px;padding:16px;
  border:1px solid var(--border);text-align:center;
}
.total-number{font-size:36px;font-weight:800;letter-spacing:-1.5px;line-height:1}
.total-label{font-size:11.5px;color:var(--muted);margin-top:6px}

.report-list{display:flex;flex-direction:column;gap:6px}
.report-item{
  display:flex;align-items:center;gap:11px;padding:10px 12px;
  background:var(--card);border:1px solid var(--border);border-radius:10px;
  cursor:pointer;transition:.2s;
}
.report-item:hover{
  border-color:var(--muted);transform:translateX(3px);
  background:var(--card-2);
}
.report-avatar{
  width:32px;height:32px;border-radius:50%;flex-shrink:0;
  display:grid;place-items:center;font-weight:700;font-size:11px;color:#fff;
}
.report-info{min-width:0;flex:1}
.report-name{font-size:12.5px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.report-role{font-size:10.5px;color:var(--muted);margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.no-reports{
  text-align:center;padding:16px;color:var(--muted);
  font-size:11.5px;font-style:italic;
  background:var(--card);border-radius:10px;
}

.empty-state{
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  height:100%;text-align:center;gap:14px;padding:30px;
}
.empty-state svg{opacity:.25}
.empty-state h3{font-size:14px;font-weight:600;color:var(--muted)}
.empty-state p{font-size:12px;color:var(--muted);opacity:.7;line-height:1.6;max-width:260px}

/* Hint bottom-left */
.hint{
  position:fixed;bottom:16px;left:16px;z-index:20;
  padding:9px 14px;background:rgba(10,12,20,.85);backdrop-filter:blur(12px);
  border:1px solid var(--border);border-radius:10px;
  font-size:11px;color:var(--muted);
  display:flex;align-items:center;gap:8px;
}
.hint-dot{width:8px;height:8px;border-radius:50%;background:var(--key);box-shadow:0 0 8px var(--key-glow);animation:pulse 2s ease-in-out infinite}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.4}}

/* Responsive */
@media (max-width:900px){
  .panel{width:100%;top:auto;bottom:0;max-height:70vh;border-left:none;border-top:1px solid var(--border);border-radius:20px 20px 0 0}
  .atom-container.with-panel{padding-right:0}
  .search-wrap{max-width:none}
  .brand-text p{display:none}
}
::-webkit-scrollbar{width:8px}
::-webkit-scrollbar-track{background:transparent}
::-webkit-scrollbar-thumb{background:var(--border);border-radius:4px}
::-webkit-scrollbar-thumb:hover{background:var(--muted)}
</style>

/* ================= HELPERS ================= */
const NS = 'http://www.w3.org/2000/svg';
const areaHex = {
  key:'#a78bfa', windsor:'#22d3ee', heliot:'#fbbf24', cosecha:'#34d399'
};
const areaNames = {
  key:'Key · Fundación', windsor:'Windsor',
  heliot:'Heliot Media', cosecha:'Cosecha'
};
const areaGlow = {
  key:'rgba(167,139,250,.6)', windsor:'rgba(34,211,238,.6)',
  heliot:'rgba(251,191,36,.6)', cosecha:'rgba(52,211,153,.6)'
};

function initials(name){
  return name.split(' ').filter(w=>w.length>1).slice(0,2).map(w=>w[0]).join('').toUpperCase();
}
function descendants(node){
  const ids=[];
  (function walk(n){ (n.children||[]).forEach(c=>{ids.push(c.id);walk(c)}); })(node);
  return ids;
}
function findNode(node,id){
  if(node.id===id) return node;
  if(node.children){ for(const c of node.children){const f=findNode(c,id); if(f) return f;} }
  return null;
}
function el(tag, attrs={}, parent){
  const e = document.createElementNS(NS, tag);
  for(const k in attrs) e.setAttribute(k, attrs[k]);
  if(parent) parent.appendChild(e);
  return e;
}

/* ================= BUILD ATOM ================= */
const CX = 700, CY = 700;
const MIN_R = 130, MAX_R = 620;
const ROTATIONS = ['spin-slow','spin-med','spin-fast'];

const svg = document.getElementById('atom');
const defs = el('defs', {}, svg);

// Gradients for nucleus
const ng = el('radialGradient', {id:'nucleusGrad', cx:'50%', cy:'50%', r:'50%'}, defs);
el('stop', {offset:'0%', 'stop-color':'#c4b5fd'}, ng);
el('stop', {offset:'50%', 'stop-color':'#a78bfa'}, ng);
el('stop', {offset:'100%', 'stop-color':'#7c3aed'}, ng);

const ng2 = el('radialGradient', {id:'nucleusGlow', cx:'50%', cy:'50%', r:'50%'}, defs);
el('stop', {offset:'0%', 'stop-color':'#a78bfa', 'stop-opacity':'.6'}, ng2);
el('stop', {offset:'100%', 'stop-color':'#a78bfa', 'stop-opacity':'0'}, ng2);

// Nucleus
const nucleusGroup = el('g', {class:'nucleus'}, svg);
// glow
el('circle', {
  class:'nucleus-glow', cx:CX, cy:CY, r:140,
  fill:'url(#nucleusGlow)'
}, nucleusGroup);
// core
el('circle', {
  class:'nucleus-core', cx:CX, cy:CY, r:70,
  fill:'url(#nucleusGrad)',
  stroke:'rgba(255,255,255,.5)', 'stroke-width':2
}, nucleusGroup);
// label
el('text', {
  class:'nucleus-label', x:CX, y:CY, fill:'#fff',
  'font-size':26, 'font-weight':800
}, nucleusGroup).textContent = 'KEY';
// pulse ring
const pulse = el('circle', {
  cx:CX, cy:CY, r:70, fill:'none',
  stroke:'#a78bfa', 'stroke-width':1.5, opacity:.6
}, nucleusGroup);
const pulseAnim = el('animate', {
  attributeName:'r', from:70, to:150, dur:'3s',
  repeatCount:'indefinite'
}, pulse);
const pulseAnimOp = el('animate', {
  attributeName:'opacity', from:.6, to:0, dur:'3s',
  repeatCount:'indefinite'
}, pulse);

// Click nucleus → select Key
nucleusGroup.style.cursor = 'pointer';
nucleusGroup.addEventListener('click', ()=> selectNode('key'));

/* ---- BUILD ORBITS ---- */
const departments = org.children;
const orbitsEl = el('g', {class:'orbits'}, svg);

// Precompute radius per department (exponential-ish spacing)
const N = departments.length;
const radii = departments.map((d, i)=>{
  const n = d.children ? d.children.length : 0;
  const step = (MAX_R - MIN_R) / (N - 1);
  return MIN_R + step * i;
});

// Build each orbit
const electronData = {}; // id -> {x,y,r,el}

departments.forEach((dept, i)=>{
  const radius = radii[i];
  const members = dept.children || [];
  const area = dept.area || 'key';
  const color = areaHex[area];

  // Orbit group (rotating)
  const rotClass = ROTATIONS[i % 3];
  const orbitGroup = el('g', {
    class:`orbit-group ${rotClass}`,
    'data-orbit-id': dept.id
  }, orbitsEl);

  // Ring
  const ring = el('circle', {
    class:'orbit-ring',
    cx:CX, cy:CY, r:radius,
    'data-area':area,
    'data-orbit-id': dept.id
  }, orbitGroup);

  // Electrons
  const n = members.length;
  members.forEach((m, j)=>{
    // Start at top; distribute evenly
    const angle = -Math.PI/2 + (j / n) * 2 * Math.PI;
    const x = CX + radius * Math.cos(angle);
    const y = CY + radius * Math.sin(angle);

    // Electron size: department heads bigger? No, all children are team members here
    // Group heads (like 'Tecnología') have children → bigger
    const hasChildren = m.children && m.children.length > 0;
    const eR = hasChildren ? 24 : 17;

    const g = el('g', {
      class:'electron electron-group',
      'data-id': m.id,
      'data-area': m.area || area,
      transform:`translate(${x},${y})`
    }, orbitGroup);

    // Halo
    el('circle', {
      cx:0, cy:0, r:eR + 8,
      fill: color, opacity:.15
    }, g);

    // Circle
    const c = el('circle', {
      class:'ec-circle',
      cx:0, cy:0, r:eR,
      fill: 'rgba(15,17,23,.95)',
      stroke: color,
      'stroke-width': 2.5,
      style:`color:${color}`
    }, g);

    // Initials
    el('text', {
      class:'ec-initials', x:0, y:1,
      fill: color,
      'font-size': hasChildren ? 11 : 9
    }, g).textContent = initials(m.name);

    // Store position data
    electronData[m.id] = {x, y, r: eR, el: g, node: m, color, area: m.area || area, deptId: dept.id};

    // Events
    g.addEventListener('click', (e)=>{
      e.stopPropagation();
      selectNode(m.id);
    });
    g.addEventListener('mouseenter', (e)=> showTooltip(m, x, y, eR));
    g.addEventListener('mouseleave', hideTooltip);
  });

  // Store dept info for panel
  electronData[dept.id] = {node: dept, color, area, isDept: true};
});

/* ================= TOOLTIP ================= */
const tooltip = document.getElementById('tooltip');
function showTooltip(node, x, y, eR){
  const area = node.area || 'key';
  const color = areaHex[area];
  const rect = svg.getBoundingClientRect();
  const vb = svg.viewBox.baseVal;
  // Convert SVG coords to screen
  const scale = Math.min(rect.width / vb.width, rect.height / vb.height);
  const svgX = x * scale + (rect.width - vb.width * scale) / 2 + rect.left;
  const svgY = y * scale + (rect.height - vb.height * scale) / 2 + rect.top;

  tooltip.innerHTML = `
    <div class="tooltip-name">${node.name}</div>
    <div class="tooltip-role">${node.role}</div>
    <span class="tooltip-area" style="background:${color}22;color:${color}">${areaNames[area]}</span>
  `;
  tooltip.style.left = svgX + 'px';
  tooltip.style.top = (svgY - eR * scale - 14) + 'px';
  tooltip.classList.add('show');

  // Pause all orbits
  document.querySelectorAll('.orbit-group').forEach(g => g.classList.add('paused'));
}
function hideTooltip(){
  tooltip.classList.remove('show');
  document.querySelectorAll('.orbit-group').forEach(g => g.classList.remove('paused'));
}

/* ================= SELECT ================= */
let selectedId = null;
function selectNode(id){
  selectedId = id;
  const node = findNode(org, id) || (id === 'key' ? org : null);
  if(!node) return;
  const descIds = descendants(node);

  // Dim/highlight electrons
  document.querySelectorAll('.electron').forEach(g=>{
    const gid = g.dataset.id;
    g.classList.remove('selected','descendant','dimmed');
    if(gid === id) g.classList.add('selected');
    else if(descIds.includes(gid)) g.classList.add('descendant');
    else g.classList.add('dimmed');
  });

  // Highlight rings
  document.querySelectorAll('.orbit-ring').forEach(r=>{
    r.classList.remove('highlight','dimmed');
  });

  // Show panel
  showPanel(node, descIds);
}

/* ================= PANEL ================= */
function showPanel(node, descIds){
  const panel = document.getElementById('panel');
  const content = document.getElementById('panelContent');
  const area = node.area || 'key';
  const color = areaHex[area];
  const direct = node.children || [];

  const totalHTML = descIds.length > 0 ? `
    <div class="section">
      <h3>Alcance total del equipo</h3>
      <div class="total-box">
        <div class="total-number" style="color:${color}">${descIds.length}</div>
        <div class="total-label">${descIds.length===1?'persona':'personas'} en su equipo</div>
      </div>
    </div>` : '';

  const reportsHTML = direct.length ? `
    <div class="section">
      <h3>Supervisa directamente a ${direct.length}</h3>
      <div class="report-list">
        ${direct.map(r=>{
          const rHex = areaHex[r.area || area];
          return `<div class="report-item" data-id="${r.id}">
            <div class="report-avatar" style="background:linear-gradient(135deg,${rHex},${rHex}99);box-shadow:0 0 10px ${rHex}55">${initials(r.name)}</div>
            <div class="report-info">
              <div class="report-name">${r.name}</div>
              <div class="report-role">${r.role}</div>
            </div>
          </div>`;
        }).join('')}
      </div>
    </div>` : `
    <div class="section">
      <h3>Equipo</h3>
      <div class="no-reports">No tiene personas a su cargo.</div>
    </div>`;

  content.innerHTML = `
    <div class="panel-header">
      <div class="panel-avatar" style="background:linear-gradient(135deg,${color},${color}88);box-shadow:0 0 22px ${color}66">${initials(node.name)}</div>
      <div style="min-width:0;flex:1">
        <div class="panel-name">${node.name}</div>
        <div class="panel-role">${node.role}</div>
        <span class="panel-area" style="background:${color}22;color:${color}">${areaNames[area]}</span>
      </div>
    </div>
    ${node.bio ? `<div class="section"><h3>Sobre su rol</h3><div class="bio" style="border-left-color:${color}">${node.bio}</div></div>` : ''}
    ${totalHTML}
    ${reportsHTML}
  `;

  content.querySelectorAll('.report-item').forEach(el=>{
    el.addEventListener('click', ()=> selectNode(el.dataset.id));
  });

  panel.classList.add('open');
  document.getElementById('atomContainer').classList.add('with-panel');
}

function closePanel(){
  document.getElementById('panel').classList.remove('open');
  document.getElementById('atomContainer').classList.remove('with-panel');
  selectedId = null;
  document.querySelectorAll('.electron').forEach(g=> g.classList.remove('selected','descendant','dimmed'));
}

document.getElementById('panelClose').addEventListener('click', closePanel);

document.addEventListener('keydown', e=>{
  if(e.key === 'Escape') closePanel();
});

/* ================= SEARCH ================= */
document.getElementById('search').addEventListener('input', e=>{
  const q = e.target.value.toLowerCase().trim();
  if(!q){
    document.querySelectorAll('.electron').forEach(g=> g.style.opacity = '');
    return;
  }
  let found = null;
  (function walk(n){
    if(found) return;
    if(n.name.toLowerCase().includes(q) || n.role.toLowerCase().includes(q)) found = n;
    (n.children||[]).forEach(walk);
  })(org);

  if(found && electronData[found.id]){
    selectNode(found.id);
  } else if(found){
    // Found a nested node (like a member of Tecnología)
    selectNode(found.id);
  }
});

/* ================= CLICK OUTSIDE ================= */
svg.addEventListener('click', (e)=>{
  if(e.target === svg || e.target.classList.contains('orbit-ring')){
    closePanel();
  }
});
