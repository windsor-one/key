<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Organigrama · Key · Fundación Hernández</title>
<style>
:root{
  --key:#a78bfa; --key-glow:rgba(167,139,250,.35);
  --windsor:#22d3ee; --windsor-glow:rgba(34,211,238,.35);
  --heliot:#fbbf24; --heliot-glow:rgba(251,191,36,.35);
  --cosecha:#34d399; --cosecha-glow:rgba(52,211,153,.35);
  --bg:#08090f; --card:#151823; --card-2:#1a1f2e;
  --border:#232838; --text:#f1f5f9; --muted:#8892a8;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{
  font-family:'Inter',-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;
  background:
    radial-gradient(ellipse at top,#1a1f3a 0%,transparent 55%),
    radial-gradient(ellipse at bottom right,#1a1030 0%,transparent 55%),
    var(--bg);
  color:var(--text);min-height:100vh;overflow-x:hidden;
}

/* HEADER */
.topbar{
  position:sticky;top:0;z-index:50;
  padding:14px 24px;display:flex;align-items:center;gap:20px;flex-wrap:wrap;
  background:rgba(8,9,15,.85);backdrop-filter:blur(20px);
  border-bottom:1px solid var(--border);
}
.brand{display:flex;align-items:center;gap:12px;flex-shrink:0}
.brand-mark{
  width:40px;height:40px;border-radius:11px;
  background:linear-gradient(135deg,var(--key),#7c3aed);
  display:grid;place-items:center;font-weight:800;font-size:18px;color:#fff;
  box-shadow:0 0 24px var(--key-glow);
}
.brand-text h1{font-size:14.5px;font-weight:700;letter-spacing:-.2px}
.brand-text p{font-size:11px;color:var(--muted);margin-top:1px}

.search-wrap{position:relative;flex:1;max-width:340px;min-width:180px}
.search-wrap svg{position:absolute;left:12px;top:50%;transform:translateY(-50%);color:var(--muted)}
.search-wrap input{
  width:100%;padding:10px 14px 10px 38px;
  background:var(--card);border:1px solid var(--border);border-radius:10px;
  color:var(--text);font-size:13px;outline:none;transition:.2s;
}
.search-wrap input:focus{border-color:var(--key);box-shadow:0 0 0 3px var(--key-glow)}

.legend{display:flex;gap:8px;flex-wrap:wrap}
.legend-item{
  display:flex;align-items:center;gap:6px;padding:6px 10px;
  background:var(--card);border:1px solid var(--border);border-radius:8px;
  font-size:11px;font-weight:600;cursor:pointer;user-select:none;transition:.2s;
}
.legend-item:hover{border-color:var(--muted);transform:translateY(-1px)}
.legend-dot{width:8px;height:8px;border-radius:50%}
.legend-item[data-area="key"]{color:var(--key)}
.legend-item[data-area="windsor"]{color:var(--windsor)}
.legend-item[data-area="heliot"]{color:var(--heliot)}
.legend-item[data-area="cosecha"]{color:var(--cosecha)}

/* CANVAS */
.canvas{padding:36px 24px 140px;overflow-x:auto;overflow-y:visible}
.hint{
  text-align:center;font-size:11.5px;color:var(--muted);margin-bottom:28px;
  display:flex;align-items:center;justify-content:center;gap:8px;flex-wrap:wrap;
}
.hint kbd{
  background:var(--card);border:1px solid var(--border);padding:2px 8px;
  border-radius:5px;font-family:inherit;font-size:11px;color:var(--text);
}

/* ===== TREE ===== */
.tree{display:flex;justify-content:center;min-width:min-content}
.tree ul{
  display:flex;justify-content:center;padding-top:22px;position:relative;
  list-style:none;gap:0;transition:.3s;
}
.tree li{
  display:flex;flex-direction:column;align-items:center;
  position:relative;padding:22px 6px 0;list-style:none;
}
/* horizontal connectors */
.tree li::before,.tree li::after{
  content:'';position:absolute;top:0;right:50%;
  border-top:1.5px solid var(--border);width:50%;height:22px;
}
.tree li::after{right:auto;left:50%;border-left:1.5px solid var(--border)}
.tree li:only-child::after,.tree li:only-child::before{display:none}
.tree li:only-child{padding-top:0}
.tree li:first-child::before,.tree li:last-child::after{border:0 none}
.tree li:last-child::before{border-right:1.5px solid var(--border);border-radius:0 8px 0 0}
.tree li:first-child::after{border-radius:8px 0 0 0}
.tree ul ul::before{
  content:'';position:absolute;top:0;left:50%;
  border-left:1.5px solid var(--border);width:0;height:22px;
}

/* ===== NODE ===== */
.node{
  display:flex;align-items:center;gap:10px;
  padding:9px 13px;background:var(--card);
  border:1.5px solid var(--border);border-radius:12px;
  cursor:pointer;transition:all .25s cubic-bezier(.4,0,.2,1);
  position:relative;min-width:170px;max-width:210px;user-select:none;
  box-shadow:0 2px 8px rgba(0,0,0,.3);
}
.node:hover{
  transform:translateY(-2px);border-color:var(--muted);
  box-shadow:0 10px 24px rgba(0,0,0,.5);
}
.node.selected{
  border-color:var(--accent);
  box-shadow:0 0 0 3px var(--accent-glow),0 10px 32px var(--accent-glow);
  transform:translateY(-2px);
}
.node.descendant{
  border-color:var(--accent);
  background:linear-gradient(135deg,var(--card) 0%,color-mix(in srgb,var(--accent) 10%,var(--card)) 100%);
}
.node.dimmed{opacity:.22;filter:grayscale(.7)}

.node[data-area="key"]{--accent:var(--key);--accent-glow:var(--key-glow)}
.node[data-area="windsor"]{--accent:var(--windsor);--accent-glow:var(--windsor-glow)}
.node[data-area="heliot"]{--accent:var(--heliot);--accent-glow:var(--heliot-glow)}
.node[data-area="cosecha"]{--accent:var(--cosecha);--accent-glow:var(--cosecha-glow)}

.avatar{
  width:32px;height:32px;border-radius:9px;flex-shrink:0;
  display:grid;place-items:center;font-weight:700;font-size:12px;color:#fff;
  background:linear-gradient(135deg,var(--accent),color-mix(in srgb,var(--accent) 55%,#000));
  box-shadow:0 0 12px var(--accent-glow);
}
.node-info{min-width:0;flex:1}
.node-name{
  font-size:12px;font-weight:600;letter-spacing:-.1px;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
}
.node-role{
  font-size:10px;color:var(--muted);margin-top:1px;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
}
.node-count{
  position:absolute;top:-6px;right:-6px;
  background:var(--accent);color:#000;font-size:9.5px;font-weight:800;
  padding:2px 6px;border-radius:8px;min-width:18px;text-align:center;
  box-shadow:0 0 10px var(--accent-glow);
}

/* ROOT */
.node-root{padding:13px 18px;min-width:210px}
.node-root .avatar{width:42px;height:42px;font-size:16px;border-radius:11px}
.node-root .node-name{font-size:14px}
.node-root .node-role{font-size:10.5px}

/* GROUP NODE (director de área) */
.node-group{
  background:linear-gradient(135deg,var(--card-2),color-mix(in srgb,var(--accent) 6%,var(--card-2)));
}

/* ===== PANEL ===== */
.panel{
  position:fixed;top:77px;right:20px;width:340px;
  max-height:calc(100vh - 100px);
  background:rgba(15,17,23,.97);backdrop-filter:blur(24px);
  border:1px solid var(--border);border-radius:16px;
  padding:20px;overflow-y:auto;
  transform:translateX(calc(100% + 40px));
  transition:transform .35s cubic-bezier(.4,0,.2,1);
  z-index:40;box-shadow:0 20px 60px rgba(0,0,0,.7);
}
.panel.open{transform:translateX(0)}
.panel-close{
  position:absolute;top:14px;right:14px;width:26px;height:26px;
  border-radius:7px;background:var(--card);border:1px solid var(--border);
  color:var(--muted);cursor:pointer;display:grid;place-items:center;transition:.2s;
}
.panel-close:hover{color:var(--text);border-color:var(--muted);background:var(--card-2)}

.panel-header{
  display:flex;align-items:center;gap:14px;
  padding-bottom:16px;border-bottom:1px solid var(--border);margin-bottom:16px;
  padding-right:30px;
}
.panel-avatar{
  width:52px;height:52px;border-radius:13px;flex-shrink:0;
  display:grid;place-items:center;font-weight:800;font-size:19px;color:#fff;
}
.panel-name{font-size:15px;font-weight:700;letter-spacing:-.3px;line-height:1.2}
.panel-role{font-size:11.5px;color:var(--muted);margin-top:3px;line-height:1.4}
.panel-area{
  display:inline-block;padding:3px 9px;border-radius:6px;
  font-size:9.5px;font-weight:800;text-transform:uppercase;
  letter-spacing:.6px;margin-top:8px;
}

.panel-section{margin-bottom:16px}
.panel-section h3{
  font-size:10px;text-transform:uppercase;letter-spacing:.9px;
  color:var(--muted);margin-bottom:10px;font-weight:700;
}
.panel-bio{
  font-size:12px;line-height:1.6;color:#c8cfe0;
  background:var(--card);padding:12px 14px;border-radius:10px;
  border-left:2px solid var(--accent,var(--key));
}
.panel-bio[data-area="key"]{border-left-color:var(--key)}
.panel-bio[data-area="windsor"]{border-left-color:var(--windsor)}
.panel-bio[data-area="heliot"]{border-left-color:var(--heliot)}
.panel-bio[data-area="cosecha"]{border-left-color:var(--cosecha)}

.total-count{
  font-size:28px;font-weight:800;letter-spacing:-1px;line-height:1;
}
.total-label{font-size:11.5px;color:var(--muted);margin-top:4px}

.report-list{display:flex;flex-direction:column;gap:6px}
.report-item{
  display:flex;align-items:center;gap:10px;padding:9px 11px;
  background:var(--card);border:1px solid var(--border);border-radius:10px;
  cursor:pointer;transition:.2s;
}
.report-item:hover{border-color:var(--muted);transform:translateX(3px);background:var(--card-2)}
.report-avatar{
  width:28px;height:28px;border-radius:8px;flex-shrink:0;
  display:grid;place-items:center;font-weight:700;font-size:11px;color:#fff;
}
.report-info{min-width:0;flex:1}
.report-name{
  font-size:12px;font-weight:600;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
}
.report-role{
  font-size:10px;color:var(--muted);
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
}
.empty{
  text-align:center;padding:16px;color:var(--muted);
  font-size:11.5px;font-style:italic;
  background:var(--card);border-radius:10px;
}

/* RESPONSIVE */
@media (max-width:900px){
  .legend{display:none}
  .panel{
    width:calc(100vw - 20px);right:10px;top:auto;bottom:10px;
    max-height:65vh;
  }
  .search-wrap{max-width:none;order:3;width:100%}
  .topbar{padding:12px 14px;gap:12px}
}

::-webkit-scrollbar{width:8px;height:8px}
::-webkit-scrollbar-track{background:transparent}
::-webkit-scrollbar-thumb{background:var(--border);border-radius:4px}
::-webkit-scrollbar-thumb:hover{background:var(--muted)}

@keyframes pulse{0%,100%{opacity:.9}50%{opacity:.5}}
.node.descendant::after{
  content:'';position:absolute;inset:-2px;border-radius:14px;
  border:1.5px solid var(--accent);animation:pulse 2.2s ease-in-out infinite;
  pointer-events:none;
}
</style>
</head>

/* ================= STATE ================= */
let selectedId = null;

/* ================= HELPERS ================= */
const areaColors = {
  key:      {main:'var(--key)',     glow:'var(--key-glow)'},
  windsor:  {main:'var(--windsor)', glow:'var(--windsor-glow)'},
  heliot:   {main:'var(--heliot)',  glow:'var(--heliot-glow)'},
  cosecha:  {main:'var(--cosecha)', glow:'var(--cosecha-glow)'}
};
const areaNames = {
  key:'Key · Fundación', windsor:'Windsor',
  heliot:'Heliot Media', cosecha:'Cosecha'
};

function initials(name){
  return name.split(' ').filter(w=>w.length>1).slice(0,2).map(w=>w[0]).join('').toUpperCase();
}
function descendants(node){
  const ids=[];
  (function walk(n){ (n.children||[]).forEach(c=>{ids.push(c.id);walk(c)}); })(node);
  return ids;
}
function findNode(node,id){
  if(node.id===id) return node;
  if(node.children){ for(const c of node.children){const f=findNode(c,id); if(f) return f;} }
  return null;
}

/* ================= RENDER ================= */
function renderNode(node, isRoot=false, isGroup=false){
  const li = document.createElement('li');
  const el = document.createElement('div');
  el.className = 'node' + (isRoot?' node-root':'') + (isGroup?' node-group':'');
  el.dataset.id = node.id;
  el.dataset.area = node.area || 'key';

  const count = node.children ? descendants(node).length : 0;

  el.innerHTML = `
    <div class="avatar">${initials(node.name)}</div>
    <div class="node-info">
      <div class="node-name">${node.name}</div>
      <div class="node-role">${node.role}</div>
    </div>
    ${count>0?`<div class="node-count">${count}</div>`:''}
  `;
  el.addEventListener('click', e=>{ e.stopPropagation(); selectNode(node.id); });
  li.appendChild(el);

  if(node.children && node.children.length){
    const ul = document.createElement('ul');
    node.children.forEach(c=> ul.appendChild(renderNode(c, false, c.group)));
    li.appendChild(ul);
  }
  return li;
}

function renderAll(){
  const tree = document.getElementById('tree');
  tree.innerHTML = '';
  const ul = document.createElement('ul');
  ul.appendChild(renderNode(org, true));
  tree.appendChild(ul);
}

/* ================= SELECT ================= */
function selectNode(id){
  selectedId = id;
  const node = findNode(org, id);
  if(!node) return;
  const descIds = descendants(node);

  document.querySelectorAll('.node').forEach(el=>{
    const elId = el.dataset.id;
    el.classList.remove('selected','descendant','dimmed');
    if(elId===id) el.classList.add('selected');
    else if(descIds.includes(elId)) el.classList.add('descendant');
    else el.classList.add('dimmed');
  });
  showPanel(node, descIds);
}

/* ================= PANEL ================= */
function showPanel(node, descIds){
  const panel = document.getElementById('panel');
  const content = document.getElementById('panelContent');
  const area = node.area || 'key';
  const color = areaColors[area];
  const direct = node.children || [];

  const reportsHTML = direct.length
    ? `<div class="panel-section">
         <h3>Supervisa directamente a ${direct.length}</h3>
         <div class="report-list">
           ${direct.map(r=>{
             const rc = areaColors[r.area || 'key'];
             return `<div class="report-item" data-id="${r.id}">
               <div class="report-avatar" style="background:linear-gradient(135deg,${rc.main},color-mix(in srgb,${rc.main} 55%,#000));box-shadow:0 0 10px ${rc.glow}">${initials(r.name)}</div>
               <div class="report-info">
                 <div class="report-name">${r.name}</div>
                 <div class="report-role">${r.role}</div>
               </div>
             </div>`;
           }).join('')}
         </div>
       </div>`
    : `<div class="panel-section">
         <h3>Equipo</h3>
         <div class="empty">No tiene personas a su cargo.</div>
       </div>`;

  const totalHTML = descIds.length>0
    ? `<div class="panel-section">
         <h3>Alcance total del equipo</h3>
         <div class="total-count" style="color:${color.main}">${descIds.length}</div>
         <div class="total-label">${descIds.length===1?'persona en su equipo':'personas en su equipo'}</div>
       </div>`
    : '';

  content.innerHTML = `
    <div class="panel-header">
      <div class="panel-avatar" style="background:linear-gradient(135deg,${color.main},color-mix(in srgb,${color.main} 55%,#000));box-shadow:0 0 22px ${color.glow}">${initials(node.name)}</div>
      <div style="min-width:0;flex:1">
        <div class="panel-name">${node.name}</div>
        <div class="panel-role">${node.role}</div>
        <span class="panel-area" style="background:${color.glow};color:${color.main}">${areaNames[area]}</span>
      </div>
    </div>
    ${node.bio ? `<div class="panel-section"><h3>Sobre su rol</h3><div class="panel-bio" data-area="${area}">${node.bio}</div></div>` : ''}
    ${totalHTML}
    ${reportsHTML}
  `;

  content.querySelectorAll('.report-item').forEach(el=>{
    el.addEventListener('click', ()=> selectNode(el.dataset.id));
  });

  panel.classList.add('open');
}

function clearSelection(){
  selectedId = null;
  document.querySelectorAll('.node').forEach(el=> el.classList.remove('selected','descendant','dimmed'));
  document.getElementById('panel').classList.remove('open');
}

/* ================= EVENTS ================= */
document.getElementById('panelClose').addEventListener('click', clearSelection);

document.addEventListener('keydown', e=>{ if(e.key==='Escape') clearSelection(); });

document.getElementById('search').addEventListener('input', e=>{
  const q = e.target.value.toLowerCase().trim();
  if(!q){ clearSelection(); return; }
  let found = null;
  (function walk(n){
    if(found) return;
    if(n.name.toLowerCase().includes(q) || n.role.toLowerCase().includes(q)){ found = n; return; }
    (n.children||[]).forEach(walk);
  })(org);
  if(found){
    selectNode(found.id);
    setTimeout(()=>{
      const el = document.querySelector(`.node[data-id="${found.id}"]`);
      if(el) el.scrollIntoView({behavior:'smooth', block:'center', inline:'center'});
    }, 80);
  }
});

document.querySelectorAll('.legend-item').forEach(item=>{
  item.addEventListener('click', ()=>{
    const area = item.dataset.area;
    const firstInArea = document.querySelector(`.node[data-area="${area}"]:not(.node-root)`);
    if(firstInArea) selectNode(firstInArea.dataset.id);
  });
});

/* ================= INIT ================= */
renderAll();
</script>
