<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Organigrama · Key · Fundación Hernández</title>
<style>
:root{
  --key:#a78bfa; --key-glow:rgba(167,139,250,.28);
  --windsor:#22d3ee; --windsor-glow:rgba(34,211,238,.28);
  --heliot:#fbbf24; --heliot-glow:rgba(251,191,36,.28);
  --cosecha:#34d399; --cosecha-glow:rgba(52,211,153,.28);
  --bg:#08090f; --card:#151823; --card-2:#1a1f2e;
  --border:#232838; --text:#f1f5f9; --muted:#8892a8;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;overflow:hidden}
body{
  font-family:'Inter',-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;
  background:
    radial-gradient(ellipse at top,#1a1f3a 0%,transparent 55%),
    radial-gradient(ellipse at bottom right,#1a1030 0%,transparent 55%),
    var(--bg);
  color:var(--text);
}

/* ============ TOPBAR ============ */
.topbar{
  position:sticky;top:0;z-index:50;height:64px;
  padding:0 18px;display:flex;align-items:center;gap:14px;
  background:rgba(8,9,15,.9);backdrop-filter:blur(20px);
  border-bottom:1px solid var(--border);
}
.brand{display:flex;align-items:center;gap:11px;flex-shrink:0}
.brand-mark{
  width:36px;height:36px;border-radius:10px;
  background:linear-gradient(135deg,var(--key),#7c3aed);
  display:grid;place-items:center;font-weight:800;font-size:16px;color:#fff;
  box-shadow:0 0 20px var(--key-glow);
}
.brand-text h1{font-size:13.5px;font-weight:700;letter-spacing:-.2px}
.brand-text p{font-size:10.5px;color:var(--muted);margin-top:1px}

.search-wrap{position:relative;flex:1;max-width:300px;min-width:150px}
.search-wrap svg{position:absolute;left:11px;top:50%;transform:translateY(-50%);color:var(--muted)}
.search-wrap input{
  width:100%;padding:9px 12px 9px 34px;
  background:var(--card);border:1px solid var(--border);border-radius:9px;
  color:var(--text);font-size:12.5px;outline:none;transition:.2s;
}
.search-wrap input:focus{border-color:var(--key);box-shadow:0 0 0 3px var(--key-glow)}

.actions{display:flex;gap:6px;margin-left:auto}
.btn-icon{
  padding:8px 12px;background:var(--card);border:1px solid var(--border);
  border-radius:8px;color:var(--muted);font-size:11.5px;font-weight:600;
  cursor:pointer;transition:.2s;white-space:nowrap;
}
.btn-icon:hover{color:var(--text);border-color:var(--muted);background:var(--card-2)}

.legend{display:flex;gap:6px}
.legend-item{
  display:flex;align-items:center;gap:5px;padding:6px 9px;
  background:var(--card);border:1px solid var(--border);border-radius:7px;
  font-size:10.5px;font-weight:600;cursor:pointer;user-select:none;transition:.2s;
}
.legend-item:hover{border-color:var(--muted);transform:translateY(-1px)}
.legend-dot{width:7px;height:7px;border-radius:50%}

/* ============ LAYOUT ============ */
.layout{
  display:grid;grid-template-columns:1fr 380px;
  height:calc(100vh - 64px);
}

/* ============ TREE PANEL ============ */
.tree-panel{
  overflow-y:auto;overflow-x:hidden;
  padding:14px 12px 60px 12px;
  border-right:1px solid var(--border);
}

/* Breadcrumb */
.breadcrumb{
  position:sticky;top:0;z-index:10;
  display:flex;align-items:center;gap:6px;flex-wrap:wrap;
  padding:10px 12px;margin:-14px -12px 12px -12px;
  background:rgba(8,9,15,.92);backdrop-filter:blur(14px);
  border-bottom:1px solid var(--border);
  font-size:11.5px;color:var(--muted);
  min-height:44px;
}
.breadcrumb-empty{font-style:italic;opacity:.6}
.crumb{
  color:var(--muted);cursor:pointer;padding:3px 8px;border-radius:6px;
  transition:.2s;white-space:nowrap;
}
.crumb:hover{color:var(--text);background:var(--card)}
.crumb.current{color:var(--text);font-weight:600;background:var(--card);cursor:default}
.crumb-sep{opacity:.4;font-size:10px}

/* Node rows */
.tree-list{display:flex;flex-direction:column;gap:1px}
.node-wrap{position:relative}
.node-row{
  display:flex;align-items:center;gap:10px;
  padding:9px 12px 9px calc(12px + var(--depth) * 22px);
  border-radius:9px;cursor:pointer;transition:.18s;
  position:relative;border:1px solid transparent;
  min-height:46px;
}
.node-row:hover{background:var(--card);border-color:var(--border)}
.node-row.selected{
  background:linear-gradient(90deg,color-mix(in srgb,var(--accent) 16%,var(--card)) 0%,var(--card) 100%);
  border-color:var(--accent);
  box-shadow:inset 3px 0 0 var(--accent), 0 0 20px var(--accent-glow);
}
.node-row.descendant{
  background:color-mix(in srgb,var(--accent) 8%,transparent);
  border-color:color-mix(in srgb,var(--accent) 35%,var(--border));
  box-shadow:inset 3px 0 0 color-mix(in srgb,var(--accent) 60%,transparent);
}
.node-row.dimmed{opacity:.35}

/* Vertical guide lines */
.node-row::before{
  content:'';position:absolute;left:calc(12px + var(--depth) * 22px - 12px);
  top:0;bottom:0;width:1px;background:var(--border);opacity:.5;
}
.node-row[style*="--depth:0"]::before{display:none}

.toggle{
  width:20px;height:20px;flex-shrink:0;display:grid;place-items:center;
  font-size:10px;color:var(--muted);transition:transform .25s,color .2s;
  cursor:pointer;border-radius:5px;
}
.toggle:hover{color:var(--text);background:var(--card-2)}
.toggle.expanded{transform:rotate(90deg);color:var(--accent)}
.toggle.empty{visibility:hidden}

.avatar{
  width:32px;height:32px;border-radius:9px;flex-shrink:0;
  display:grid;place-items:center;font-weight:700;font-size:11px;color:#fff;
  background:linear-gradient(135deg,var(--accent),color-mix(in srgb,var(--accent) 55%,#000));
  box-shadow:0 0 10px var(--accent-glow);
}
.node-info{min-width:0;flex:1}
.node-name{
  font-size:12.5px;font-weight:600;letter-spacing:-.1px;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
}
.node-role{
  font-size:10.5px;color:var(--muted);margin-top:2px;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
}
.node-count{
  font-size:9.5px;font-weight:800;padding:3px 8px;border-radius:20px;
  background:color-mix(in srgb,var(--accent) 18%,transparent);
  color:var(--accent);flex-shrink:0;
  border:1px solid color-mix(in srgb,var(--accent) 30%,transparent);
}

.node-row[data-area="key"]{--accent:var(--key);--accent-glow:var(--key-glow)}
.node-row[data-area="windsor"]{--accent:var(--windsor);--accent-glow:var(--windsor-glow)}
.node-row[data-area="heliot"]{--accent:var(--heliot);--accent-glow:var(--heliot-glow)}
.node-row[data-area="cosecha"]{--accent:var(--cosecha);--accent-glow:var(--cosecha-glow)}

.children-container{
  overflow:hidden;
  max-height:0;
  transition:max-height .35s cubic-bezier(.4,0,.2,1);
}
.children-container.open{
  max-height:8000px;
}

/* ============ DETAIL PANEL ============ */
.detail-panel{
  overflow-y:auto;padding:22px;
  background:linear-gradient(180deg,rgba(15,17,23,.6) 0%,rgba(8,9,15,.6) 100%);
  border-left:1px solid var(--border);
}

.empty-state{
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  height:100%;text-align:center;gap:14px;padding:30px;
}
.empty-state svg{opacity:.25}
.empty-state h3{font-size:14px;font-weight:600;color:var(--muted)}
.empty-state p{font-size:12px;color:var(--muted);opacity:.7;line-height:1.6;max-width:260px}

.detail-header{
  display:flex;align-items:center;gap:14px;
  padding-bottom:16px;border-bottom:1px solid var(--border);margin-bottom:18px;
}
.detail-avatar{
  width:56px;height:56px;border-radius:14px;flex-shrink:0;
  display:grid;place-items:center;font-weight:800;font-size:20px;color:#fff;
}
.detail-name{font-size:16px;font-weight:700;letter-spacing:-.3px;line-height:1.2}
.detail-role{font-size:12px;color:var(--muted);margin-top:4px;line-height:1.4}
.detail-area{
  display:inline-block;padding:4px 10px;border-radius:6px;
  font-size:9.5px;font-weight:800;text-transform:uppercase;
  letter-spacing:.6px;margin-top:9px;
}

.section{margin-bottom:18px}
.section h3{
  font-size:10px;text-transform:uppercase;letter-spacing:.9px;
  color:var(--muted);margin-bottom:10px;font-weight:700;
}
.bio{
  font-size:12.5px;line-height:1.65;color:#c8cfe0;
  background:var(--card);padding:13px 15px;border-radius:10px;
  border-left:3px solid var(--accent);
}

.total-box{
  background:var(--card);border-radius:12px;padding:16px;
  border:1px solid var(--border);text-align:center;
  background:linear-gradient(135deg,var(--card) 0%,color-mix(in srgb,var(--accent) 6%,var(--card)) 100%);
}
.total-number{
  font-size:36px;font-weight:800;letter-spacing:-1.5px;line-height:1;
  color:var(--accent);
}
.total-label{font-size:11.5px;color:var(--muted);margin-top:6px}

.report-list{display:flex;flex-direction:column;gap:6px}
.report-item{
  display:flex;align-items:center;gap:11px;padding:10px 12px;
  background:var(--card);border:1px solid var(--border);border-radius:10px;
  cursor:pointer;transition:.2s;
}
.report-item:hover{
  border-color:var(--muted);transform:translateX(3px);
  background:var(--card-2);
}
.report-avatar{
  width:32px;height:32px;border-radius:9px;flex-shrink:0;
  display:grid;place-items:center;font-weight:700;font-size:11px;color:#fff;
}
.report-info{min-width:0;flex:1}
.report-name{
  font-size:12.5px;font-weight:600;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
}
.report-role{
  font-size:10.5px;color:var(--muted);margin-top:2px;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
}
.no-reports{
  text-align:center;padding:16px;color:var(--muted);
  font-size:11.5px;font-style:italic;
  background:var(--card);border-radius:10px;
}

/* ============ RESPONSIVE ============ */
@media (max-width:900px){
  .layout{grid-template-columns:1fr;grid-template-rows:1fr auto}
  .detail-panel{
    position:fixed;left:0;right:0;bottom:0;top:auto;
    max-height:65vh;border-left:none;border-top:1px solid var(--border);
    border-radius:20px 20px 0 0;
    transform:translateY(100%);
    transition:transform .35s cubic-bezier(.4,0,.2,1);
    z-index:60;
    box-shadow:0 -20px 50px rgba(0,0,0,.7);
  }
  .detail-panel.open{transform:translateY(0)}
  .legend{display:none}
  .brand-text p{display:none}
  .actions .btn-icon{padding:7px 10px;font-size:11px}
  .tree-panel{padding-bottom:20px}
}

::-webkit-scrollbar{width:8px;height:8px}
::-webkit-scrollbar-track{background:transparent}
::-webkit-scrollbar-thumb{background:var(--border);border-radius:4px}
::-webkit-scrollbar-thumb:hover{background:var(--muted)}
</style>

/* ================= STATE ================= */
let selectedId = null;
const expanded = new Set(['key']); // IDs de nodos expandidos

/* ================= HELPERS ================= */
const areaColors = {
  key:      {main:'var(--key)',     glow:'var(--key-glow)'},
  windsor:  {main:'var(--windsor)', glow:'var(--windsor-glow)'},
  heliot:   {main:'var(--heliot)',  glow:'var(--heliot-glow)'},
  cosecha:  {main:'var(--cosecha)', glow:'var(--cosecha-glow)'}
};
const areaNames = {
  key:'Key · Fundación', windsor:'Windsor',
  heliot:'Heliot Media', cosecha:'Cosecha'
};
const areaHex = {
  key:'#a78bfa', windsor:'#22d3ee', heliot:'#fbbf24', cosecha:'#34d399'
};

function initials(name){
  return name.split(' ').filter(w=>w.length>1).slice(0,2).map(w=>w[0]).join('').toUpperCase();
}
function descendants(node){
  const ids=[];
  (function walk(n){ (n.children||[]).forEach(c=>{ids.push(c.id);walk(c)}); })(node);
  return ids;
}
function findNode(node,id){
  if(node.id===id) return node;
  if(node.children){ for(const c of node.children){const f=findNode(c,id); if(f) return f;} }
  return null;
}
function findPath(node,id,path=[]){
  const newPath = [...path, node];
  if(node.id===id) return newPath;
  if(node.children){
    for(const c of node.children){
      const r = findPath(c,id,newPath);
      if(r) return r;
    }
  }
  return null;
}

/* ================= RENDER ================= */
function renderNode(node, depth){
  const wrap = document.createElement('div');
  wrap.className = 'node-wrap';

  const hasChildren = node.children && node.children.length > 0;
  const isExpanded = expanded.has(node.id);

  const row = document.createElement('div');
  row.className = 'node-row';
  row.dataset.id = node.id;
  row.dataset.area = node.area || 'key';
  row.style.setProperty('--depth', depth);

  const count = hasChildren ? descendants(node).length : 0;

  row.innerHTML = `
    <span class="toggle ${isExpanded?'expanded':''} ${hasChildren?'':'empty'}">▶</span>
    <div class="avatar">${initials(node.name)}</div>
    <div class="node-info">
      <div class="node-name">${node.name}</div>
      <div class="node-role">${node.role}</div>
    </div>
    ${count>0?`<span class="node-count">${count}</span>`:''}
  `;

  // Click en la flecha → expand/collapse
  row.querySelector('.toggle').addEventListener('click', e=>{
    e.stopPropagation();
    if(!hasChildren) return;
    if(expanded.has(node.id)) expanded.delete(node.id);
    else expanded.add(node.id);
    render();
  });

  // Click en la fila → seleccionar
  row.addEventListener('click', ()=> selectNode(node.id));

  wrap.appendChild(row);

  // Hijos
  if(hasChildren){
    const container = document.createElement('div');
    container.className = 'children-container' + (isExpanded?' open':'');
    container.dataset.parent = node.id;
    node.children.forEach(c => container.appendChild(renderNode(c, depth+1)));
    wrap.appendChild(container);
  }

  return wrap;
}

function render(){
  const tree = document.getElementById('tree');
  tree.innerHTML = '';
  tree.appendChild(renderNode(org, 0));
  applySelectionStyles();
}

/* ================= SELECT ================= */
function selectNode(id){
  selectedId = id;
  const node = findNode(org, id);
  if(!node) return;

  // Auto-expandir ancestros
  const path = findPath(org, id);
  if(path){
    path.slice(0, -1).forEach(p => expanded.add(p.id));
    // Expandir el propio nodo si tiene hijos (para ver a quién supervisa)
    if(node.children && node.children.length) expanded.add(node.id);
  }

  render();
  renderBreadcrumb(path);
  renderDetail(node);
  scrollToSelected();
}

function applySelectionStyles(){
  if(!selectedId) return;
  const node = findNode(org, selectedId);
  if(!node) return;
  const descIds = descendants(node);

  document.querySelectorAll('.node-row').forEach(el=>{
    const elId = el.dataset.id;
    el.classList.remove('selected','descendant','dimmed');
    if(elId === selectedId) el.classList.add('selected');
    else if(descIds.includes(elId)) el.classList.add('descendant');
    else el.classList.add('dimmed');
  });
}

function scrollToSelected(){
  setTimeout(()=>{
    const el = document.querySelector(`.node-row[data-id="${selectedId}"]`);
    if(el) el.scrollIntoView({behavior:'smooth', block:'center'});
  }, 100);
}

/* ================= BREADCRUMB ================= */
function renderBreadcrumb(path){
  const bc = document.getElementById('breadcrumb');
  if(!path || path.length===0){
    bc.innerHTML = '<span class="breadcrumb-empty">Toca una persona para ver su ficha y a quién supervisa</span>';
    return;
  }
  bc.innerHTML = path.map((n,i)=>{
    const isLast = i === path.length-1;
    return `<span class="crumb ${isLast?'current':''}" data-id="${n.id}">${n.name}</span>${isLast?'':'<span class="crumb-sep">›</span>'}`;
  }).join('');
  bc.querySelectorAll('.crumb').forEach(el=>{
    el.addEventListener('click', ()=>{
      if(el.classList.contains('current')) return;
      selectNode(el.dataset.id);
    });
  });
}

/* ================= DETAIL PANEL ================= */
function renderDetail(node){
  const panel = document.getElementById('detail');
  const area = node.area || 'key';
  const color = areaColors[area];
  const hex = areaHex[area];
  const direct = node.children || [];
  const descIds = descendants(node);

  const totalHTML = descIds.length>0 ? `
    <div class="section">
      <h3>Alcance total del equipo</h3>
      <div class="total-box">
        <div class="total-number">${descIds.length}</div>
        <div class="total-label">${descIds.length===1?'persona en su equipo':'personas en su equipo'}</div>
      </div>
    </div>` : '';

  const reportsHTML = direct.length ? `
    <div class="section">
      <h3>Supervisa directamente a ${direct.length}</h3>
      <div class="report-list">
        ${direct.map(r=>{
          const rHex = areaHex[r.area || 'key'];
          return `<div class="report-item" data-id="${r.id}">
            <div class="report-avatar" style="background:linear-gradient(135deg,${rHex},${rHex}99);box-shadow:0 0 10px ${rHex}44">${initials(r.name)}</div>
            <div class="report-info">
              <div class="report-name">${r.name}</div>
              <div class="report-role">${r.role}</div>
            </div>
          </div>`;
        }).join('')}
      </div>
    </div>` : `
    <div class="section">
      <h3>Equipo</h3>
      <div class="no-reports">No tiene personas a su cargo.</div>
    </div>`;

  panel.innerHTML = `
    <div class="detail-header">
      <div class="detail-avatar" style="background:linear-gradient(135deg,${hex},${hex}88);box-shadow:0 0 22px ${hex}66">${initials(node.name)}</div>
      <div style="min-width:0;flex:1">
        <div class="detail-name">${node.name}</div>
        <div class="detail-role">${node.role}</div>
        <span class="detail-area" style="background:${hex}22;color:${hex}">${areaNames[area]}</span>
      </div>
    </div>
    ${node.bio ? `<div class="section"><h3>Sobre su rol</h3><div class="bio" style="border-left-color:${hex}">${node.bio}</div></div>` : ''}
    ${totalHTML}
    ${reportsHTML}
  `;

  panel.querySelectorAll('.report-item').forEach(el=>{
    el.addEventListener('click', ()=> selectNode(el.dataset.id));
  });

  // En móvil, abrir como hoja inferior
  if(window.innerWidth <= 900) panel.classList.add('open');
}

/* ================= EVENTS ================= */
document.getElementById('search').addEventListener('input', e=>{
  const q = e.target.value.toLowerCase().trim();
  if(!q){ return; }
  let found = null;
  (function walk(n){
    if(found) return;
    if(n.name.toLowerCase().includes(q) || n.role.toLowerCase().includes(q)){ found = n; return; }
    (n.children||[]).forEach(walk);
  })(org);
  if(found) selectNode(found.id);
});

document.getElementById('expandAll').addEventListener('click', ()=>{
  (function walk(n){
    if(n.children && n.children.length) expanded.add(n.id);
    (n.children||[]).forEach(walk);
  })(org);
  render();
});

document.getElementById('collapseAll').addEventListener('click', ()=>{
  expanded.clear();
  expanded.add('key'); // dejar la raíz abierta
  selectedId = null;
  render();
  renderBreadcrumb(null);
  document.getElementById('detail').innerHTML = `
    <div class="empty-state">
      <svg width="52" height="52" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
        <circle cx="12" cy="8" r="4"/><path d="M4 21v-2a4 4 0 0 1 4-4h8a4 4 0 0 1 4 4v2"/>
      </svg>
      <h3>Nadie seleccionado</h3>
      <p>Toca cualquier nombre en el árbol para ver su ficha, su rol y las personas que supervisa.</p>
    </div>`;
});

document.querySelectorAll('.legend-item').forEach(item=>{
  item.addEventListener('click', ()=>{
    const area = item.dataset.area;
    const firstInArea = document.querySelector(`.node-row[data-area="${area}"]:not([data-id="key"])`);
    if(firstInArea) selectNode(firstInArea.dataset.id);
  });
});

document.addEventListener('keydown', e=>{
  if(e.key==='Escape'){
    selectedId = null;
    document.querySelectorAll('.node-row').forEach(el=> el.classList.remove('selected','descendant','dimmed'));
    document.getElementById('detail').classList.remove('open');
    renderBreadcrumb(null);
  }
});

// Cerrar hoja móvil al hacer click fuera
document.addEventListener('click', e=>{
  if(window.innerWidth > 900) return;
  const panel = document.getElementById('detail');
  if(!panel.classList.contains('open')) return;
  if(panel.contains(e.target)) return;
  if(e.target.closest('.node-row')) return;
  panel.classList.remove('open');
});

/* ================= INIT ================= */
render();
</script>
