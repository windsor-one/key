<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>SHIPGRINDR 🔥 · Match Edition</title>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;700;800;900&family=Bebas+Neue&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#08000a;
  --card:#12001a;
  --card-2:#1c0327;
  --border:#2a0840;
  --text:#fff0ff;
  --muted:#9a6fb0;
  --hot:#ff0066;
  --neon:#b026ff;
  --fire:#ff2e88;
  --acid:#00ffd5;
  --gold:#ffb300;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{
  height:100%;overflow:hidden;
  font-family:'Space Grotesk',-apple-system,BlinkMacSystemFont,sans-serif;
  background:var(--bg);color:var(--text);-webkit-tap-highlight-color:transparent;
  letter-spacing:-.2px;
}

/* ============ BACKGROUND ============ */
body::before{
  content:'';position:fixed;inset:0;pointer-events:none;z-index:0;
  background:
    radial-gradient(ellipse at 15% 10%, rgba(255,0,102,.35) 0%, transparent 50%),
    radial-gradient(ellipse at 85% 90%, rgba(176,38,255,.3) 0%, transparent 50%),
    radial-gradient(ellipse at 50% 50%, rgba(255,46,136,.08) 0%, transparent 70%);
}
body::after{
  content:'';position:fixed;inset:0;pointer-events:none;z-index:0;opacity:.5;
  background-image:
    linear-gradient(rgba(255,0,102,.04) 1px, transparent 1px),
    linear-gradient(90deg, rgba(176,38,255,.04) 1px, transparent 1px);
  background-size: 40px 40px;
  mask-image: radial-gradient(ellipse at center, #000 30%, transparent 80%);
  -webkit-mask-image: radial-gradient(ellipse at center, #000 30%, transparent 80%);
}

/* Floating words */
.floaty{
  position:fixed;pointer-events:none;z-index:1;
  font-family:'Bebas Neue',sans-serif;letter-spacing:3px;
  color:var(--hot);opacity:.08;
  animation:floatUp linear infinite;
  text-shadow: 0 0 30px var(--hot);
}
@keyframes floatUp{
  0%{transform:translateY(100vh) rotate(-8deg);opacity:0}
  10%{opacity:.12}
  90%{opacity:.06}
  100%{transform:translateY(-10vh) rotate(8deg);opacity:0}
}

/* ============ TOPBAR ============ */
.topbar{
  position:fixed;top:0;left:0;right:0;z-index:50;height:66px;
  padding:0 18px;display:flex;align-items:center;gap:14px;
  background:rgba(8,0,10,.88);backdrop-filter:blur(24px);
  border-bottom:1px solid var(--border);
  box-shadow: 0 4px 30px rgba(255,0,102,.15);
}
.brand{display:flex;align-items:center;gap:12px;cursor:pointer}
.brand-mark{
  width:44px;height:44px;border-radius:14px;
  background:linear-gradient(135deg,var(--hot),var(--neon));
  display:grid;place-items:center;
  font-family:'Bebas Neue',sans-serif;font-size:26px;color:#fff;
  letter-spacing:-1px;
  box-shadow:
    0 0 24px rgba(255,0,102,.7),
    0 0 60px rgba(176,38,255,.35),
    inset 0 0 20px rgba(255,255,255,.2);
  animation:pulseGlow 2.4s ease-in-out infinite;
  position:relative;
}
.brand-mark::after{
  content:'';position:absolute;inset:0;border-radius:14px;
  border:1.5px solid rgba(255,255,255,.3);
}
@keyframes pulseGlow{
  0%,100%{transform:scale(1);filter:brightness(1)}
  50%{transform:scale(1.06);filter:brightness(1.25)}
}
.brand-text h1{
  font-family:'Bebas Neue',sans-serif;
  font-size:22px;font-weight:400;letter-spacing:1.5px;
  background:linear-gradient(135deg,#fff 0%,var(--hot) 50%,var(--neon) 100%);
  -webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;
  line-height:1;
}
.brand-text p{
  font-size:9.5px;color:var(--muted);
  margin-top:3px;font-weight:700;letter-spacing:1.5px;text-transform:uppercase;
}

.my-user{
  margin-left:auto;display:flex;align-items:center;gap:10px;
  padding:5px 14px 5px 5px;background:var(--card);
  border:1.5px solid var(--border);border-radius:30px;
  cursor:pointer;transition:.25s;
}
.my-user:hover{border-color:var(--hot);box-shadow:0 0 20px rgba(255,0,102,.4)}
.my-user-avatar{
  width:34px;height:34px;border-radius:50%;
  display:grid;place-items:center;font-weight:800;font-size:12px;color:#fff;
  background:linear-gradient(135deg,var(--hot),var(--neon));
  box-shadow:0 0 14px rgba(255,0,102,.6);
}
.my-user-name{font-size:12px;font-weight:800;max-width:110px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;letter-spacing:-.3px}

/* ============ SELECTOR ============ */
.selector{
  position:fixed;inset:66px 0 0 0;z-index:20;
  display:flex;flex-direction:column;
  background:var(--bg);overflow-y:auto;
  padding:30px 20px 60px;
  transition:transform .55s cubic-bezier(.7,0,.2,1);
}
.selector.hidden{transform:translateY(-102%);pointer-events:none}
.selector-header{text-align:center;margin-bottom:26px}
.selector-header h2{
  font-family:'Bebas Neue',sans-serif;
  font-size:52px;line-height:.9;letter-spacing:2px;
  background:linear-gradient(180deg,#fff 0%,var(--hot) 60%,var(--neon) 100%);
  -webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;
  text-shadow:0 0 40px rgba(255,0,102,.3);
  margin-bottom:10px;
}
.selector-header p{
  font-size:12px;color:var(--muted);font-weight:600;letter-spacing:.5px;
  text-transform:uppercase;
}
.selector-header p::before{content:'✦ ';color:var(--hot)}
.selector-header p::after{content:' ✦';color:var(--hot)}

.selector-search{position:relative;max-width:520px;margin:0 auto 22px;width:100%}
.selector-search svg{position:absolute;left:16px;top:50%;transform:translateY(-50%);color:var(--hot)}
.selector-search input{
  width:100%;padding:15px 18px 15px 46px;
  background:var(--card);border:1.5px solid var(--border);border-radius:14px;
  color:var(--text);font-size:14px;outline:none;font-family:inherit;
  transition:.25s;font-weight:600;
}
.selector-search input:focus{
  border-color:var(--hot);
  box-shadow:0 0 0 3px rgba(255,0,102,.2), 0 0 30px rgba(255,0,102,.2);
}
.selector-search input::placeholder{color:var(--muted);letter-spacing:.3px}

.people-grid{
  max-width:960px;margin:0 auto;width:100%;
  display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));
  gap:10px;
}
.person-tile{
  padding:14px 10px;background:var(--card);
  border:1.5px solid var(--border);border-radius:16px;
  cursor:pointer;text-align:center;transition:.25s;
  position:relative;overflow:hidden;
}
.person-tile::before{
  content:'';position:absolute;inset:0;
  background:linear-gradient(135deg,rgba(255,0,102,.15),rgba(176,38,255,.1));
  opacity:0;transition:opacity .25s;
}
.person-tile:hover{
  transform:translateY(-4px) scale(1.02);
  border-color:var(--hot);
  box-shadow:0 12px 30px rgba(255,0,102,.3), 0 0 20px rgba(176,38,255,.2);
}
.person-tile:hover::before{opacity:1}
.person-tile .pt-avatar{
  width:56px;height:56px;border-radius:50%;margin:0 auto 10px;
  display:grid;place-items:center;font-family:'Bebas Neue',sans-serif;
  font-size:22px;color:#fff;letter-spacing:-1px;
  border:2px solid rgba(255,255,255,.15);
  position:relative;z-index:1;
}
.person-tile .pt-name{
  font-size:11.5px;font-weight:800;line-height:1.2;margin-bottom:3px;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
  position:relative;z-index:1;
}
.person-tile .pt-meta{
  font-size:9.5px;color:var(--muted);font-weight:700;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
  text-transform:uppercase;letter-spacing:.5px;
  position:relative;z-index:1;
}

/* ============ STAGE ============ */
.stage{
  position:fixed;inset:66px 0 0 0;z-index:10;
  display:flex;align-items:center;justify-content:center;
  padding:14px 14px 130px;
  opacity:0;pointer-events:none;transition:opacity .45s;
}
.stage.active{opacity:1;pointer-events:auto}

.deck{position:relative;width:100%;max-width:420px;height:100%;max-height:680px}

.card{
  position:absolute;inset:0;
  background:linear-gradient(170deg,#1a0028 0%,#0a0010 100%);
  border:1.5px solid rgba(255,0,102,.35);border-radius:28px;
  overflow:hidden;display:flex;flex-direction:column;
  box-shadow:
    0 30px 80px rgba(0,0,0,.9),
    0 0 60px rgba(255,0,102,.25),
    inset 0 0 40px rgba(176,38,255,.08);
  cursor:grab;
  transition:transform .5s cubic-bezier(.4,0,.2,1),opacity .4s;
  will-change:transform;
}
.card::before{
  content:'';position:absolute;inset:0;border-radius:28px;
  padding:1.5px;
  background:linear-gradient(135deg,var(--hot),var(--neon),var(--acid));
  -webkit-mask:linear-gradient(#000 0 0) content-box,linear-gradient(#000 0 0);
  -webkit-mask-composite:xor;
  mask-composite:exclude;
  opacity:.5;pointer-events:none;
  animation:borderShift 6s linear infinite;
}
@keyframes borderShift{
  0%,100%{opacity:.4}
  50%{opacity:.85}
}
.card.dragging{cursor:grabbing;transition:none}
.card.exit-left{transform:translateX(-160%) rotate(-28deg) !important;opacity:0}
.card.exit-right{transform:translateX(160%) rotate(28deg) !important;opacity:0}

/* ============ CARD COVER ============ */
.card-cover{
  position:relative;height:44%;min-height:250px;
  background:linear-gradient(160deg,var(--accent,#ff0066),color-mix(in srgb,var(--accent) 30%,#000));
  display:grid;place-items:center;overflow:hidden;
}
.card-cover::before{
  content:'';position:absolute;inset:0;
  background:
    radial-gradient(circle at 30% 20%, rgba(255,255,255,.35), transparent 50%),
    radial-gradient(circle at 75% 80%, rgba(0,0,0,.5), transparent 55%),
    repeating-linear-gradient(45deg, transparent 0, transparent 12px, rgba(255,255,255,.03) 12px, rgba(255,255,255,.03) 24px);
}
/* Huge number watermark */
.card-cover::after{
  content:attr(data-pct);
  position:absolute;
  right:-20px;bottom:-60px;
  font-family:'Bebas Neue',sans-serif;font-size:220px;line-height:.75;
  color:rgba(255,255,255,.06);
  letter-spacing:-10px;
  pointer-events:none;
}

.card-avatar{
  position:relative;z-index:2;
  width:150px;height:150px;border-radius:50%;
  background:rgba(8,0,10,.9);backdrop-filter:blur(20px);
  display:grid;place-items:center;
  font-family:'Bebas Neue',sans-serif;
  font-size:64px;line-height:1;color:#fff;letter-spacing:-2px;
  border:4px solid rgba(255,255,255,.9);
  box-shadow:
    0 0 0 8px rgba(255,0,102,.3),
    0 20px 50px rgba(0,0,0,.6),
    0 0 60px var(--accent,#ff0066);
  text-shadow:0 0 20px rgba(255,255,255,.5);
}
.card-cover .card-online{
  position:absolute;top:16px;left:16px;z-index:3;
  padding:7px 13px;border-radius:20px;
  background:rgba(8,0,10,.9);backdrop-filter:blur(12px);
  font-size:10px;font-weight:900;letter-spacing:1.2px;
  text-transform:uppercase;color:var(--acid);
  display:flex;align-items:center;gap:6px;
  border:1px solid rgba(0,255,213,.4);
}
.online-dot{
  width:7px;height:7px;border-radius:50%;
  background:var(--acid);
  box-shadow:0 0 10px var(--acid);
  animation:pulse 1.6s ease-in-out infinite;
}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.3}}
.card-cover .card-match-badge{
  position:absolute;top:16px;right:16px;z-index:3;
  padding:9px 15px;border-radius:20px;
  background:rgba(8,0,10,.92);backdrop-filter:blur(12px);
  border:1.5px solid var(--hot);
  font-family:'Bebas Neue',sans-serif;
  font-size:22px;letter-spacing:.5px;
  color:var(--hot);
  display:flex;align-items:baseline;gap:3px;
  box-shadow:0 0 24px rgba(255,0,102,.6);
  text-shadow:0 0 12px rgba(255,0,102,.8);
}
.card-match-badge small{font-size:12px;opacity:.7}

/* ============ CARD BODY ============ */
.card-body{
  padding:20px 22px;flex:1;display:flex;flex-direction:column;overflow-y:auto;
}
.card-name{
  font-family:'Bebas Neue',sans-serif;
  font-size:34px;font-weight:400;letter-spacing:1.5px;line-height:.95;
  color:#fff;
  text-shadow:0 0 30px rgba(255,0,102,.4);
  margin-bottom:6px;
}
.card-meta{
  display:flex;flex-wrap:wrap;gap:8px;margin-bottom:10px;
}
.meta-chip{
  font-size:10.5px;font-weight:800;
  padding:4px 10px;border-radius:14px;
  background:rgba(255,0,102,.12);
  border:1px solid rgba(255,0,102,.3);
  color:#ff8fc0;letter-spacing:.4px;
  text-transform:uppercase;
}
.meta-chip.loc{
  background:rgba(176,38,255,.12);
  border-color:rgba(176,38,255,.3);
  color:#d8a6ff;
}
.card-role{
  font-size:11px;color:var(--hot);font-weight:800;
  text-transform:uppercase;letter-spacing:1.2px;
  margin-bottom:10px;
}
.card-bio{
  font-size:12.5px;color:#d0b8e0;line-height:1.55;
  font-style:italic;
  padding:10px 12px;border-radius:10px;
  background:rgba(255,255,255,.03);
  border-left:2px solid var(--hot);
}

.match-section{margin-top:14px}
.match-label{
  font-size:9.5px;font-weight:900;
  text-transform:uppercase;letter-spacing:1.5px;
  color:var(--muted);margin-bottom:7px;
  display:flex;justify-content:space-between;align-items:center;
}
.match-label span{color:var(--hot)}
.match-bar{
  height:8px;border-radius:6px;
  background:rgba(255,255,255,.05);overflow:hidden;
  border:1px solid rgba(255,255,255,.05);
}
.match-fill{
  height:100%;border-radius:6px;
  background:linear-gradient(90deg,var(--hot),var(--neon),var(--acid));
  background-size:200% 100%;
  box-shadow:0 0 14px var(--hot);
  transition:width .6s;
  animation:shimmer 3s linear infinite;
}
@keyframes shimmer{0%{background-position:0% 0}100%{background-position:200% 0}}

.chips{
  display:flex;flex-wrap:wrap;gap:5px;margin-top:14px;
}
.chip{
  font-size:10px;padding:5px 11px;border-radius:20px;
  background:rgba(255,255,255,.05);
  border:1px solid rgba(255,255,255,.1);
  color:#c8b0d8;font-weight:700;letter-spacing:.2px;
}
.chip.common{
  background:linear-gradient(135deg,rgba(255,0,102,.25),rgba(176,38,255,.25));
  border-color:var(--hot);color:#fff;
  box-shadow:0 0 14px rgba(255,0,102,.5);
  font-weight:800;
}

.drag-label{
  position:absolute;top:52px;z-index:10;
  padding:10px 18px;border-radius:14px;
  font-family:'Bebas Neue',sans-serif;
  font-size:32px;letter-spacing:3px;
  opacity:0;transition:opacity .15s;pointer-events:none;
  border:3px solid;
}
.drag-label.like{
  left:24px;color:var(--hot);border-color:var(--hot);
  background:rgba(255,0,102,.2);
  transform:rotate(-14deg);
  text-shadow:0 0 16px var(--hot);
  box-shadow:0 0 30px rgba(255,0,102,.5);
}
.drag-label.nope{
  right:24px;color:#666;border-color:#666;
  background:rgba(255,255,255,.08);
  transform:rotate(14deg);
}

/* ============ CONTROLS ============ */
.controls{
  position:fixed;bottom:22px;left:0;right:0;z-index:30;
  display:flex;justify-content:center;gap:24px;
}
.ctrl{
  width:74px;height:74px;border-radius:50%;
  display:grid;place-items:center;cursor:pointer;
  background:rgba(8,0,10,.9);backdrop-filter:blur(24px);
  transition:.3s cubic-bezier(.34,1.56,.64,1);
  font-size:32px;border:2.5px solid;
  position:relative;
}
.ctrl::before{
  content:'';position:absolute;inset:-6px;border-radius:50%;
  border:1.5px dashed currentColor;opacity:.3;
  animation:spin 20s linear infinite;
}
@keyframes spin{to{transform:rotate(360deg)}}
.ctrl:hover{transform:scale(1.14) rotate(-4deg)}
.ctrl:active{transform:scale(.94)}
.ctrl.skip{
  color:#666;border-color:#666;
}
.ctrl.skip:hover{
  color:#fff;border-color:#888;
  box-shadow:0 0 30px rgba(255,255,255,.15);
}
.ctrl.ship{
  color:var(--hot);border-color:var(--hot);
  box-shadow:
    0 0 30px rgba(255,0,102,.6),
    inset 0 0 20px rgba(255,0,102,.15);
  animation:pulseBtn 2s ease-in-out infinite;
}
.ctrl.ship:hover{
  background:rgba(255,0,102,.15);
  box-shadow:
    0 0 50px rgba(255,0,102,.9),
    0 0 100px rgba(176,38,255,.4);
  animation:none;
}
@keyframes pulseBtn{
  0%,100%{box-shadow:0 0 24px rgba(255,0,102,.5), inset 0 0 16px rgba(255,0,102,.1)}
  50%{box-shadow:0 0 44px rgba(255,0,102,.85), inset 0 0 24px rgba(255,0,102,.2)}
}

/* ============ MATCH MODAL ============ */
.match-modal{
  position:fixed;inset:0;z-index:100;
  display:flex;align-items:center;justify-content:center;
  background:radial-gradient(ellipse at center, rgba(255,0,102,.25) 0%, rgba(8,0,10,.97) 60%);
  backdrop-filter:blur(30px);
  opacity:0;pointer-events:none;transition:opacity .4s;padding:20px;
}
.match-modal.show{opacity:1;pointer-events:auto}
.match-card{
  text-align:center;padding:44px 32px 36px;max-width:460px;width:100%;
  background:linear-gradient(160deg,#1a0028 0%,#0a0010 100%);
  border:2px solid var(--hot);border-radius:32px;
  transform:scale(.6) rotate(-4deg);
  transition:transform .55s cubic-bezier(.34,1.56,.64,1);
  box-shadow:
    0 30px 90px rgba(0,0,0,.85),
    0 0 100px rgba(255,0,102,.6),
    inset 0 0 60px rgba(176,38,255,.15);
  position:relative;
  overflow:hidden;
}
.match-card::before{
  content:'';position:absolute;inset:0;
  background:
    radial-gradient(circle at 50% 0%, rgba(255,0,102,.4), transparent 60%),
    repeating-linear-gradient(45deg, transparent 0, transparent 20px, rgba(255,0,102,.03) 20px, rgba(255,0,102,.03) 40px);
  pointer-events:none;
}
.match-modal.show .match-card{transform:scale(1) rotate(0)}

.match-icon{
  font-size:90px;line-height:1;margin-bottom:6px;
  filter:drop-shadow(0 0 40px var(--hot));
  animation:heartBeat 1s ease-in-out infinite;
  position:relative;z-index:1;
}
@keyframes heartBeat{
  0%,100%{transform:scale(1)}
  20%{transform:scale(1.25)}
  40%{transform:scale(1)}
  60%{transform:scale(1.15)}
}
.match-title{
  font-family:'Bebas Neue',sans-serif;
  font-size:52px;line-height:.95;letter-spacing:3px;
  background:linear-gradient(180deg,#fff 0%,var(--hot) 60%,var(--neon) 100%);
  -webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;
  margin-bottom:4px;position:relative;z-index:1;
  text-shadow:0 0 40px rgba(255,0,102,.5);
}
.match-names{
  margin-top:20px;display:flex;align-items:center;justify-content:center;gap:10px;flex-wrap:wrap;
  position:relative;z-index:1;
}
.match-name{
  font-family:'Bebas Neue',sans-serif;
  font-size:22px;letter-spacing:1.5px;
  padding:10px 18px;border-radius:16px;
  background:rgba(255,255,255,.06);
  border:1.5px solid rgba(255,0,102,.4);
  box-shadow:0 0 20px rgba(255,0,102,.3);
}
.match-plus{
  font-size:28px;color:var(--hot);font-weight:900;
  filter:drop-shadow(0 0 10px var(--hot));
}
.match-sub{
  font-size:13.5px;color:#d0b8e0;margin-top:20px;line-height:1.55;
  position:relative;z-index:1;
}
.match-sub strong{color:var(--hot);font-weight:900;font-size:16px}
.match-continue{
  margin-top:26px;padding:16px 44px;border-radius:16px;
  background:linear-gradient(135deg,var(--hot),var(--neon));
  border:none;color:#fff;font-size:14.5px;font-weight:900;
  cursor:pointer;font-family:inherit;letter-spacing:2px;
  text-transform:uppercase;
  box-shadow:
    0 10px 40px rgba(255,0,102,.6),
    0 0 60px rgba(176,38,255,.3);
  transition:.25s;
  position:relative;z-index:1;
}
.match-continue:hover{
  transform:translateY(-3px) scale(1.03);
  box-shadow:
    0 15px 50px rgba(255,0,102,.8),
    0 0 80px rgba(176,38,255,.5);
}

.confetti{
  position:fixed;width:10px;height:10px;z-index:99;pointer-events:none;
  animation:fall linear forwards;
}
@keyframes fall{
  0%{transform:translateY(-10vh) rotate(0);opacity:1}
  100%{transform:translateY(110vh) rotate(720deg);opacity:0}
}

/* ============ SUMMARY ============ */
.summary{
  position:fixed;inset:66px 0 0 0;z-index:60;
  background:var(--bg);overflow-y:auto;padding:30px 20px 100px;
  transform:translateY(100%);transition:transform .6s cubic-bezier(.7,0,.2,1);
}
.summary.show{transform:translateY(0)}
.summary::before{
  content:'';position:fixed;inset:66px 0 0 0;pointer-events:none;z-index:-1;
  background:

/* =========================================================
   HASH & HELPERS
   ========================================================= */
function hash(str){
  let h = 7;
  for(let i=0;i<str.length;i++) h = ((h*31) + str.charCodeAt(i)) >>> 0;
  return h;
}
function vibeFor(id){
  return VIBES[hash(id) % VIBES.length];
}
function tagFor(id){
  return TAGS[hash(id+'x') % TAGS.length];
}
function colorFor(id){
  const pal = ['#ff0066','#b026ff','#ff2e88','#ff5fa2','#c026d3','#e11d74','#7c3aed','#db2777'];
  return pal[hash(id) % pal.length];
}
function initials(n){
  return n.split(' ').filter(w=>w.length>1).slice(0,2).map(w=>w[0]).join('').toUpperCase();
}
function compatibility(a, b){
  let s = 22;
  const common = a.i.filter(x => b.i.includes(x));
  s += common.length * 12;
  if(a.l === b.l) s += 16;
  const d = Math.abs(a.a - b.a);
  if(d <= 3) s += 16;
  else if(d <= 7) s += 10;
  else if(d <= 12) s += 4;
  else if(d > 20) s -= 4;
  s += hash(a.id + b.id) % 9;
  return {score: Math.max(15, Math.min(98, s)), common};
}

/* =========================================================
   ESTADO
   ========================================================= */
let me = null, deck = [], currentIndex = 0, matches = [], history = [];
const selector = document.getElementById('selector');
const stage = document.getElementById('stage');
const controls = document.getElementById('controls');
const deckEl = document.getElementById('deck');
const summary = document.getElementById('summary');
const matchModal = document.getElementById('matchModal');

/* =========================================================
   SELECTOR
   ========================================================= */
function renderSelector(filter=''){
  const grid = document.getElementById('peopleGrid');
  const f = filter.toLowerCase().trim();
  const filtered = PEOPLE.filter(p => !f || p.n.toLowerCase().includes(f) || p.l.toLowerCase().includes(f) || p.r.toLowerCase().includes(f));
  grid.innerHTML = filtered.map(p=>`
    <div class="person-tile" data-id="${p.id}">
      <div class="pt-avatar" style="background:linear-gradient(135deg,${colorFor(p.id)},${colorFor(p.id)}99)">${initials(p.n)}</div>
      <div class="pt-name">${p.n.split(' ')[0]}</div>
      <div class="pt-meta">${p.l.split(' ')[0]}</div>
    </div>
  `).join('');
  grid.querySelectorAll('.person-tile').forEach(t=>{
    t.addEventListener('click', ()=> selectMe(t.dataset.id));
  });
}
document.getElementById('searchUser').addEventListener('input', e => renderSelector(e.target.value));

function selectMe(id){
  me = PEOPLE.find(p => p.id === id);
  if(!me) return;
  document.getElementById('myUserBtn').style.display = 'flex';
  document.getElementById('myUserAvatar').textContent = initials(me.n);
  document.getElementById('myUserAvatar').style.background = `linear-gradient(135deg,${colorFor(me.id)},${colorFor(me.id)}99)`;
  document.getElementById('myUserName').textContent = me.n.split(' ')[0];

  const others = PEOPLE.filter(p => p.id !== me.id).map(p=>{
    const c = compatibility(me, p);
    return {...p, score: c.score, common: c.common};
  }).sort((a,b)=> b.score - a.score);

  deck = others;
  currentIndex = 0;
  matches = [];
  history = [];

  selector.classList.add('hidden');
  stage.classList.add('active');
  controls.style.display = 'flex';
  matchModal.classList.remove('show');
  renderNext();
}

/* =========================================================
   RENDER
   ========================================================= */
function renderNext(){
  deckEl.innerHTML = '';
  if(currentIndex >= deck.length){ showSummary(); return; }
  const remaining = deck.slice(currentIndex, currentIndex + 2);
  remaining.reverse().forEach((p, i)=>{
    const card = buildCard(p);
    if(i === 0){
      card.style.transform = 'scale(0.94) translateY(-12px)';
      card.style.opacity = '0.4';
      card.style.pointerEvents = 'none';
    } else {
      attachDrag(card, p);
    }
    deckEl.appendChild(card);
  });
}

function buildCard(p){
  const color = colorFor(p.id);
  const commonSet = new Set(p.common || []);
  const card = document.createElement('div');
  card.className = 'card';
  card.style.setProperty('--accent', color);

  card.innerHTML = `
    <div class="card-cover" data-pct="${p.score}">
      <div class="card-online"><span class="online-dot"></span>EN LÍNEA</div>
      <div class="card-match-badge">${p.score}<small>%</small></div>
      <div class="card-avatar">${initials(p.n)}</div>
    </div>
    <div class="card-body">
      <div class="card-name">${p.n}</div>
      <div class="card-meta">
        <span class="meta-chip">${p.a} años</span>
        <span class="meta-chip loc">📍 ${p.l}</span>
        <span class="meta-chip">${tagFor(p.id)}</span>
      </div>
      <div class="card-role">${vibeFor(p.id)} · ${p.r}</div>
      <div class="card-bio">"${p.b}"</div>
      <div class="match-section">
        <div class="match-label">Conexión <span>${p.score >= 80 ? '🔥 BRUTAL' : p.score >= 65 ? '💋 FUERTE' : p.score >= 50 ? '✨ BUENA' : '👀 REGULAR'}</span></div>
        <div class="match-bar"><div class="match-fill" style="width:${p.score}%"></div></div>
      </div>
      <div class="chips">
        ${p.i.map(int => `<span class="chip ${commonSet.has(int)?'common':''}">${commonSet.has(int)?'♥ ':''}${int}</span>`).join('')}
      </div>
    </div>
    <div class="drag-label like">MATCH</div>
    <div class="drag-label nope">NEXT</div>
  `;
  return card;
}

/* =========================================================
   DRAG
   ========================================================= */
function attachDrag(card, p){
  let sx=0, sy=0, cx=0, cy=0, dragging=false;
  const likeL = card.querySelector('.drag-label.like');
  const nopeL = card.querySelector('.drag-label.nope');
  function down(e){
    dragging = true;
    card.classList.add('dragging');
    const pt = e.touches ? e.touches[0] : e;
    sx = pt.clientX; sy = pt.clientY;
  }
  function move(e){
    if(!dragging) return;
    const pt = e.touches ? e.touches[0] : e;
    cx = pt.clientX - sx; cy = pt.clientY - sy;
    card.style.transform = `translate(${cx}px, ${cy}px) rotate(${cx/22}deg)`;
    likeL.style.opacity = Math.max(0, Math.min(1, cx / 90));
    nopeL.style.opacity = Math.max(0, Math.min(1, -cx / 90));
  }
  function up(){
    if(!dragging) return;
    dragging = false;
    card.classList.remove('dragging');
    if(cx > 85) swipe('right', card, p);
    else if(cx < -85) swipe('left', card, p);
    else {
      card.style.transform = '';
      likeL.style.opacity = 0; nopeL.style.opacity = 0;
    }
    cx = 0; cy = 0;
  }
  card.addEventListener('mousedown', down);
  document.addEventListener('mousemove', move);
  document.addEventListener('mouseup', up);
  card.addEventListener('touchstart', down, {passive:true});
  card.addEventListener('touchmove', move, {passive:true});
  card.addEventListener('touchend', up);
}

/* =========================================================
   SWIPE
   ========================================================= */
function swipe(dir, card, p){
  card.classList.add(dir === 'right' ? 'exit-right' : 'exit-left');
  if(dir === 'right'){
    matches.push(p);
    history.push({type:'match', p});
    setTimeout(()=>{
      currentIndex++;
      renderNext();
      if(currentIndex <= deck.length) showMatchModal(p);
    }, 300);
  } else {
    history.push({type:'pass', p});
    setTimeout(()=>{ currentIndex++; renderNext(); }, 300);
  }
}

function topCard(){ return deckEl.querySelector('.card:not([style*="scale(0.94)"])'); }

document.getElementById('shipBtn').addEventListener('click', ()=>{
  const p = deck[currentIndex], c = topCard();
  if(p && c) swipe('right', c, p);
});
document.getElementById('skipBtn').addEventListener('click', ()=>{
  const p = deck[currentIndex], c = topCard();
  if(p && c) swipe('left', c, p);
});

document.addEventListener('keydown', e=>{
  if(matchModal.classList.contains('show')){
    if(e.key === 'Enter' || e.key === ' ') document.getElementById('matchContinue').click();
    return;
  }
  if(!stage.classList.contains('active')) return;
  if(e.key === 'ArrowRight') document.getElementById('shipBtn').click();
  if(e.key === 'ArrowLeft') document.getElementById('skipBtn').click();
});

/* =========================================================
   MODAL
   ========================================================= */
function showMatchModal(p){
  document.getElementById('matchNames').innerHTML = `
    <div class="match-name" style="color:${colorFor(me.id)}">${me.n.split(' ')[0].toUpperCase()}</div>
    <div class="match-plus">+</div>
    <div class="match-name" style="color:${colorFor(p.id)}">${p.n.split(' ')[0].toUpperCase()}</div>
  `;
  const tag = p.score >= 80 ? '¡Se van a comer!' : p.score >= 65 ? '¡Fuego puro!' : p.score >= 50 ? '¡Hay química!' : '¡Podría arder!';
  document.getElementById('matchSub').innerHTML = `${tag}<br><strong>${p.score}%</strong> de compatibilidad · ${vibeFor(p.id)}`;
  matchModal.classList.add('show');
  confetti();
}

document.getElementById('matchContinue').addEventListener('click', ()=>{
  matchModal.classList.remove('show');
  if(currentIndex >= deck.length) setTimeout(showSummary, 300);
});

function confetti(){
  const colors = ['#ff0066','#b026ff','#ff2e88','#00ffd5','#ffb300','#fff'];
  for(let i=0; i<60; i++){
    setTimeout(()=>{
      const c = document.createElement('div');
      c.className = 'confetti';
      c.style.left = Math.random() * 100 + 'vw';
      c.style.top = '-20px';
      c.style.background = colors[Math.floor(Math.random()*colors.length)];
      c.style.borderRadius = Math.random() > 0.5 ? '50%' : '2px';
      c.style.width = c.style.height = (6 + Math.random()*10) + 'px';
      c.style.animationDuration = (2 + Math.random()*2) + 's';
      document.body.appendChild(c);
      setTimeout(()=> c.remove(), 4500);
    }, i * 20);
  }
}

/* =========================================================
   SUMMARY
   ========================================================= */
function showSummary(){
  controls.style.display = 'none';
  const avg = matches.length ? Math.round(matches.reduce((a,m)=>a+m.score, 0) / matches.length) : 0;
  const top = matches.length ? matches.reduce((a,m)=> m.score > a.score ? m : a) : null;
  const sorted = [...matches].sort((a,b)=> b.score - a.score);

  summary.innerHTML = `
    <div class="summary-header">
      <span class="emoji">🔥</span>
      <h2>TU CACERÍA</h2>
      <p>Soy <strong>${me.n}</strong> y me comí a ${matches.length} ${matches.length === 1 ? 'presa' : 'presas'}</p>
    </div>
    <div class="stats">
      <div class="stat"><div class="stat-num">${matches.length}</div><div class="stat-lbl">Matches 🔥</div></div>
      <div class="stat"><div class="stat-num muted">${history.filter(h=>h.type==='pass').length}</div><div class="stat-lbl">Descartados</div></div>
      <div class="stat"><div class="stat-num purple">${avg}%</div><div class="stat-lbl">Promedio</div></div>
    </div>
    ${sorted.length ? `
      <div class="ships-list">
        ${sorted.map((p, i) => `
          <div class="ship-card" style="animation-delay:${i*0.04}s">
            <div class="ship-avatar" style="background:linear-gradient(135deg,${colorFor(p.id)},${colorFor(p.id)}99)">${initials(p.n)}</div>
            <div class="ship-info">
              <div class="ship-name">${p.n}</div>
              <div class="ship-meta">${vibeFor(p.id)} · ${p.l}</div>
            </div>
            <div class="ship-pct">${p.score}<small>%</small></div>
          </div>
        `).join('')}
      </div>
    ` : `
      <div class="no-ships">
        <span class="icon">💔</span>
        No te comiste a nadie.<br>La abstinencia también es válida.
      </div>
    `}
    ${top ? `
      <div class="top-pick">
        <div class="top-pick-label">💎 LA PRESA DEL AÑO</div>
        <div class="top-pick-name">${top.n}</div>
        <div class="top-pick-pct">${top.score}% · ${vibeFor(top.id)}</div>
      </div>
    ` : ''}
    <div class="bottom-actions">
      <button class="action-btn" onclick="changeUser()">🔄 Cambiar</button>
      <button class="action-btn ghost" onclick="restart()">↺ Otra ronda</button>
    </div>
  `;
  summary.classList.add('show');
}

function changeUser(){
  summary.classList.remove('show');
  stage.classList.remove('active');
  selector.classList.remove('hidden');
  document.getElementById('myUserBtn').style.display = 'none';
  document.getElementById('searchUser').value = '';
  renderSelector('');
  me = null;
}
function restart(){
  if(!me) return;
  const others = PEOPLE.filter(p => p.id !== me.id).map(p=>{
    const c = compatibility(me, p);
    return {...p, score: c.score, common: c.common};
  }).sort((a,b)=> b.score - a.score);
  deck = others; currentIndex = 0; matches = []; history = [];
  summary.classList.remove('show');
  controls.style.display = 'flex';
  renderNext();
}

document.getElementById('myUserBtn').addEventListener('click', changeUser);
