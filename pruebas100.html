<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>ShipGrindr 💘 · Encuentra tu match</title>
<style>
:root{
  --bg:#0d0618; --card:#1c1030; --card-2:#251640;
  --border:#382556; --text:#f6f0ff; --muted:#a494c8;
  --pink:#ff5fa2; --purple:#a78bfa; --red:#ff4d6d;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;overflow:hidden;font-family:'Inter',-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;background:var(--bg);color:var(--text);-webkit-tap-highlight-color:transparent}
body::before{
  content:'';position:fixed;inset:0;pointer-events:none;z-index:0;
  background:
    radial-gradient(circle at 12% 15%, rgba(255,95,162,.24) 0%, transparent 45%),
    radial-gradient(circle at 88% 85%, rgba(167,139,250,.24) 0%, transparent 45%),
    radial-gradient(circle at 50% 50%, rgba(255,77,109,.08) 0%, transparent 65%);
}
.heart-bg{position:fixed;pointer-events:none;z-index:1;opacity:.1;animation:floatUp linear infinite;font-size:18px}
@keyframes floatUp{
  0%{transform:translateY(100vh) rotate(0);opacity:0}
  10%{opacity:.22}
  90%{opacity:.12}
  100%{transform:translateY(-10vh) rotate(360deg);opacity:0}
}

/* ============ TOPBAR ============ */
.topbar{
  position:fixed;top:0;left:0;right:0;z-index:50;height:64px;
  padding:0 18px;display:flex;align-items:center;gap:12px;
  background:rgba(13,6,24,.85);backdrop-filter:blur(20px);
  border-bottom:1px solid var(--border);
}
.brand{display:flex;align-items:center;gap:11px;cursor:pointer}
.brand-mark{
  width:40px;height:40px;border-radius:50%;
  background:linear-gradient(135deg,#ff5fa2,#a78bfa);
  display:grid;place-items:center;font-size:20px;
  box-shadow:0 0 26px rgba(255,95,162,.55);
  animation:beat 2.4s ease-in-out infinite;
}
@keyframes beat{0%,100%{transform:scale(1)}50%{transform:scale(1.07)}}
.brand-text h1{font-size:14.5px;font-weight:900;letter-spacing:-.3px}
.brand-text p{font-size:10px;color:var(--muted);margin-top:1px;font-weight:600;letter-spacing:.3px}

.my-user{
  margin-left:auto;display:flex;align-items:center;gap:10px;
  padding:6px 12px 6px 6px;background:var(--card);
  border:1px solid var(--border);border-radius:30px;
  cursor:pointer;transition:.2s;
}
.my-user:hover{border-color:var(--pink)}
.my-user-avatar{
  width:32px;height:32px;border-radius:50%;
  display:grid;place-items:center;font-weight:800;font-size:12px;color:#fff;
  background:linear-gradient(135deg,#ff5fa2,#a78bfa);
}
.my-user-name{font-size:11.5px;font-weight:700;max-width:100px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

/* ============ SELECTOR ============ */
.selector{
  position:fixed;inset:64px 0 0 0;z-index:20;
  display:flex;flex-direction:column;
  background:var(--bg);overflow-y:auto;
  padding:28px 20px 40px;
  transition:transform .5s cubic-bezier(.4,0,.2,1);
}
.selector.hidden{transform:translateY(-100%);pointer-events:none}
.selector-header{text-align:center;margin-bottom:22px}
.selector-header h2{
  font-size:28px;font-weight:900;letter-spacing:-.8px;
  background:linear-gradient(135deg,#ff5fa2,#a78bfa);
  -webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;
}
.selector-header p{font-size:12.5px;color:var(--muted);margin-top:8px;font-weight:500}

.selector-search{
  position:relative;max-width:520px;margin:0 auto 20px;width:100%;
}
.selector-search svg{position:absolute;left:14px;top:50%;transform:translateY(-50%);color:var(--muted)}
.selector-search input{
  width:100%;padding:13px 16px 13px 42px;
  background:var(--card);border:1px solid var(--border);border-radius:14px;
  color:var(--text);font-size:13.5px;outline:none;font-family:inherit;
  transition:.2s;
}
.selector-search input:focus{border-color:var(--pink);box-shadow:0 0 0 3px rgba(255,95,162,.2)}

.people-grid{
  max-width:900px;margin:0 auto;width:100%;
  display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));
  gap:10px;
}
.person-tile{
  padding:14px 10px;background:var(--card);
  border:1px solid var(--border);border-radius:14px;
  cursor:pointer;text-align:center;transition:.2s;
}
.person-tile:hover{
  transform:translateY(-3px);border-color:var(--pink);
  background:var(--card-2);
  box-shadow:0 10px 24px rgba(255,95,162,.15);
}
.person-tile .pt-avatar{
  width:52px;height:52px;border-radius:50%;margin:0 auto 8px;
  display:grid;place-items:center;font-weight:800;font-size:16px;color:#fff;
  border:2px solid rgba(255,255,255,.1);
}
.person-tile .pt-name{font-size:11.5px;font-weight:700;line-height:1.2;margin-bottom:3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.person-tile .pt-meta{font-size:9.5px;color:var(--muted);font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

/* ============ STAGE SWIPE ============ */
.stage{
  position:fixed;inset:64px 0 0 0;z-index:10;
  display:flex;align-items:center;justify-content:center;
  padding:16px 16px 130px;
  opacity:0;pointer-events:none;transition:opacity .4s;
}
.stage.active{opacity:1;pointer-events:auto}

.deck{
  position:relative;width:100%;max-width:400px;height:100%;max-height:680px;
}
.card{
  position:absolute;inset:0;
  background:linear-gradient(165deg,#1f1235 0%,#160a24 100%);
  border:1.5px solid var(--border);border-radius:26px;
  overflow:hidden;display:flex;flex-direction:column;
  box-shadow:0 24px 60px rgba(0,0,0,.7);
  cursor:grab;
  transition:transform .5s cubic-bezier(.4,0,.2,1),opacity .4s;
  will-change:transform;
}
.card.dragging{cursor:grabbing;transition:none}
.card.exit-left{transform:translateX(-160%) rotate(-28deg) !important;opacity:0}
.card.exit-right{transform:translateX(160%) rotate(28deg) !important;opacity:0}

.card-cover{
  position:relative;height:38%;min-height:210px;
  background:linear-gradient(135deg,var(--accent,#ff5fa2),color-mix(in srgb,var(--accent) 40%,#000));
  display:grid;place-items:center;overflow:hidden;
}
.card-cover::before{
  content:'';position:absolute;inset:0;
  background:
    radial-gradient(circle at 30% 20%, rgba(255,255,255,.3), transparent 50%),
    radial-gradient(circle at 75% 80%, rgba(0,0,0,.35), transparent 55%);
}
.card-avatar{
  position:relative;z-index:1;
  width:130px;height:130px;border-radius:50%;
  background:rgba(13,6,24,.85);backdrop-filter:blur(10px);
  display:grid;place-items:center;
  font-size:44px;font-weight:900;color:var(--accent,#ff5fa2);
  border:4px solid rgba(255,255,255,.4);
  box-shadow:0 12px 40px rgba(0,0,0,.6);
}
.card-match-badge{
  position:absolute;top:16px;right:16px;z-index:2;
  padding:8px 14px;border-radius:20px;
  background:rgba(13,6,24,.92);backdrop-filter:blur(12px);
  border:1.5px solid var(--accent,#ff5fa2);
  font-size:12px;font-weight:900;color:var(--accent,#ff5fa2);
  display:flex;align-items:center;gap:6px;
  box-shadow:0 0 24px color-mix(in srgb,var(--accent) 40%,transparent);
}
.match-dot{width:8px;height:8px;border-radius:50%;background:var(--accent);box-shadow:0 0 10px var(--accent);animation:pulse 1.8s ease-in-out infinite}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.4}}

.card-body{padding:20px 22px;flex:1;display:flex;flex-direction:column;overflow-y:auto}
.card-name{font-size:22px;font-weight:900;letter-spacing:-.5px;line-height:1.15}
.card-meta{display:flex;flex-wrap:wrap;gap:10px;margin-top:6px;font-size:11px;color:var(--muted);font-weight:600}
.card-meta span{display:flex;align-items:center;gap:4px}
.card-role{font-size:12.5px;color:#c8bfdd;margin-top:10px;font-weight:600}
.card-bio{font-size:12px;color:#c8bfdd;line-height:1.55;margin-top:10px;font-style:italic;padding:10px 12px;border-radius:10px;background:rgba(255,255,255,.03)}

.match-section{margin-top:16px}
.match-label{font-size:10px;font-weight:800;text-transform:uppercase;letter-spacing:.9px;color:var(--muted);margin-bottom:8px}
.match-bar{height:9px;border-radius:6px;background:rgba(255,255,255,.06);overflow:hidden}
.match-fill{height:100%;background:linear-gradient(90deg,var(--accent,#ff5fa2),#a78bfa);box-shadow:0 0 12px var(--accent);transition:width .6s}

.chips{display:flex;flex-wrap:wrap;gap:5px;margin-top:14px}
.chip{font-size:10px;padding:5px 10px;border-radius:20px;background:rgba(255,255,255,.05);border:1px solid rgba(255,255,255,.08);color:#d6ccec;font-weight:600}
.chip.common{
  background:linear-gradient(135deg,rgba(255,95,162,.25),rgba(167,139,250,.25));
  border-color:rgba(255,95,162,.55);color:#fff;
  box-shadow:0 0 14px rgba(255,95,162,.35);
}

.drag-label{
  position:absolute;top:44px;z-index:10;
  padding:8px 16px;border-radius:12px;
  font-size:22px;font-weight:900;letter-spacing:2px;
  opacity:0;transition:opacity .15s;pointer-events:none;
  border:3px solid;
}
.drag-label.like{left:24px;color:var(--pink);border-color:var(--pink);background:rgba(255,95,162,.15);transform:rotate(-12deg);text-shadow:0 0 10px var(--pink)}
.drag-label.nope{right:24px;color:var(--red);border-color:var(--red);background:rgba(255,77,109,.15);transform:rotate(12deg);text-shadow:0 0 10px var(--red)}

.controls{
  position:fixed;bottom:20px;left:0;right:0;z-index:30;
  display:flex;justify-content:center;gap:22px;
}
.ctrl{
  width:68px;height:68px;border-radius:50%;
  display:grid;place-items:center;cursor:pointer;
  border:2.5px solid;background:rgba(13,6,24,.9);
  backdrop-filter:blur(20px);
  transition:.25s cubic-bezier(.34,1.56,.64,1);
  font-size:30px;
}
.ctrl:hover{transform:scale(1.12) rotate(-3deg)}
.ctrl:active{transform:scale(.94)}
.ctrl.skip{color:var(--red);border-color:var(--red);box-shadow:0 0 26px rgba(255,77,109,.35)}
.ctrl.ship{color:var(--pink);border-color:var(--pink);box-shadow:0 0 26px rgba(255,95,162,.35)}

.match-modal{
  position:fixed;inset:0;z-index:100;
  display:flex;align-items:center;justify-content:center;
  background:rgba(13,6,24,.92);backdrop-filter:blur(20px);
  opacity:0;pointer-events:none;transition:opacity .35s;padding:20px;
}
.match-modal.show{opacity:1;pointer-events:auto}
.match-card{
  text-align:center;padding:36px 28px;max-width:440px;
  background:linear-gradient(165deg,#241538 0%,#180a26 100%);
  border:1.5px solid rgba(255,95,162,.4);border-radius:26px;
  transform:scale(.7);transition:transform .5s cubic-bezier(.34,1.56,.64,1);
  box-shadow:0 30px 80px rgba(0,0,0,.7),0 0 60px rgba(255,95,162,.25);
}
.match-modal.show .match-card{transform:scale(1)}
.match-icon{font-size:72px;margin-bottom:12px;animation:beat 1.2s ease-in-out infinite;filter:drop-shadow(0 0 30px rgba(255,95,162,.85))}
.match-title{
  font-size:26px;font-weight:900;letter-spacing:-.8px;
  background:linear-gradient(135deg,#ff5fa2,#a78bfa);
  -webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;
}
.match-names{margin-top:18px;display:flex;align-items:center;justify-content:center;gap:10px;flex-wrap:wrap}
.match-name{font-size:14px;font-weight:800;padding:8px 14px;border-radius:14px;background:rgba(255,255,255,.05);border:1px solid rgba(255,255,255,.1)}
.match-plus{font-size:20px;color:var(--pink);font-weight:900}
.match-sub{font-size:12.5px;color:#c8c0dc;margin-top:16px;line-height:1.6}
.match-sub strong{color:var(--pink);font-weight:800}
.match-continue{
  margin-top:24px;padding:14px 36px;border-radius:14px;
  background:linear-gradient(135deg,#ff5fa2,#a78bfa);
  border:none;color:#fff;font-size:14px;font-weight:800;
  cursor:pointer;font-family:inherit;letter-spacing:.3px;
  box-shadow:0 8px 30px rgba(255,95,162,.45);transition:.2s;
}
.match-continue:hover{transform:translateY(-2px);box-shadow:0 12px 40px rgba(255,95,162,.6)}

.confetti{position:fixed;width:10px;height:10px;z-index:99;pointer-events:none;animation:fall linear forwards}
@keyframes fall{0%{transform:translateY(-10vh) rotate(0);opacity:1}100%{transform:translateY(110vh) rotate(720deg);opacity:0}}

/* ============ SUMMARY ============ */
.summary{
  position:fixed;inset:64px 0 0 0;z-index:60;
  background:var(--bg);overflow-y:auto;padding:28px 20px 100px;
  transform:translateY(100%);transition:transform .55s cubic-bezier(.4,0,.2,1);
}
.summary.show{transform:translateY(0)}
.summary::before{
  content:'';position:fixed;inset:64px 0 0 0;pointer-events:none;z-index:-1;
  background:
    radial-gradient(circle at 25% 20%, rgba(255,95,162,.18), transparent 50%),
    radial-gradient(circle at 75% 80%, rgba(167,139,250,.18), transparent 50%);
}
.summary-header{text-align:center;margin-bottom:24px}
.summary-header .emoji{font-size:52px;display:block;margin-bottom:8px}
.summary-header h2{
  font-size:26px;font-weight:900;letter-spacing:-.8px;
  background:linear-gradient(135deg,#ff5fa2,#a78bfa,#22d3ee);
  -webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;
}
.summary-header p{color:var(--muted);margin-top:8px;font-size:13px;font-weight:500}
.summary-header p strong{color:var(--pink);font-weight:800}

.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;max-width:520px;margin:20px auto 28px}
.stat{background:var(--card);border:1px solid var(--border);border-radius:14px;padding:14px 10px;text-align:center}
.stat-num{font-size:26px;font-weight:900;letter-spacing:-1px;line-height:1}
.stat-lbl{font-size:10px;color:var(--muted);text-transform:uppercase;letter-spacing:.7px;font-weight:700;margin-top:6px}

.ships-list{max-width:560px;margin:0 auto;display:flex;flex-direction:column;gap:10px}
.ship-card{
  display:flex;align-items:center;gap:12px;
  background:var(--card);border:1px solid var(--border);
  border-radius:14px;padding:12px 14px;
  animation:shipIn .4s cubic-bezier(.34,1.56,.64,1) backwards;
}
@keyframes shipIn{0%{transform:translateY(20px);opacity:0}100%{transform:translateY(0);opacity:1}}
.ship-avatar{width:44px;height:44px;border-radius:50%;display:grid;place-items:center;font-weight:800;font-size:14px;color:#fff;border:2px solid rgba(255,255,255,.15);flex-shrink:0}
.ship-info{flex:1;min-width:0}
.ship-name{font-size:13.5px;font-weight:800;line-height:1.2;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ship-meta{font-size:10.5px;color:var(--muted);margin-top:3px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ship-pct{
  font-size:17px;font-weight:900;letter-spacing:-.5px;flex-shrink:0;
  background:linear-gradient(135deg,#ff5fa2,#a78bfa);
  -webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;
}
.no-ships{text-align:center;padding:50px 20px;color:var(--muted);font-size:14px;line-height:1.7;max-width:520px;margin:0 auto}
.no-ships .icon{font-size:52px;display:block;margin-bottom:14px;opacity:.4}
.top-pick{
  max-width:560px;margin:28px auto 0;padding:20px;
  background:linear-gradient(135deg,rgba(255,95,162,.1),rgba(167,139,250,.1));
  border:1px solid rgba(255,95,162,.3);border-radius:16px;text-align:center;
}
.top-pick-label{font-size:10.5px;color:var(--muted);text-transform:uppercase;letter-spacing:1px;font-weight:800;margin-bottom:8px}
.top-pick-name{font-size:17px;font-weight:900;color:#fff}
.top-pick-pct{font-size:13px;color:var(--pink);font-weight:800;margin-top:6px}
.bottom-actions{display:flex;justify-content:center;gap:12px;margin-top:30px;flex-wrap:wrap}
.action-btn{
  padding:13px 26px;background:linear-gradient(135deg,#ff5fa2,#a78bfa);
  border:none;border-radius:14px;color:#fff;font-size:13.5px;font-weight:800;
  cursor:pointer;font-family:inherit;box-shadow:0 8px 30px rgba(255,95,162,.4);transition:.2s;
}
.action-btn.ghost{
  background:var(--card);border:1px solid var(--border);
  box-shadow:none;color:var(--text);
}
.action-btn:hover{transform:translateY(-2px)}
.action-btn.ghost:hover{border-color:var(--muted)}

@media (max-width:600px){
  .deck{max-height:none}
  .card-cover{height:34%;min-height:180px}
  .card-avatar{width:100px;height:100px;font-size:34px}
  .card-name{font-size:19px}
  .ctrl{width:58px;height:58px;font-size:26px}
  .selector{padding:20px 14px 30px}
  .people-grid{grid-template-columns:repeat(auto-fill,minmax(120px,1fr));gap:8px}
  .my-user-name{display:none}
  .stats{grid-template-columns:1fr 1fr}
  .stats .stat:last-child{grid-column:span 2}
}
::-webkit-scrollbar{width:8px}
::-webkit-scrollbar-thumb{background:var(--border);border-radius:4px}
</style>
</head>
<body>

<header class="topbar">
  <div class="brand" id="brandHome">
    <div class="brand-mark">💘</div>
    <div class="brand-text">
      <h1>ShipGrindr</h1>
      <p>Encuentra tu match</p>
    </div>
  </div>
  <div class="my-user" id="myUserBtn" style="display:none">
    <div class="my-user-avatar" id="myUserAvatar">?</div>
    <div class="my-user-name" id="myUserName">—</div>
  </div>
</header>

<!-- SELECTOR -->
<div class="selector" id="selector">
  <div class="selector-header">
    <h2>¿Quién eres? 💫</h2>
    <p>Elige tu perfil para encontrar tus mejores matches</p>
  </div>
  <div class="selector-search">
    <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round">
      <circle cx="11" cy="11" r="7"/><path d="m21 21-4.3-4.3"/>
    </svg>
    <input type="text" id="searchUser" placeholder="Buscar tu nombre...">
  </div>
  <div class="people-grid" id="peopleGrid"></div>
</div>

<!-- STAGE -->
<div class="stage" id="stage">
  <div class="deck" id="deck"></div>
</div>

<div class="controls" id="controls" style="display:none">
  <button class="ctrl skip" id="skipBtn" title="No pegan (←)">💔</button>
  <button class="ctrl ship" id="shipBtn" title="¡Match! (→)">💖</button>
</div>

<!-- MODAL -->
<div class="match-modal" id="matchModal">
  <div class="match-card">
    <div class="match-icon">💘</div>
    <div class="match-title">¡Es un match!</div>
    <div class="match-names" id="matchNames"></div>
    <div class="match-sub" id="matchSub"></div>
    <button class="match-continue" id="matchContinue">Continuar</button>
  </div>
</div>

<!-- SUMMARY -->
<div class="summary" id="summary"></div>

<script>

  {id:'felix', n:'Félix Claros', a:45, l:'San Salvador', r:'Coordinador de Programas', b:'+20 años en educación. Le encanta enseñar.', i:['Docencia','Café','Lectura','Senderismo']},

/* =========================================================
   CÁLCULO DE COMPATIBILIDAD
   ========================================================= */
function compatibility(a, b){
  let score = 22;
  const common = a.i.filter(x => b.i.includes(x));
  score += common.length * 12;
  if(a.l === b.l) score += 16;
  const ageDiff = Math.abs(a.a - b.a);
  if(ageDiff <= 3) score += 16;
  else if(ageDiff <= 7) score += 10;
  else if(ageDiff <= 12) score += 4;
  else if(ageDiff > 20) score -= 4;
  // Ruido determinístico por par (siempre da lo mismo)
  const seed = (a.id + b.id).split('').reduce((h,c)=>(h*31+c.charCodeAt(0))>>>0, 7);
  score += (seed % 9);
  return {score: Math.max(15, Math.min(98, score)), common};
}

function initials(name){
  return name.split(' ').filter(w=>w.length>1).slice(0,2).map(w=>w[0]).join('').toUpperCase();
}
const palette = ['#ff5fa2','#a78bfa','#22d3ee','#fbbf24','#34d399','#f472b6','#818cf8','#fb7185','#facc15','#c084fc'];
function colorFor(id){
  let h = 0;
  for(let i=0;i<id.length;i++) h = (h*31 + id.charCodeAt(i)) >>> 0;
  return palette[h % palette.length];
}

/* =========================================================
   ESTADO
   ========================================================= */
let me = null;
let deck = [];
let currentIndex = 0;
let matches = [];
let history = [];

const selector = document.getElementById('selector');
const stage = document.getElementById('stage');
const controls = document.getElementById('controls');
const deckEl = document.getElementById('deck');
const summary = document.getElementById('summary');
const matchModal = document.getElementById('matchModal');

/* =========================================================
   RENDER SELECTOR
   ========================================================= */
function renderSelector(filter=''){
  const grid = document.getElementById('peopleGrid');
  const f = filter.toLowerCase().trim();
  const filtered = PEOPLE.filter(p => !f || p.n.toLowerCase().includes(f) || p.l.toLowerCase().includes(f) || p.r.toLowerCase().includes(f));
  grid.innerHTML = filtered.map(p=>`
    <div class="person-tile" data-id="${p.id}">
      <div class="pt-avatar" style="background:linear-gradient(135deg,${colorFor(p.id)},${colorFor(p.id)}99)">${initials(p.n)}</div>
      <div class="pt-name">${p.n.split(' ')[0]} ${p.n.split(' ')[1] || ''}</div>
      <div class="pt-meta">${p.l}</div>
    </div>
  `).join('');
  grid.querySelectorAll('.person-tile').forEach(tile=>{
    tile.addEventListener('click', ()=> selectMe(tile.dataset.id));
  });
}

document.getElementById('searchUser').addEventListener('input', e=>{
  renderSelector(e.target.value);
});

/* =========================================================
   SELECCIONAR "YO"
   ========================================================= */
function selectMe(id){
  me = PEOPLE.find(p => p.id === id);
  if(!me) return;

  // Actualizar header
  document.getElementById('myUserBtn').style.display = 'flex';
  document.getElementById('myUserAvatar').textContent = initials(me.n);
  document.getElementById('myUserAvatar').style.background = `linear-gradient(135deg,${colorFor(me.id)},${colorFor(me.id)}99)`;
  document.getElementById('myUserName').textContent = me.n.split(' ')[0];

  // Construir deck: los demás, ordenados por compatibilidad descendente
  const others = PEOPLE.filter(p => p.id !== me.id).map(p=>{
    const c = compatibility(me, p);
    return {...p, score: c.score, common: c.common};
  }).sort((a,b)=> b.score - a.score);

  deck = others;
  currentIndex = 0;
  matches = [];
  history = [];

  // Ocultar selector, mostrar stage
  selector.classList.add('hidden');
  stage.classList.add('active');
  controls.style.display = 'flex';
  matchModal.classList.remove('show');

  renderNext();
}

/* =========================================================
   RENDER DECK
   ========================================================= */
function renderNext(){
  deckEl.innerHTML = '';
  if(currentIndex >= deck.length){ showSummary(); return; }

  const remaining = deck.slice(currentIndex, currentIndex + 2);
  remaining.reverse().forEach((p, i)=>{
    const card = buildCard(p);
    if(i === 0){
      card.style.transform = 'scale(0.94) translateY(-12px)';
      card.style.opacity = '0.5';
      card.style.pointerEvents = 'none';
    } else {
      attachDrag(card, p);
    }
    deckEl.appendChild(card);
  });
}

function buildCard(p){
  const color = colorFor(p.id);
  const commonSet = new Set(p.common || []);
  const card = document.createElement('div');
  card.className = 'card';
  card.style.setProperty('--accent', color);

  const ageLabel = `${p.a} años`;

  card.innerHTML = `
    <div class="card-cover">
      <div class="card-match-badge">
        <span class="match-dot"></span>
        ${p.score}%
      </div>
      <div class="card-avatar">${initials(p.n)}</div>
    </div>
    <div class="card-body">
      <div class="card-name">${p.n}</div>
      <div class="card-meta">
        <span>🎂 ${ageLabel}</span>
        <span>📍 ${p.l}</span>
      </div>
      <div class="card-role">${p.r}</div>
      <div class="card-bio">"${p.b}"</div>
      <div class="match-section">
        <div class="match-label">Compatibilidad contigo</div>
        <div class="match-bar">
          <div class="match-fill" style="width:${p.score}%"></div>
        </div>
      </div>
      <div class="chips">
        ${p.i.map(int => `<span class="chip ${commonSet.has(int)?'common':''}">${commonSet.has(int)?'♥ ':''}${int}</span>`).join('')}
      </div>
    </div>
    <div class="drag-label like">MATCH</div>
    <div class="drag-label nope">NOPE</div>
  `;
  return card;
}

/* =========================================================
   DRAG / SWIPE
   ========================================================= */
function attachDrag(card, p){
  let startX=0, startY=0, curX=0, curY=0, dragging=false;
  const likeL = card.querySelector('.drag-label.like');
  const nopeL = card.querySelector('.drag-label.nope');

  function down(e){
    dragging = true;
    card.classList.add('dragging');
    const pt = e.touches ? e.touches[0] : e;
    startX = pt.clientX; startY = pt.clientY;
  }
  function move(e){
    if(!dragging) return;
    const pt = e.touches ? e.touches[0] : e;
    curX = pt.clientX - startX;
    curY = pt.clientY - startY;
    card.style.transform = `translate(${curX}px, ${curY}px) rotate(${curX/22}deg)`;
    likeL.style.opacity = Math.max(0, Math.min(1, curX / 100));
    nopeL.style.opacity = Math.max(0, Math.min(1, -curX / 100));
  }
  function up(){
    if(!dragging) return;
    dragging = false;
    card.classList.remove('dragging');
    if(curX > 90) swipe('right', card, p);
    else if(curX < -90) swipe('left', card, p);
    else {
      card.style.transform = '';
      likeL.style.opacity = 0;
      nopeL.style.opacity = 0;
    }
    curX = 0; curY = 0;
  }
  card.addEventListener('mousedown', down);
  document.addEventListener('mousemove', move);
  document.addEventListener('mouseup', up);
  card.addEventListener('touchstart', down, {passive:true});
  card.addEventListener('touchmove', move, {passive:true});
  card.addEventListener('touchend', up);
}

/* =========================================================
   ACCIONES
   ========================================================= */
function swipe(direction, card, p){
  card.classList.add(direction === 'right' ? 'exit-right' : 'exit-left');
  if(direction === 'right'){
    matches.push(p);
    history.push({type:'match', person:p});
    setTimeout(()=>{
      currentIndex++;
      renderNext();
      if(currentIndex <= deck.length) showMatchModal(p);
    }, 300);
  } else {
    history.push({type:'pass', person:p});
    setTimeout(()=>{
      currentIndex++;
      renderNext();
    }, 300);
  }
}

function getTopCard(){
  return deckEl.querySelector('.card:not([style*="scale(0.94)"])');
}

document.getElementById('shipBtn').addEventListener('click', ()=>{
  const p = deck[currentIndex];
  const c = getTopCard();
  if(p && c) swipe('right', c, p);
});
document.getElementById('skipBtn').addEventListener('click', ()=>{
  const p = deck[currentIndex];
  const c = getTopCard();
  if(p && c) swipe('left', c, p);
});

document.addEventListener('keydown', e=>{
  if(matchModal.classList.contains('show')){
    if(e.key === 'Enter' || e.key === ' ') document.getElementById('matchContinue').click();
    return;
  }
  if(!stage.classList.contains('active')) return;
  if(e.key === 'ArrowRight') document.getElementById('shipBtn').click();
  if(e.key === 'ArrowLeft') document.getElementById('skipBtn').click();
});

/* =========================================================
   MODAL DE MATCH
   ========================================================= */
function showMatchModal(p){
  document.getElementById('matchNames').innerHTML = `
    <div class="match-name" style="color:${colorFor(me.id)}">${me.n.split(' ')[0]}</div>
    <div class="match-plus">💘</div>
    <div class="match-name" style="color:${colorFor(p.id)}">${p.n.split(' ')[0]}</div>
  `;
  const tag = p.score >= 80 ? '¡Almas gemelas!' : p.score >= 65 ? '¡Muy compatibles!' : p.score >= 50 ? '¡Buena química!' : '¡Podría funcionar!';
  document.getElementById('matchSub').innerHTML = `${tag} <strong>${p.score}%</strong> de compatibilidad. ¡Se shipean! 💖`;
  matchModal.classList.add('show');
  confetti();
}

document.getElementById('matchContinue').addEventListener('click', ()=>{
  matchModal.classList.remove('show');
  if(currentIndex >= deck.length) setTimeout(showSummary, 300);
});

function confetti(){
  const colors = ['#ff5fa2','#a78bfa','#22d3ee','#fbbf24','#34d399','#ff4d6d'];
  for(let i=0; i<50; i++){
    setTimeout(()=>{
      const c = document.createElement('div');
      c.className = 'confetti';
      c.style.left = Math.random() * 100 + 'vw';
      c.style.top = '-20px';
      c.style.background = colors[Math.floor(Math.random()*colors.length)];
      c.style.borderRadius = Math.random() > 0.5 ? '50%' : '2px';
      c.style.width = c.style.height = (6 + Math.random()*10) + 'px';
      c.style.animationDuration = (2 + Math.random()*2) + 's';
      document.body.appendChild(c);
      setTimeout(()=> c.remove(), 4500);
    }, i * 22);
  }
}

/* =========================================================
   SUMMARY
   ========================================================= */
function showSummary(){
  controls.style.display = 'none';
  const avg = matches.length ? Math.round(matches.reduce((a,m)=>a+m.score, 0) / matches.length) : 0;
  const top = matches.length ? matches.reduce((a,m)=> m.score > a.score ? m : a) : null;
  const sorted = [...matches].sort((a,b)=> b.score - a.score);

  summary.innerHTML = `
    <div class="summary-header">
      <span class="emoji">💒</span>
      <h2>Tus matches</h2>
      <p>Soy <strong>${me.n}</strong> y shipeé a ${matches.length} ${matches.length === 1 ? 'persona' : 'personas'}</p>
    </div>

    <div class="stats">
      <div class="stat">
        <div class="stat-num" style="color:#ff5fa2">${matches.length}</div>
        <div class="stat-lbl">Matches 💖</div>
      </div>
      <div class="stat">
        <div class="stat-num" style="color:#9b93b8">${history.filter(h=>h.type==='pass').length}</div>
        <div class="stat-lbl">Descartados</div>
      </div>
      <div class="stat">
        <div class="stat-num" style="color:#a78bfa">${avg}%</div>
        <div class="stat-lbl">Promedio</div>
      </div>
    </div>

    ${sorted.length ? `
      <div class="ships-list">
        ${sorted.map((p, i) => `
          <div class="ship-card" style="animation-delay:${i * 0.04}s">
            <div class="ship-avatar" style="background:linear-gradient(135deg,${colorFor(p.id)},${colorFor(p.id)}99)">${initials(p.n)}</div>
            <div class="ship-info">
              <div class="ship-name">${p.n}</div>
              <div class="ship-meta">${p.r} · ${p.l}</div>
            </div>
            <div class="ship-pct">${p.score}%</div>
          </div>
        `).join('')}
      </div>
    ` : `
      <div class="no-ships">
        <span class="icon">💔</span>
        No shipeaste a nadie.<br>La soltería también es válida.
      </div>
    `}

    ${top ? `
      <div class="top-pick">
        <div class="top-pick-label">💎 Match del año</div>
        <div class="top-pick-name">${top.n}</div>
        <div class="top-pick-pct">${top.score}% de compatibilidad</div>
      </div>
    ` : ''}

    <div class="bottom-actions">
      <button class="action-btn" onclick="changeUser()">🔄 Cambiar de usuario</button>
      <button class="action-btn ghost" onclick="restart()">↺ Volver a shipear</button>
    </div>
  `;
  summary.classList.add('show');
}

function changeUser(){
  summary.classList.remove('show');
  stage.classList.remove('active');
  selector.classList.remove('hidden');
  document.getElementById('myUserBtn').style.display = 'none';
  document.getElementById('searchUser').value = '';
  renderSelector('');
  me = null;
}

function restart(){
  if(!me) return;
  const others = PEOPLE.filter(p => p.id !== me.id).map(p=>{
    const c = compatibility(me, p);
    return {...p, score: c.score, common: c.common};
  }).sort((a,b)=> b.score - a.score);
  deck = others;
  currentIndex = 0;
  matches = [];
  history = [];
  summary.classList.remove('show');
  controls.style.display = 'flex';
  renderNext();
}

/* Botón "mi usuario" → cambiar
document.getElementById('myUserBtn').addEventListener('click', changeUser);

   CORAZONES DE FONDO

  for(let i=0; i<12; i++){

renderSelector('');
</script>
