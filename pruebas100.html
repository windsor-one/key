<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>RADAR · Lo que hay cerca</title>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;700&family=Bebas+Neue&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#000; --hot:#ff0044; --hot-2:#ff1a6c; --violet:#7a1aff;
  --text:#fff; --muted:#7a6b85; --dim:#1a0a22;
  --line:rgba(255,0,68,.15);
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{
  height:100%;overflow:hidden;
  font-family:'Space Grotesk',sans-serif;
  background:var(--bg);color:var(--text);
  -webkit-tap-highlight-color:transparent;
  letter-spacing:-.2px;
}

/* Breathing red aura */
body::before{
  content:'';position:fixed;inset:-10%;pointer-events:none;z-index:0;
  background:radial-gradient(ellipse at center, rgba(255,0,68,.18) 0%, rgba(122,26,255,.08) 40%, transparent 70%);
  animation:breathe 5s ease-in-out infinite;
}
@keyframes breathe{
  0%,100%{transform:scale(1);opacity:.8}
  50%{transform:scale(1.06);opacity:1}
}

/* ============ TOPBAR ============ */
.topbar{
  position:fixed;top:0;left:0;right:0;z-index:50;height:62px;
  padding:0 18px;display:flex;align-items:center;gap:14px;
  background:rgba(0,0,0,.6);backdrop-filter:blur(20px);
  border-bottom:1px solid var(--line);
}
.brand{display:flex;align-items:center;gap:11px;cursor:pointer}
.brand-mark{
  width:38px;height:38px;border-radius:50%;
  background:radial-gradient(circle at 40% 40%, var(--hot-2), var(--hot) 60%, #6a0024);
  display:grid;place-items:center;
  font-family:'Bebas Neue',sans-serif;font-size:20px;color:#fff;
  box-shadow:0 0 20px rgba(255,0,68,.7), 0 0 40px rgba(255,0,68,.3);
  animation:heartbeat 1.6s ease-in-out infinite;
  position:relative;
}
.brand-mark::before{
  content:'';position:absolute;inset:-6px;border-radius:50%;
  border:1px solid rgba(255,0,68,.5);
  animation:ringPulse 2.2s ease-out infinite;
}
@keyframes ringPulse{
  0%{transform:scale(1);opacity:.8}
  100%{transform:scale(1.7);opacity:0}
}
@keyframes heartbeat{
  0%,100%{transform:scale(1)}
  15%{transform:scale(1.12)}
  30%{transform:scale(1)}
  45%{transform:scale(1.08)}
  60%{transform:scale(1)}
}
.brand-text h1{
  font-family:'Bebas Neue',sans-serif;font-size:20px;letter-spacing:3px;
  color:#fff;line-height:1;
}
.brand-text p{
  font-size:9.5px;color:var(--hot);margin-top:3px;
  font-weight:700;letter-spacing:2px;text-transform:uppercase;
  display:flex;align-items:center;gap:5px;
}
.live-dot{
  width:5px;height:5px;border-radius:50%;background:var(--hot);
  box-shadow:0 0 8px var(--hot);
  animation:pulse 1.2s ease-in-out infinite;
}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.2}}

.me-pill{
  margin-left:auto;display:flex;align-items:center;gap:9px;
  padding:5px 12px 5px 5px;
  background:rgba(255,0,68,.08);
  border:1px solid rgba(255,0,68,.35);
  border-radius:30px;cursor:pointer;transition:.2s;
}
.me-pill:hover{background:rgba(255,0,68,.15);border-color:var(--hot)}
.me-pill-avatar{
  width:30px;height:30px;border-radius:50%;
  display:grid;place-items:center;font-weight:800;font-size:11px;color:#fff;
  background:linear-gradient(135deg,var(--hot),var(--violet));
}
.me-pill-name{font-size:11.5px;font-weight:700;max-width:100px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

/* ============ IDENTITY PICKER ============ */
.picker{
  position:fixed;inset:62px 0 0 0;z-index:20;
  background:#000;overflow-y:auto;
  padding:26px 18px 40px;
  transition:transform .5s cubic-bezier(.7,0,.2,1);
}
.picker.hidden{transform:translateY(-102%);pointer-events:none}
.picker h2{
  font-family:'Bebas Neue',sans-serif;
  font-size:44px;line-height:.9;letter-spacing:2px;text-align:center;
  background:linear-gradient(180deg,#fff 0%,var(--hot) 70%);
  -webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;
  margin-bottom:6px;
}
.picker-sub{
  text-align:center;font-size:11px;color:var(--muted);
  letter-spacing:2.5px;text-transform:uppercase;font-weight:700;
  margin-bottom:22px;
}
.picker-search{position:relative;max-width:480px;margin:0 auto 18px}
.picker-search input{
  width:100%;padding:13px 18px;
  background:#0a020e;border:1px solid var(--line);border-radius:12px;
  color:#fff;font-size:13px;outline:none;font-family:inherit;font-weight:600;
}
.picker-search input:focus{border-color:var(--hot);box-shadow:0 0 0 3px rgba(255,0,68,.2)}
.picker-search input::placeholder{color:var(--muted)}

.picker-grid{
  max-width:760px;margin:0 auto;
  display:grid;grid-template-columns:repeat(auto-fill,minmax(120px,1fr));
  gap:8px;
}
.picker-tile{
  padding:12px 8px;background:#0a020e;
  border:1px solid var(--line);border-radius:12px;
  cursor:pointer;text-align:center;transition:.2s;
}
.picker-tile:hover{
  border-color:var(--hot);
  box-shadow:0 0 20px rgba(255,0,68,.3);
  transform:translateY(-2px);
}
.picker-tile .pt-av{
  width:44px;height:44px;border-radius:50%;margin:0 auto 7px;
  display:grid;place-items:center;font-weight:800;font-size:14px;color:#fff;
  background:linear-gradient(135deg,var(--hot),var(--violet));
}
.picker-tile .pt-name{
  font-size:11px;font-weight:700;white-space:nowrap;
  overflow:hidden;text-overflow:ellipsis;
}
.picker-tile .pt-loc{
  font-size:9px;color:var(--muted);margin-top:2px;
  text-transform:uppercase;letter-spacing:1px;font-weight:700;
}

/* ============ RADAR ============ */
.radar-wrap{
  position:fixed;inset:62px 0 130px 0;z-index:10;
  display:flex;align-items:center;justify-content:center;
  opacity:0;pointer-events:none;transition:opacity .6s;
}
.radar-wrap.active{opacity:1;pointer-events:auto}
.radar{
  position:relative;width:min(92vw, 720px);height:min(92vw, 720px);
  max-height:100%;aspect-ratio:1;
}
svg.radar-svg{width:100%;height:100%;display:block}

.ring{
  fill:none;stroke:rgba(255,0,68,.12);stroke-width:1;
}
.ring-label{
  font-family:'Bebas Neue',sans-serif;font-size:10px;
  fill:rgba(255,0,68,.5);letter-spacing:2px;
}
.sweep{
  transform-origin:center;
  animation:sweep 6s linear infinite;
}
@keyframes sweep{to{transform:rotate(360deg)}}

.blip{
  cursor:pointer;
  transform-origin:center;
  animation:blipPulse 2.5s ease-in-out infinite;
}
@keyframes blipPulse{
  0%,100%{opacity:.7}
  50%{opacity:1}
}
.blip:hover .blip-core{ r:9; }
.blip .blip-core{
  transition:r .25s, filter .25s;
  filter:drop-shadow(0 0 8px currentColor) drop-shadow(0 0 16px currentColor);
}
.blip:hover .blip-core{
  r:10;
  filter:drop-shadow(0 0 12px currentColor) drop-shadow(0 0 30px currentColor);
}
.blip-ring{
  fill:none;stroke:currentColor;stroke-width:1;
  opacity:.5;
  animation:blipRing 2.5s ease-out infinite;
  transform-origin:center;
}
@keyframes blipRing{
  0%{transform:scale(1);opacity:.6}
  100%{transform:scale(2.6);opacity:0}
}
.me-center{
  filter:drop-shadow(0 0 12px var(--hot)) drop-shadow(0 0 30px var(--hot));
}
.me-center-pulse{
  transform-origin:center;
  animation:mePulse 2s ease-out infinite;
}
@keyframes mePulse{
  0%{r:6;opacity:.8}
  100%{r:26;opacity:0}
}
.me-label{
  font-family:'Bebas Neue',sans-serif;font-size:12px;
  fill:#fff;letter-spacing:3px;
  text-anchor:middle;
}

.radar-hint{
  position:absolute;bottom:-30px;left:0;right:0;
  text-align:center;font-size:10.5px;color:var(--muted);
  letter-spacing:2px;text-transform:uppercase;font-weight:700;
}
.radar-hint .live-dot{display:inline-block;vertical-align:middle;margin-right:6px}

.refresh-btn{
  position:absolute;bottom:-80px;left:50%;transform:translateX(-50%);
  padding:12px 24px;
  background:rgba(255,0,68,.1);
  border:1px solid rgba(255,0,68,.4);
  border-radius:30px;color:var(--hot);
  font-size:11px;font-weight:800;letter-spacing:2px;
  text-transform:uppercase;cursor:pointer;font-family:inherit;
  display:flex;align-items:center;gap:8px;
  transition:.2s;
}
.refresh-btn:hover{
  background:rgba(255,0,68,.2);
  box-shadow:0 0 24px rgba(255,0,68,.4);
}
.refresh-btn svg{transition:transform .6s}
.refresh-btn:hover svg{transform:rotate(180deg)}

/* ============ REVEAL MODAL ============ */
.reveal{
  position:fixed;inset:0;z-index:100;
  display:flex;align-items:center;justify-content:center;
  background:rgba(0,0,0,.85);backdrop-filter:blur(30px);
  opacity:0;pointer-events:none;transition:opacity .4s;
  padding:20px;
}
.reveal.show{opacity:1;pointer-events:auto}

.reveal-card{
  position:relative;
  width:100%;max-width:420px;max-height:calc(100vh - 40px);
  background:linear-gradient(180deg,#0a020e 0%,#000 100%);
  border:1px solid rgba(255,0,68,.35);
  border-radius:26px;overflow:hidden;
  box-shadow:
    0 30px 80px rgba(0,0,0,.9),
    0 0 60px rgba(255,0,68,.25);
  transform:scale(.85);transition:transform .45s cubic-bezier(.34,1.56,.64,1);
  display:flex;flex-direction:column;
}
.reveal.show .reveal-card{transform:scale(1)}

/* Timer bar */
.timer-bar{
  height:3px;background:rgba(255,0,68,.15);
  position:relative;overflow:hidden;
}
.timer-fill{
  height:100%;
  background:linear-gradient(90deg,var(--violet),var(--hot));
  box-shadow:0 0 12px var(--hot);
  transition:width 1s linear;
}

/* Reveal body */
.reveal-body{
  padding:26px 24px 22px;text-align:center;
  overflow-y:auto;flex:1;
}

/* Blurred silhouette avatar */
.silhouette{
  position:relative;
  width:130px;height:130px;margin:0 auto 20px;
  border-radius:50%;
  background:radial-gradient(circle at 50% 40%, #2a0a1a, #0a020e);
  border:1px solid rgba(255,0,68,.4);
  display:grid;place-items:center;
  overflow:hidden;
  transition:.5s;
}
.silhouette::before{
  content:'';position:absolute;inset:0;
  background:
    radial-gradient(circle at 50% 35%, rgba(255,0,68,.15), transparent 60%);
  animation:breathe 3s ease-in-out infinite;
}
.silhouette-initials{
  font-family:'Bebas Neue',sans-serif;
  font-size:48px;color:var(--hot);
  opacity:.15;
  letter-spacing:-1px;
  filter:blur(6px);
  transition:.6s;
  user-select:none;
}
.silhouette.revealed .silhouette-initials{
  opacity:1;filter:blur(0);
  text-shadow:0 0 20px var(--hot);
}

/* Distance chip */
.distance{
  display:inline-flex;align-items:center;gap:6px;
  padding:5px 12px;border-radius:20px;
  background:rgba(255,0,68,.1);
  border:1px solid rgba(255,0,68,.3);
  font-size:10.5px;font-weight:800;letter-spacing:1.5px;
  color:var(--hot);text-transform:uppercase;
  margin-bottom:16px;
}
.distance svg{color:var(--hot)}

/* Vibe tag */
.vibe-tag{
  font-family:'Bebas Neue',sans-serif;
  font-size:20px;letter-spacing:2.5px;
  color:#fff;line-height:1;
  margin-bottom:6px;
  text-shadow:0 0 20px rgba(255,0,68,.4);
}
.role-tag{
  font-size:10px;color:var(--muted);
  letter-spacing:2px;text-transform:uppercase;font-weight:700;
  margin-bottom:18px;
}

/* Name reveal */
.reveal-name{
  font-family:'Bebas Neue',sans-serif;
  font-size:32px;letter-spacing:2px;line-height:1;
  color:#fff;margin-bottom:4px;
  opacity:0;transform:translateY(8px);transition:.5s;
  text-shadow:0 0 30px var(--hot);
}
.reveal-name.shown{opacity:1;transform:translateY(0)}
.reveal-age{
  font-size:11px;color:var(--muted);font-weight:700;
  letter-spacing:2px;text-transform:uppercase;
  opacity:0;transition:.5s;transition-delay:.15s;
}
.reveal-age.shown{opacity:1}

/* Bio */
.reveal-bio{
  margin-top:18px;padding:14px 16px;
  background:rgba(255,255,255,.03);
  border-left:2px solid var(--hot);
  border-radius:8px;
  font-size:13px;line-height:1.55;
  font-style:italic;color:#d0b8c8;
  text-align:left;
  opacity:0;transform:translateY(8px);
  transition:.5s;
  max-height:0;overflow:hidden;padding-top:0;padding-bottom:0;
  margin-top:0;
}
.reveal-bio.shown{
  opacity:1;transform:translateY(0);
  max-height:200px;padding-top:14px;padding-bottom:14px;margin-top:18px;
}

/* Interests */
.reveal-interests{
  display:flex;flex-wrap:wrap;gap:6px;justify-content:center;
  margin-top:16px;
  opacity:0;transition:.5s;
  max-height:0;overflow:hidden;
}
.reveal-interests.shown{opacity:1;max-height:200px;margin-top:16px}
.int-chip{
  font-size:10.5px;padding:5px 11px;
  border-radius:20px;
  background:rgba(255,255,255,.05);
  border:1px solid rgba(255,255,255,.1);
  color:#c8b0d8;font-weight:700;
}
.int-chip.common{
  background:linear-gradient(135deg,rgba(255,0,68,.25),rgba(122,26,255,.25));
  border-color:var(--hot);color:#fff;
  box-shadow:0 0 12px rgba(255,0,68,.5);
}

/* Match % reveal */
.match-reveal{
  margin-top:16px;
  opacity:0;transition:.5s;
  max-height:0;overflow:hidden;
}
.match-reveal.shown{
  opacity:1;max-height:200px;margin-top:16px;
}
.match-meter{
  display:flex;align-items:center;gap:10px;
}
.match-meter-bar{
  flex:1;height:6px;border-radius:6px;
  background:rgba(255,255,255,.06);overflow:hidden;
}
.match-meter-fill{
  height:100%;
  background:linear-gradient(90deg,var(--violet),var(--hot));
  box-shadow:0 0 12px var(--hot);
  width:0;transition:width .8s ease;
}
.match-meter-pct{
  font-family:'Bebas Neue',sans-serif;font-size:22px;
  color:var(--hot);letter-spacing:1px;
  text-shadow:0 0 16px var(--hot);
  min-width:52px;text-align:right;
}
.match-reason{
  font-size:10px;color:var(--muted);margin-top:6px;
  letter-spacing:1.5px;text-transform:uppercase;font-weight:700;
}

/* Reveal action button */
.reveal-action{
  display:flex;gap:10px;padding:0 24px 22px;
}
.reveal-action button{
  flex:1;padding:16px;border-radius:14px;
  font-family:inherit;font-size:12px;font-weight:900;
  letter-spacing:2px;text-transform:uppercase;cursor:pointer;
  transition:.2s;border:none;
}
.btn-reveal{
  background:linear-gradient(135deg,var(--hot),var(--violet));
  color:#fff;
  box-shadow:0 10px 30px rgba(255,0,68,.5);
}
.btn-reveal:hover{
  transform:translateY(-2px);
  box-shadow:0 14px 40px rgba(255,0,68,.7);
}
.btn-skip{
  flex:0 0 auto;padding:16px 22px;
  background:rgba(255,255,255,.04);
  border:1px solid rgba(255,255,255,.1);
  color:var(--muted);
}
.btn-skip:hover{color:#fff;border-color:rgba(255,255,255,.3)}

/* Match / Skip actions after full reveal */
.match-actions{
  display:flex;gap:10px;padding:0 24px 22px;
}
.match-actions button{
  flex:1;padding:18px;border-radius:14px;
  font-family:inherit;font-size:13px;font-weight:900;
  letter-spacing:2px;text-transform:uppercase;cursor:pointer;
  transition:.2s;border:none;
}
.btn-nope{
  background:rgba(255,255,255,.04);
  border:1px solid rgba(255,255,255,.12);
  color:#888;
}
.btn-nope:hover{color:#fff;border-color:#666}
.btn-fire{
  background:linear-gradient(135deg,var(--hot),var(--violet));
  color:#fff;
  box-shadow:0 10px 40px rgba(255,0,68,.6);
  animation:firePulse 1.8s ease-in-out infinite;
}
.btn-fire:hover{
  transform:translateY(-2px) scale(1.02);
  animation:none;
  box-shadow:0 14px 50px rgba(255,0,68,.9);
}
@keyframes firePulse{
  0%,100%{box-shadow:0 10px 30px rgba(255,0,68,.5)}
  50%{box-shadow:0 14px 44px rgba(255,0,68,.85)}
}

/* ============ MATCH OVERLAY ============ */
.match-overlay{
  position:fixed;inset:0;z-index:200;
  display:flex;align-items:center;justify-content:center;
  background:radial-gradient(circle at center, rgba(255,0,68,.9) 0%, rgba(0,0,0,.98) 70%);
  opacity:0;pointer-events:none;transition:opacity .25s;
  padding:20px;
}
.match-overlay.show{opacity:1;pointer-events:auto}

.match-content{
  text-align:center;max-width:440px;
  transform:scale(.4);transition:transform .55s cubic-bezier(.34,1.56,.64,1);
}
.match-overlay.show .match-content{transform:scale(1)}

.match-big{
  font-family:'Bebas Neue',sans-serif;
  font-size:clamp(52px, 14vw, 96px);
  line-height:.85;letter-spacing:4px;
  color:#fff;
  text-shadow:
    0 0 20px var(--hot),
    0 0 60px var(--hot),
    0 0 120px var(--violet);
  animation:shake .5s ease-in-out;
}
@keyframes shake{
  0%,100%{transform:translateX(0)}
  20%{transform:translateX(-6px) rotate(-1deg)}
  40%{transform:translateX(6px) rotate(1deg)}
  60%{transform:translateX(-4px)}
  80%{transform:translateX(4px)}
}
.match-names-row{
  display:flex;align-items:center;justify-content:center;gap:12px;
  margin-top:22px;flex-wrap:wrap;
}
.mn{
  font-family:'Bebas Neue',sans-serif;
  font-size:22px;letter-spacing:2px;
  padding:10px 18px;border-radius:14px;
  background:rgba(0,0,0,.5);
  border:1.5px solid rgba(255,255,255,.4);
  backdrop-filter:blur(10px);
}
.mn-plus{font-size:24px;color:#fff;font-weight:900}
.match-pct-big{
  font-family:'Bebas Neue',sans-serif;
  font-size:56px;letter-spacing:2px;
  color:#fff;margin-top:24px;
  text-shadow:0 0 30px #fff, 0 0 60px var(--hot);
  line-height:1;
}
.match-pct-big small{font-size:28px;opacity:.8}
.match-sub-line{
  font-size:12px;color:#fff;
  letter-spacing:3px;text-transform:uppercase;font-weight:800;
  margin-top:8px;opacity:.85;
}
.match-continue{
  margin-top:30px;padding:16px 44px;
  background:#fff;border:none;border-radius:14px;
  color:#000;font-family:inherit;font-size:13px;font-weight:900;
  letter-spacing:3px;text-transform:uppercase;cursor:pointer;
  transition:.2s;
}
.match-continue:hover{transform:scale(1.05)}

.confetti{
  position:fixed;z-index:199;pointer-events:none;
  animation:fall linear forwards;
}
@keyframes fall{
  0%{transform:translateY(-10vh) rotate(0);opacity:1}
  100%{transform:translateY(110vh) rotate(720deg);opacity:0}
}

/* ============ SUMMARY ============ */
.summary{
  position:fixed;inset:62px 0 0 0;z-index:80;
  background:#000;overflow-y:auto;padding:28px 18px 100px;
  transform:translateY(100%);
  transition:transform .55s cubic-bezier(.7,0,.2,1);
}
.summary.show{transform:translateY(0)}
.summary h2{
  font-family:'Bebas Neue',sans-serif;
  font-size:52px;line-height:.9;letter-spacing:3px;text-align:center;
  background:linear-gradient(180deg,#fff 0%,var(--hot) 70%);
  -webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;
  margin-bottom:8px;
  text-shadow:0 0 40px rgba(255,0,68,.3);
}
.summary-sub{
  text-align:center;font-size:11.5px;color:var(--muted);
  letter-spacing:2px;text-transform:uppercase;font-weight:700;
  margin-bottom:24px;
}
.summary-sub strong{color:var(--hot);font-weight:900}
.summary-stats{
  display:grid;grid-template-columns:repeat(3,1fr);gap:8px;
  max-width:520px;margin:0 auto 28px;
}
.sstat{
  background:#0a020e;border:1px solid var(--line);
  border-radius:12px;padding:14px 8px;text-align:center;
  position:relative;overflow:hidden;
}
.sstat::before{
  content:'';position:absolute;top:0;left:0;right:0;height:1.5px;
  background:linear-gradient(90deg,transparent,var(--hot),transparent);
}
.sstat-num{
  font-family:'Bebas Neue',sans-serif;
  font-size:32px;letter-spacing:-1px;line-height:1;
  color:var(--hot);
  text-shadow:0 0 20px rgba(255,0,68,.6);
}
.sstat-num.dim{color:var(--muted);text-shadow:none}
.sstat-num.purple{color:#a855f7;text-shadow:0 0 20px rgba(168,85,247,.6)}
.sstat-lbl{
  font-size:9px;color:var(--muted);text-transform:uppercase;
  letter-spacing:1.5px;font-weight:800;margin-top:5px;
}

.ship-list{max-width:560px;margin:0 auto;display:flex;flex-direction:column;gap:8px}
.ship-row{
  display:flex;align-items:center;gap:12px;
  padding:12px 14px;
  background:#0a020e;border:1px solid var(--line);border-radius:12px;
  transition:.2s;position:relative;overflow:hidden;
  animation:shipIn .4s ease backwards;
}
.ship-row::before{
  content:'';position:absolute;left:0;top:0;bottom:0;width:2px;
  background:linear-gradient(180deg,var(--hot),var(--violet));
  box-shadow:0 0 12px var(--hot);
}
.ship-row:hover{border-color:rgba(255,0,68,.5);transform:translateX(3px)}
@keyframes shipIn{0%{transform:translateX(-20px);opacity:0}100%{transform:translateX(0);opacity:1}}
.ship-av{
  width:42px;height:42px;border-radius:50%;flex-shrink:0;
  display:grid;place-items:center;font-weight:800;font-size:14px;color:#fff;
  background:linear-gradient(135deg,var(--hot),var(--violet));
}
.ship-info{flex:1;min-width:0}
.ship-name{font-size:13.5px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ship-meta{
  font-size:10px;color:var(--muted);margin-top:2px;
  text-transform:uppercase;letter-spacing:1.3px;font-weight:700;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
}
.ship-pct{
  font-family:'Bebas Neue',sans-serif;
  font-size:22px;letter-spacing:.5px;color:var(--hot);
  text-shadow:0 0 12px var(--hot);
}
.ship-pct small{font-size:11px;opacity:.7}

.no-ships{
  text-align:center;padding:60px 20px;color:var(--muted);
  font-size:13px;line-height:1.7;letter-spacing:.5px;
}
.no-ships .icon{font-size:52px;display:block;margin-bottom:14px;opacity:.3}

.summary-actions{
  display:flex;justify-content:center;gap:10px;
  margin-top:30px;flex-wrap:wrap;
}
.summary-actions button{
  padding:14px 26px;
  background:linear-gradient(135deg,var(--hot),var(--violet));
  border:none;border-radius:12px;color:#fff;
  font-family:inherit;font-size:11.5px;font-weight:900;
  letter-spacing:2px;text-transform:uppercase;cursor:pointer;
  transition:.2s;
  box-shadow:0 8px 24px rgba(255,0,68,.4);
}
.summary-actions button.ghost{
  background:transparent;border:1px solid var(--line);
  box-shadow:none;color:var(--text);
}
.summary-actions button:hover{transform:translateY(-2px)}
.summary-actions button.ghost:hover{border-color:var(--hot);color:var(--hot)}

@media (max-width:600px){
  .brand-text h1{font-size:17px}
  .brand-text p{font-size:8.5px}
  .me-pill-name{display:none}
  .picker h2{font-size:34px}
  .picker-grid{grid-template-columns:repeat(auto-fill,minmax(100px,1fr))}
  .reveal-card{max-width:100%}
  .summary h2{font-size:40px}
  .summary-stats{grid-template-columns:1fr 1fr}
  .summary-stats .sstat:last-child{grid-column:span 2}
}
::-webkit-scrollbar{width:6px}
::-webkit-scrollbar-thumb{background:var(--line);border-radius:3px}
</style>
</head>

/* =========================================================
   HELPERS
   ========================================================= */
function hash(s){let h=7;for(let i=0;i<s.length;i++)h=(h*31+s.charCodeAt(i))>>>0;return h;}
function vibeFor(id){return VIBES[hash(id)%VIBES.length];}
function roleFor(id){return ROLES[hash(id+'r')%ROLES.length];}
function initials(n){return n.split(' ').filter(w=>w.length>1).slice(0,2).map(w=>w[0]).join('').toUpperCase();}
function compatibility(a,b){
  let s=22;
  const common=a.i.filter(x=>b.i.includes(x));
  s+=common.length*12;
  if(a.l===b.l)s+=16;
  const d=Math.abs(a.a-b.a);
  if(d<=3)s+=16; else if(d<=7)s+=10; else if(d<=12)s+=4; else if(d>20)s-=4;
  s+=hash(a.id+b.id)%9;
  return {score:Math.max(15,Math.min(98,s)),common};
}

/* =========================================================
   STATE
   ========================================================= */
let me=null;
let blips=[];       // { person, score, common, distance, angle, radius, el }
let currentBlip=null;
let revealStage=0;
let timerInterval=null;
let timeLeft=15;
let matches=[];
let skipped=0;

const picker=document.getElementById('picker');
const radarWrap=document.getElementById('radarWrap');
const radarSvg=document.getElementById('radarSvg');
const reveal=document.getElementById('reveal');
const revealBody=document.getElementById('revealBody');
const matchOverlay=document.getElementById('matchOverlay');
const summary=document.getElementById('summary');

/* =========================================================
   PICKER
   ========================================================= */
function renderPicker(filter=''){
  const grid=document.getElementById('pickerGrid');
  const f=filter.toLowerCase().trim();
  const list=PEOPLE.filter(p=>!f||p.n.toLowerCase().includes(f)||p.l.toLowerCase().includes(f));
  grid.innerHTML=list.map(p=>`
    <div class="picker-tile" data-id="${p.id}">
      <div class="pt-av">${initials(p.n)}</div>
      <div class="pt-name">${p.n.split(' ')[0]}</div>
      <div class="pt-loc">${p.l.split(' ')[0]}</div>
    </div>
  `).join('');
  grid.querySelectorAll('.picker-tile').forEach(t=>{
    t.addEventListener('click',()=>selectMe(t.dataset.id));
  });
}
document.getElementById('pickerSearch').addEventListener('input',e=>renderPicker(e.target.value));

function selectMe(id){
  me=PEOPLE.find(p=>p.id===id);
  if(!me)return;
  document.getElementById('mePill').style.display='flex';
  document.getElementById('mePillAv').textContent=initials(me.n);
  document.getElementById('mePillName').textContent=me.n.split(' ')[0];
  picker.classList.add('hidden');
  radarWrap.classList.add('active');
  spawnBlips();
}

/* =========================================================
   RADAR
   ========================================================= */
function spawnBlips(){
  if(!me)return;
  const candidates=PEOPLE.filter(p=>p.id!==me.id);
  // pick 10-14 random
  const shuffled=[...candidates].sort(()=>Math.random()-0.5);
  const count=Math.floor(10+Math.random()*5);
  blips=shuffled.slice(0,count).map(p=>{
    const c=compatibility(me,p);
    // distance: 80m to 900m
    const distance=Math.floor(80+Math.random()*820);
    // angle random
    const angle=Math.random()*Math.PI*2;
    // radius scaled: 80m→ inner ring, 900m→ outer
    const radiusNorm=(distance-80)/820; // 0..1
    const radiusPx=90+radiusNorm*200;   // svg viewBox 600, center 300
    return {
      person:p,
      score:c.score,
      common:c.common,
      distance, angle, radiusPx
    };
  });
  drawRadar();
}

function drawRadar(){
  radarSvg.innerHTML='';
  const NS='http://www.w3.org/2000/svg';
  const cx=300, cy=300;

  // Rings
  [90,150,210,280].forEach((r,i)=>{
    const c=document.createElementNS(NS,'circle');
    c.setAttribute('cx',cx);c.setAttribute('cy',cy);c.setAttribute('r',r);
    c.setAttribute('class','ring');
    radarSvg.appendChild(c);
    const lbl=document.createElementNS(NS,'text');
    lbl.setAttribute('x',cx);lbl.setAttribute('y',cy-r+14);
    lbl.setAttribute('class','ring-label');
    lbl.setAttribute('text-anchor','middle');
    lbl.textContent = ['100m','300m','600m','1km'][i];
    radarSvg.appendChild(lbl);
  });

  // Cross lines
  [0,90,180,270].forEach(deg=>{
    const rad=deg*Math.PI/180;
    const line=document.createElementNS(NS,'line');
    line.setAttribute('x1',cx+Math.cos(rad)*20);
    line.setAttribute('y1',cy+Math.sin(rad)*20);
    line.setAttribute('x2',cx+Math.cos(rad)*290);
    line.setAttribute('y2',cy+Math.sin(rad)*290);
    line.setAttribute('stroke','rgba(255,0,68,.06)');
    line.setAttribute('stroke-width','1');
    radarSvg.appendChild(line);
  });

  // Sweep
  const sweepG=document.createElementNS(NS,'g');
  sweepG.setAttribute('class','sweep');
  const sweepPath=document.createElementNS(NS,'path');
  sweepPath.setAttribute('d', `M ${cx} ${cy} L ${cx} ${cy-290} A 290 290 0 0 1 ${cx+290*Math.sin(0.5)} ${cy-290*Math.cos(0.5)} Z`);
  sweepPath.setAttribute('fill','url(#sweepGrad)');
  sweepG.appendChild(sweepPath);
  radarSvg.appendChild(sweepG);

  // Gradient defs
  const defs=document.createElementNS(NS,'defs');
  const grad=document.createElementNS(NS,'linearGradient');
  grad.setAttribute('id','sweepGrad');
  grad.setAttribute('x1','0%');grad.setAttribute('y1','0%');
  grad.setAttribute('x2','100%');grad.setAttribute('y2','0%');
  const s1=document.createElementNS(NS,'stop');
  s1.setAttribute('offset','0%');s1.setAttribute('stop-color','rgba(255,0,68,.4)');
  const s2=document.createElementNS(NS,'stop');
  s2.setAttribute('offset','100%');s2.setAttribute('stop-color','rgba(255,0,68,0)');
  grad.appendChild(s1);grad.appendChild(s2);
  defs.appendChild(grad);
  radarSvg.insertBefore(defs, radarSvg.firstChild);

  // Me center
  const meC=document.createElementNS(NS,'circle');
  meC.setAttribute('cx',cx);meC.setAttribute('cy',cy);meC.setAttribute('r',6);
  meC.setAttribute('fill','#ff0044');
  meC.setAttribute('class','me-center');
  radarSvg.appendChild(meC);

  const mePulse=document.createElementNS(NS,'circle');
  mePulse.setAttribute('cx',cx);mePulse.setAttribute('cy',cy);mePulse.setAttribute('r',6);
  mePulse.setAttribute('fill','none');
  mePulse.setAttribute('stroke','#ff0044');
  mePulse.setAttribute('stroke-width','2');
  mePulse.setAttribute('class','me-center-pulse');
  radarSvg.appendChild(mePulse);

  const meLbl=document.createElementNS(NS,'text');
  meLbl.setAttribute('x',cx);meLbl.setAttribute('y',cy+22);
  meLbl.setAttribute('class','me-label');
  meLbl.textContent='TÚ';
  radarSvg.appendChild(meLbl);

  // Blips
  blips.forEach(b=>{
    const x=cx+Math.cos(b.angle)*b.radiusPx;
    const y=cy+Math.sin(b.angle)*b.radiusPx;
    b.x=x;b.y=y;

    const g=document.createElementNS(NS,'g');
    g.setAttribute('class','blip');
    g.setAttribute('style',`color:#ff0044`);

    const ring=document.createElementNS(NS,'circle');
    ring.setAttribute('cx',x);ring.setAttribute('cy',y);ring.setAttribute('r',6);
    ring.setAttribute('class','blip-ring');
    g.appendChild(ring);

    const core=document.createElementNS(NS,'circle');
    core.setAttribute('cx',x);core.setAttribute('cy',y);core.setAttribute('r',5);
    core.setAttribute('fill','#ff0044');
    core.setAttribute('class','blip-core');
    g.appendChild(core);

    g.addEventListener('click',()=>openReveal(b));
    radarSvg.appendChild(g);
  });
}

document.getElementById('refreshBtn').addEventListener('click',()=>{
  spawnBlips();
});

/* =========================================================
   REVEAL
   ========================================================= */
function openReveal(blip){
  currentBlip=blip;
  revealStage=0;
  reveal.classList.add('show');
  renderRevealStage();
  startTimer();
}

function startTimer(){
  clearInterval(timerInterval);
  timeLeft=15;
  const fill=document.getElementById('timerFill');
  fill.style.width='100%';
  timerInterval=setInterval(()=>{
    timeLeft-=0.1;
    fill.style.width=(timeLeft/15*100)+'%';
    if(timeLeft<=0){
      clearInterval(timerInterval);
      closeReveal(true);
    }
  },100);
}

function stopTimer(){
  clearInterval(timerInterval);
}

function closeReveal(expired=false){
  stopTimer();
  reveal.classList.remove('show');
  if(expired && currentBlip){
    // remove blip visually
    skipped++;
  }
  currentBlip=null;
}

function renderRevealStage(){
  const b=currentBlip;
  const p=b.person;
  const vibe=vibeFor(p.id);
  const role=roleFor(p.id);

  const commonSet=new Set(b.common);

  // Stage 0: silhouette + distance + vibe
  // Stage 1: name revealed
  // Stage 2: bio revealed
  // Stage 3: interests revealed
  // Stage 4: match% revealed + actions

  const revealBtnHTML = revealStage < 4
    ? `<button class="btn-reveal" id="btnReveal">REVELAR ${revealStage===0?'NOMBRE':revealStage===1?'HISTORIA':revealStage===2?'AFINIDAD':'TODO'}</button>
       <button class="btn-skip" id="btnSkip">✕</button>`
    : `<button class="btn-nope" id="btnNope">NEXT</button>
       <button class="btn-fire" id="btnFire">🔥 MATCH</button>`;

  revealBody.innerHTML=`
    <div class="silhouette ${revealStage>=1?'revealed':''}">
      <div class="silhouette-initials">${initials(p.n)}</div>
    </div>

    <div class="distance">
      <svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round">
        <path d="M20 10c0 6-8 12-8 12s-8-6-8-12a8 8 0 0 1 16 0Z"/><circle cx="12" cy="10" r="3"/>
      </svg>
      A ${b.distance}m DE TI
    </div>

    <div class="vibe-tag">${vibe}</div>
    <div class="role-tag">${role}</div>

    <div class="reveal-name ${revealStage>=1?'shown':''}">${p.n.toUpperCase()}</div>
    <div class="reveal-age ${revealStage>=1?'shown':''}">${p.a} AÑOS · ${p.r}</div>

    <div class="reveal-bio ${revealStage>=2?'shown':''}">"${p.b}"</div>

    <div class="reveal-interests ${revealStage>=3?'shown':''}">
      ${p.i.map(int=>`<span class="int-chip ${commonSet.has(int)?'common':''}">${commonSet.has(int)?'♥ ':''}${int}</span>`).join('')}
    </div>

    <div class="match-reveal ${revealStage>=4?'shown':''}">
      <div class="match-meter">
        <div class="match-meter-bar">
          <div class="match-meter-fill" id="meterFill" style="width:0%"></div>
        </div>
        <div class="match-meter-pct" id="meterPct">0%</div>
      </div>
      <div class="match-reason">${b.score>=80?'ALMAS GEMELAS':b.score>=65?'FUEGO PURO':b.score>=50?'HAY QUÍMICA':'PUEDE ARDER'}</div>
    </div>
  `;

  // Add actions row (outside body, but we inject inside body for simplicity)
  const actionsDiv=document.createElement('div');
  actionsDiv.className = revealStage < 4 ? 'reveal-action' : 'match-actions';
  actionsDiv.innerHTML = revealBtnHTML;
  revealBody.appendChild(actionsDiv);

  // Wire buttons
  if(revealStage<4){
    document.getElementById('btnReveal').addEventListener('click',()=>{
      revealStage++;
      renderRevealStage();
    });
    document.getElementById('btnSkip').addEventListener('click',()=>{
      skipped++;
      closeReveal();
    });
  } else {
    // Animate meter
    setTimeout(()=>{
      const f=document.getElementById('meterFill');
      const pct=document.getElementById('meterPct');
      if(f){f.style.width=b.score+'%';}
      if(pct){
        let cur=0;
        const inc=setInterval(()=>{
          cur+=2;
          if(cur>=b.score){cur=b.score;clearInterval(inc);}
          pct.textContent=cur+'%';
        },20);
      }
    },100);

    document.getElementById('btnNope').addEventListener('click',()=>{
      skipped++;
      closeReveal();
    });
    document.getElementById('btnFire').addEventListener('click',()=>{
      doMatch(b);
    });
  }
}

/* =========================================================
   MATCH
   ========================================================= */
function doMatch(blip){
  stopTimer();
  matches.push(blip);
  reveal.classList.remove('show');
  showMatchOverlay(blip);
}

function showMatchOverlay(blip){
  const p=blip.person;
  document.getElementById('matchNamesRow').innerHTML=`
    <div class="mn">${me.n.split(' ')[0].toUpperCase()}</div>
    <div class="mn-plus">+</div>
    <div class="mn">${p.n.split(' ')[0].toUpperCase()}</div>
  `;
  document.getElementById('matchPctBig').innerHTML=`${blip.score}<small>%</small>`;
  document.getElementById('matchSubLine').textContent=`${vibeFor(p.id)} · a ${blip.distance}m`;
  matchOverlay.classList.add('show');
  launchConfetti();
  // Vibration
  if(navigator.vibrate) navigator.vibrate([100,50,200,50,300]);
}

document.getElementById('matchContinue').addEventListener('click',()=>{
  matchOverlay.classList.remove('show');
  spawnBlips(); // new set of blips
  if(matches.length >= 10 || blips.length === 0){
    // keep going
  }
});

function launchConfetti(){
  const colors=['#ff0044','#ff1a6c','#7a1aff','#fff'];
  for(let i=0;i<50;i++){
    setTimeout(()=>{
      const c=document.createElement('div');
      c.className='confetti';
      c.style.left=Math.random()*100+'vw';
      c.style.top='-20px';
      c.style.width=c.style.height=(5+Math.random()*9)+'px';
      c.style.background=colors[Math.floor(Math.random()*colors.length)];
      c.style.borderRadius=Math.random()>0.5?'50%':'2px';
      c.style.animationDuration=(1.8+Math.random()*2)+'s';
      document.body.appendChild(c);
      setTimeout(()=>c.remove(),4000);
    },i*18);
  }
}

/* =========================================================
   SUMMARY (auto after N matches or button)
   ========================================================= */
function showSummary(){
  // Not used automatically for now, but available
  const avg=matches.length?Math.round(matches.reduce((a,m)=>a+m.score,0)/matches.length):0;
  const sorted=[...matches].sort((a,b)=>b.score-a.score);
  summary.innerHTML=`
    <h2>TU CACERÍA</h2>
    <p class="summary-sub">Eres <strong>${me.n}</strong> · ${matches.length} ${matches.length===1?'presa':'presas'} capturadas</p>
    <div class="summary-stats">
      <div class="sstat"><div class="sstat-num">${matches.length}</div><div class="sstat-lbl">Matches 🔥</div></div>
      <div class="sstat"><div class="sstat-num dim">${skipped}</div><div class="sstat-lbl">Ignorados</div></div>
      <div class="sstat"><div class="sstat-num purple">${avg}%</div><div class="sstat-lbl">Promedio</div></div>
    </div>
    ${sorted.length?`
      <div class="ship-list">
        ${sorted.map((b,i)=>`
          <div class="ship-row" style="animation-delay:${i*0.04}s">
            <div class="ship-av">${initials(b.person.n)}</div>
            <div class="ship-info">
              <div class="ship-name">${b.person.n}</div>
              <div class="ship-meta">${vibeFor(b.person.id)} · a ${b.distance}m</div>
            </div>
            <div class="ship-pct">${b.score}<small>%</small></div>
          </div>
        `).join('')}
      </div>
    `:`
      <div class="no-ships"><span class="icon">💔</span>No capturaste a nadie.<br>El radar sigue activo.</div>
    `}
    <div class="summary-actions">
      <button onclick="backToRadar()">SEGUIR CAZANDO</button>
      <button class="ghost" onclick="backToPicker()">CAMBIAR YO</button>
    </div>
  `;
  summary.classList.add('show');
}

function backToRadar(){
  summary.classList.remove('show');
  spawnBlips();
}

function backToPicker(){
  summary.classList.remove('show');
  radarWrap.classList.remove('active');
  picker.classList.remove('hidden');
  document.getElementById('mePill').style.display='none';
  document.getElementById('pickerSearch').value='';
  renderPicker('');
  me=null;
  matches=[];
  skipped=0;
}

document.getElementById('mePill').addEventListener('click',()=>{
  if(matches.length>0 || skipped>0){
    showSummary();
  } else {
    backToPicker();
  }
});

document.getElementById('brandBtn').addEventListener('click',()=>{
  if(matches.length>0 || skipped>0){
    showSummary();
  } else {
    backToPicker();
  }
});

/* INIT */
renderPicker('');
</script>
